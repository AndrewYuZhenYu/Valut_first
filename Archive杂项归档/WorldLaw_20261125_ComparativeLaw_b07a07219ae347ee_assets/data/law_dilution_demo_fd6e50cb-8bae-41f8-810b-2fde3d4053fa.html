<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>股权稀释原理演示</title><style>body{font:18px system-ui,sans-serif;color:#203047;max-width:760px;margin:30px auto;padding:20px;background:#f5f8fc}h1{font-size:28px}input{width:100%;accent-color:#2563a6}.bar{display:flex;height:48px;margin:30px 0;color:white;font-weight:bold;text-align:center}.old{background:#2563a6;display:grid;place-items:center}.new{background:#94702c;display:grid;place-items:center}article{background:white;padding:20px;border:1px solid #d4dee9;border-radius:8px;margin:12px 0}strong{color:#2563a6}small{color:#64748b}</style></head><body><h1>股权稀释原理演示</h1><p>原有股份：100万股。假设所有股份权利相同，原股东不参与新增股份认购。</p><label>新增发行股份：<strong id="val">25</strong> 万股<input id="s" type="range" min="0" max="200" step="5" value="25"></label><div class="bar"><div class="old" id="old"></div><div class="new" id="new"></div></div><p>蓝色：原股东　　金色：新股东</p><article>发行后总股数：<strong id="total"></strong></article><article>原股东持股比例：<strong id="pct"></strong></article><small>持股比例下降不必然意味着持股价值下降。表决权及控制权须结合股份类别、公司章程与适用法律分析。</small><script>const el=id=>document.getElementById(id);function draw(){let n=Number(el('s').value),p=100/(100+n)*100,q=100-p;el('val').textContent=n;el('total').textContent=(100+n)+'万股';el('pct').textContent=p.toFixed(2)+'%';el('old').style.width=p+'%';el('old').textContent=p.toFixed(1)+'%';el('new').style.width=q+'%';el('new').textContent=q?q.toFixed(1)+'%':'';}el('s').addEventListener('input',draw);draw();</script></body></html>
