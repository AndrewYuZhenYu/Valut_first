<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>杜邦分析交互演示</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:820px;margin:32px auto;padding:0 24px;color:#23374b;background:#f7f9fb}h1{font-size:27px}label{display:flex;justify-content:space-between;font-weight:600;margin:14px 0 3px}input{width:100%;accent-color:#3979b8}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:24px 0}.result{padding:14px;border:1px solid #cbd5df;border-radius:8px;background:#fff;overflow-wrap:anywhere}.result small{display:block;color:#506579}.result strong{font-size:20px}button{padding:9px 16px;border:1px solid #9caebb;background:white;border-radius:6px;font:inherit;cursor:pointer}.note{color:#506579;font-size:14px}output{font-variant-numeric:tabular-nums}svg{width:100%;height:auto;display:block;margin:12px 0;background:white}</style></head><body><h1>杜邦分析交互演示</h1><p>调整参数，观察计算结果。完全离线，无需联网。</p><div id="controls"></div><section id="results" aria-live="polite"></section><div id="visual"></div><button id="reset">恢复默认参数</button><p class="note">假设平均资产与平均权益为正，且指标采用一致口径。</p><script>const config=[["销售净利率（%）", 10, -20, 40, 1], ["资产周转率（次）", 1.5, 0.1, 4, 0.1], ["权益乘数（倍）", 2, 1, 5, 0.1]],key="dupont";const f=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});function calculate(v){const [m,a,e]=v;return [['净资产收益率 ROE',f(m*a*e)+'%'],['计算过程',`${m}% × ${a} × ${e} = ${f(m*a*e)}%`]];}const controls=document.getElementById('controls');controls.innerHTML=config.map((x,i)=>`<label for="s${i}">${x[0]}<output id="v${i}">${x[1]}</output></label><input id="s${i}" type="range" min="${x[2]}" max="${x[3]}" step="${x[4]}" value="${x[1]}">`).join('');function update(){let v=config.map((x,i)=>+document.getElementById('s'+i).value);if(key==='depreciation'){let e=document.getElementById('s1');e.max=v[0];v[1]=Math.min(v[0],v[1]);e.value=v[1]}v.forEach((n,i)=>document.getElementById('v'+i).textContent=n);document.getElementById('results').innerHTML=calculate(v).map(r=>`<div class="result"><small>${r[0]}</small><strong>${r[1]}</strong></div>`).join('');draw(v)}function draw(v){const el=document.getElementById('visual');let ls=[],labels=[];if(key==='depreciation'){let [c,s,n]=v;ls=[['账面价值（万元）',Array.from({length:n+1},(_,i)=>c-(c-s)*i/n)]];labels=ls[0][1].map((_,i)=>i===0||i===n||n<=10?i:'')}else if(key==='breakeven'){const [p,c,k,q]=v,b=p>c?k*10000/(p-c):0,m=Math.max(20000,q,b*1.25),qs=Array.from({length:6},(_,i)=>i*m/5);labels=qs.map(x=>Math.round(x));ls=[['营业收入（万）',qs.map(x=>p*x/10000)],['总成本（万）',qs.map(x=>k+c*x/10000)]]}else if(key==='npv'){const [a,c,r,n]=v;let vals=[-a];for(let i=1;i<=n;i++)vals.push(vals[i-1]+c/(1+r/100)**i);ls=[['累计折现净现金流（万）',vals]];labels=vals.map((_,i)=>n<=10||i===0||i===n?i:'')}else if(key==='ccc'){let [i,s,p]=v,m=Math.max(i+s,p,1),w=600/m;el.innerHTML=`<svg viewBox="0 0 720 180"><text x="35" y="25">存货 ${i}天 / 应收 ${s}天</text><rect x="35" y="36" width="${w*i}" height="32" fill="#3979b8"/><rect x="${35+w*i}" y="36" width="${w*s}" height="32" fill="#7966a8"/><text x="35" y="96">应付 ${p}天</text><rect x="35" y="106" width="${w*p}" height="30" fill="#a68142"/><text x="35" y="162">CCC = ${i+s-p}天</text></svg>`;return}else{return}const all=ls.flatMap(l=>l[1]),lo=Math.min(0,...all),hi=Math.max(0,...all),x=i=>65+615*i/Math.max(labels.length-1,1),y=n=>212-165*(n-lo)/(hi-lo||1),cs=['#3979b8','#a68142'];el.innerHTML=`<svg viewBox="0 0 720 255"><path d="M65 45 V212 H680" fill="none" stroke="#879aac"/>${[0,1,2,3,4].map(i=>{let n=lo+(hi-lo)*i/4;return `<path d="M65 ${y(n)} H680" stroke="#d5dde6"/><text x="57" y="${y(n)+4}" text-anchor="end" font-size="11">${+n.toFixed(1)}</text>`}).join('')}${labels.map((s,i)=>`<text x="${x(i)}" y="232" text-anchor="middle" font-size="11">${s}</text>`).join('')}${ls.map((l,j)=>`<path d="${l[1].map((n,i)=>(i?'L':'M')+x(i)+' '+y(n)).join(' ')}" stroke="${cs[j]}" stroke-width="2.5" fill="none"/><text x="${75+j*290}" y="24" fill="${cs[j]}" font-size="13">${l[0]}</text>`).join('')}</svg>`}controls.addEventListener('input',update);document.getElementById('reset').addEventListener('click',()=>{if(key==='depreciation')document.getElementById('s1').max=config[0][1];config.forEach((x,i)=>document.getElementById('s'+i).value=x[1]);update()});update();</script></body></html>
