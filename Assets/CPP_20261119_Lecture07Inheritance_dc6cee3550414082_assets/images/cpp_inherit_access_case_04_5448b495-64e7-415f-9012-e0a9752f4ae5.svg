<svg baseProfile="full" height="710" version="1.1" viewBox="0 0 1360 710" width="1360" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="710" width="1360" x="0" y="0" /><rect fill="#2769B2" height="710" width="12" x="0" y="0" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="42" font-weight="bold" text-anchor="start" x="50" y="76">public 成员经 protected 继承</text><text fill="#617489" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="25" font-weight="normal" text-anchor="start" x="52" y="123">同一个成员在不同访问者视角下的限制</text><line stroke="#E4EAF0" stroke-linecap="round" stroke-width="2" x1="52" x2="1308" y1="146" y2="146" /><rect fill="#E4F7F4" height="275" rx="15" ry="15" stroke="#E4EAF0" stroke-width="2" width="385" x="90" y="218" /><text fill="#0E9288" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="282.5" y="267">Base</text><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="282.5" y="317">public:  data</text><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="282.5" y="374">内部可访问</text><rect fill="#FFF1DE" height="275" rx="15" ry="15" stroke="#E4EAF0" stroke-width="2" width="375" x="885" y="218" /><text fill="#E68B24" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="1072.5" y="267">访问者</text><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="1072.5" y="317">main 中 Derived 对象</text><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="1072.5" y="374">请求访问 data</text><line stroke="#D94E5E" stroke-linecap="round" stroke-width="5" x1="476" x2="877" y1="350" y2="350" /><polygon fill="#D94E5E" points="893.0,350.0 863.2897799460968,358.24802194914344 863.2897799460968,341.75197805085656" /><rect fill="#FDEBF0" height="75" rx="13" ry="13" stroke="#D94E5E" stroke-width="3" width="267" x="540" y="275" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="674" y="326">禁止直接访问</text><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="670" y="530">继承模式：protected</text><text fill="#617489" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="680" y="668">外部不能再把它作为公开访问接口</text></svg>