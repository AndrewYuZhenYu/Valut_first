<svg baseProfile="full" height="710" version="1.1" viewBox="0 0 1360 710" width="1360" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="710" width="1360" x="0" y="0" /><rect fill="#2769B2" height="710" width="12" x="0" y="0" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="42" font-weight="bold" text-anchor="start" x="50" y="76">继承方式影响向上转换</text><text fill="#617489" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="25" font-weight="normal" text-anchor="start" x="52" y="123">哪些转换并非自动合法？</text><line stroke="#E4EAF0" stroke-linecap="round" stroke-width="2" x1="52" x2="1308" y1="146" y2="146" /><rect fill="#EAF3FF" height="115" rx="14" ry="14" stroke="#2769B2" stroke-width="2" width="365" x="112.5" y="299.5" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="295" y="368">Derived(private Base)</text><rect fill="#FFF1DE" height="115" rx="14" ry="14" stroke="#E68B24" stroke-width="2" width="365" x="867.5" y="299.5" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="1050" y="368">Base</text><line stroke="#D94E5E" stroke-linecap="round" stroke-width="5" x1="500" x2="840" y1="357" y2="357" /><polygon fill="#D94E5E" points="856.0,357.0 826.2897799460968,365.24802194914344 826.2897799460968,348.75197805085656" /><rect fill="#FDEBF0" height="75" rx="17" ry="17" stroke="#D94E5E" stroke-width="2" width="290" x="533" y="264" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="677" y="312">不可直接保证</text><text fill="#617489" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="27" font-weight="normal" text-anchor="middle" x="680" y="527">普通代码不可执行 private 继承向上转换</text><text fill="#617489" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="680" y="668">普通代码不可执行 private 继承向上转换</text></svg>