<svg baseProfile="full" height="710" version="1.1" viewBox="0 0 1360 710" width="1360" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="710" width="1360" x="0" y="0" /><rect fill="#2769B2" height="710" width="12" x="0" y="0" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="42" font-weight="bold" text-anchor="start" x="50" y="76">初始化列表的书写顺序</text><text fill="#617489" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="25" font-weight="normal" text-anchor="start" x="52" y="123">先写谁不一定先构造谁</text><line stroke="#E4EAF0" stroke-linecap="round" stroke-width="2" x1="52" x2="1308" y1="146" y2="146" /><rect fill="#EAF3FF" height="205" rx="15" ry="15" stroke="#E4EAF0" stroke-width="2" width="475" x="125" y="220" /><text fill="#2769B2" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="362.5" y="269">初始化列表</text><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="362.5" y="319">mWorkDate(1997,7,1)</text><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="362.5" y="376">CPerson("DJH")</text><rect fill="#FFF1DE" height="205" rx="15" ry="15" stroke="#E4EAF0" stroke-width="2" width="490" x="765" y="220" /><text fill="#E68B24" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="34" font-weight="bold" text-anchor="middle" x="1010.0" y="269">真实构造次序</text><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="1010.0" y="319.0">1. CPerson 基类</text><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="1010.0" y="357.3333333333333">2. CDate mWorkDate</text><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="1010.0" y="395.6666666666667">3. CChiefExecutive 类体</text><line stroke="#E68B24" stroke-linecap="round" stroke-width="4" x1="609" x2="752" y1="325" y2="325" /><polygon fill="#E68B24" points="768.0,325.0 738.2897799460968,333.24802194914344 738.2897799460968,316.75197805085656" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" x="685" y="498">执行次序由继承声明和成员声明决定</text><text fill="#D94E5E" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="28" font-weight="normal" text-anchor="middle" x="685" y="548">与初始化列表中的书写顺序无关</text><text fill="#617489" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="680" y="668">构造顺序由继承列表和成员声明顺序决定</text></svg>