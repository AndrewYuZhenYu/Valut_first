<svg baseProfile="full" height="710" version="1.1" viewBox="0 0 1360 710" width="1360" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="710" width="1360" x="0" y="0" /><rect fill="#2769B2" height="710" width="12" x="0" y="0" /><text fill="#17324D" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="42" font-weight="bold" text-anchor="start" x="50" y="76">初始化列表的文字顺序与执行顺序</text><text fill="#617489" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="25" font-weight="normal" text-anchor="start" x="52" y="123">先声明 a 再声明 b，却在初始化列表里先写 b(2)</text><line stroke="#E4EAF0" stroke-width="2" x1="52" x2="1308" y1="146" y2="146" /><rect fill="#EAF3FF" height="286" rx="17" ry="17" stroke="#2769B2" stroke-width="3" width="535" x="85" y="212" /><text fill="#2769B2" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="33" font-weight="bold" text-anchor="middle" x="352" y="262">类内成员声明（决定次序）</text><text fill="#17324D" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="352" y="341">int a;  // 先声明</text><text fill="#17324D" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="352" y="403">int b;  // 后声明</text><rect fill="#FFF1DE" height="286" rx="17" ry="17" stroke="#E68B24" stroke-width="3" width="535" x="740" y="212" /><text fill="#E68B24" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="33" font-weight="bold" text-anchor="middle" x="1007" y="262">构造函数初始化列表</text><text fill="#17324D" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="30" font-weight="normal" text-anchor="middle" x="1007" y="350">Demo() : b(2), a(1) {}</text><text fill="#617489" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" font-size="27" font-weight="normal" text-anchor="middle" x="1007" y="407">这里只是文字排列</text><line 