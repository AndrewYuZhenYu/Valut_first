<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="710" version="1.1" viewBox="0 0 1360 710" width="1360" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FFFFFF" height="710" width="1360" x="0" y="0" /><rect fill="#2769B2" height="710" width="12" x="0" y="0" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="42" font-weight="bold" text-anchor="start" x="50" y="76">常见错误：析构顺序推测</text><text fill="#617489" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="25" font-weight="normal" text-anchor="start" x="52" y="123">把易混淆的调用和次序放在具体场景里理解</text><line stroke="#E4EAF0" stroke-linecap="round" stroke-width="2" x1="52" x2="1308" y1="146" y2="146" /><rect fill="#FDEBF0" height="120" rx="14" ry="14" stroke="#D94E5E" stroke-width="4" width="450" x="95.0" y="278.0" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="320" y="349">初始化列表</text><rect fill="#E4F7F4" height="120" rx="14" ry="14" stroke="#0E9288" stroke-width="4" width="450" x="795.0" y="278.0" /><text fill="#17324D" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" x="1020" y="349">遵循声明顺序</text><line stroke="#0E9288" stroke-linecap="round" stroke-width="5" x1="565" x2="765" y1="338" y2="338" /><polygon fill="#0E9288" points="781.0,338.0 751.2897799460968,346.24802194914344 751.2897799460968,329.75197805085656" /><text fill="#E68B24" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="33" font-weight="bold" text-anchor="middle" x="680" y="512">错误理解 → 正确处理</text><text fill="#617489" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="26" font-weight="normal" text-anchor="middle" x="680" y="668">初始化列表 不应直接等同于 遵循声明顺序</text></svg>