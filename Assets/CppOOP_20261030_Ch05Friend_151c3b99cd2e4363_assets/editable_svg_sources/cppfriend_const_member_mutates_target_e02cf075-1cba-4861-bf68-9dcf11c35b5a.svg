"Noto Sans CJK SC, sans-serif" font-size="31.0" font-weight="700" opacity="1" text-anchor="middle" x="330" y="292">this  -&gt;  COne{7, 1}</text><rect fill="#e9f1fc" height="103" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="329" x="170" y="365"/><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="middle" x="333" y="428">不能修改 mX1/mX2</text><rect fill="#ffffff" height="368" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="485" x="924" y="232"/><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="30.0" font-weight="700" opacity="1" text-anchor="middle" x="1160" y="292">target  -&gt;  CTwo{3, 8}</text><rect fill="#e6f6ef" height="103" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="329" x="996" y="365"/><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="1156" y="427">可以改为 {8, 6}</text><path d="M573 417 L909 417" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4"/><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="middle" x="741" y="390">CTwo&amp; 允许写入</text><g transform="translate(0,-64.0)"><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21.0" font-weight="700" opacity="1" text-anchor="start" x="748" y="719">const 作用于隐含的 this 对象；是否可以写其他对象还取决于其引用 / 指针类型与访问权限。</text></g></g></svg>