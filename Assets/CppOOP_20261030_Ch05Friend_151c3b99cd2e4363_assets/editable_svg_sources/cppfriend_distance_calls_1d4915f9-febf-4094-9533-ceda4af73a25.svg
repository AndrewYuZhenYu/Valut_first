<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="704" version="1.1" viewBox="0 0 1448 704" width="1448"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="704" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1448" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1448" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">04  友元函数不是成员函数</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">调用者在 main 中显式传入两个对象；函数内部没有隐式 this 指针</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1386" y1="130" y2="130"/><g transform="translate(0,-52.0)"><rect fill="#ffffff" height="390" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="478" x="88" y="227"/><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="478" x="88" y="227"/><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="478" x="88" y="256"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="112" y="264">main.cpp：调用现场</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="400" opacity="1" text-anchor="start" x="120" y="345">CPoint p1(3.5, 5.5);</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="400" opacity="1" text-anchor="start" x="120" y="407">CPoint p2(6.5, 9.5);</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="30.0" font-weight="700" opacity="1" text-anchor="start" x="120" y="485">Distance(p1, p2);</text><rect fill="#ffffff" height="390" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="534" x="864" y="227"/><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="534" x="864" y="227"/><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="534" x="864" y="256"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="888" y="264">Distance：非成员函数</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="27.0" font-weight="400" opacity="1" text-anchor="start" x="891" y="343">Distance(const CPoint&amp; a,</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="27.0" font-weight="400" opacity="1" text-anchor="start" x="905" y="381">         const CPoint&amp; b)</text><text fill="#dd7135" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="start" x="892" y="466">a.mX, b.mX   -&gt;   距离</text><path d="M575 455 L851 455" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="5"/><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="middle" x="712" y="428">两个显式参数</text><rect fill="#fff1e8" height="54" opacity="1" rx="16" ry="16" stroke="none" width="585" x="460" y="670"/><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="25.0" font-weight="400" opacity="1" text-anchor="middle" x="750" y="708">不是 p1.Distance(p2)，也不能使用 this-&gt;mX</text></g></svg>