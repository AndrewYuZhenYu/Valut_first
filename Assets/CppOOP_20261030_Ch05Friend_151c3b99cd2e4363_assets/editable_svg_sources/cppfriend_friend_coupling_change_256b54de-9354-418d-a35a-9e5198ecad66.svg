<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="728" version="1.1" viewBox="0 0 1500 728" width="1500"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="728" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">60  为什么大量使用 friend 会增加维护成本</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">修改 CPoint.mX / mY 的内部表示时，公共 GetX/GetY 保持接口稳定；直接访问字段的友元实现需要同步修改</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130"/><g transform="translate(0,-24.0)"><rect fill="#ffffff" height="120" opacity="1" rx="16" ry="16" stroke="#1769aa" stroke-width="2" width="548" x="476" y="199"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="700" opacity="1" text-anchor="middle" x="749" y="245">CPoint 内部改为 double coords[2]</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="23.0" font-weight="700" opacity="1" text-anchor="start" x="749" y="285">公开 GetX/GetY 仍提供同样含义</text><rect fill="#ffffff" height="228" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="615" x="87" y="419"/><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="615" x="87" y="419"/><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="615" x="87" y="448"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="111" y="456">公开 Getter 路径</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="start" x="119" y="505">p.GetX()</text><path d="M272 541 L398 541" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3"/><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="24.0" font-weight="700" opacity="1" text-anchor="start" x="413" y="580">仍可工作（实现适配）</text><rect fill="#ffffff" height="228" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="615" x="796" y="419"/><rect fill="#bf4f55" height="55" opacity="1" rx="17" ry="17" stroke="none" width="615" x="796" y="419"/><rect fill="#bf4f55" height="26" opacity="1" rx="0" ry="0" stroke="none" width="615" x="796" y="448"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="820" y="456">友元直接读字段</text><text fill="#bf4f55" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="start" x="828" y="505">p.mX</text><path d="M981 541 L1107 541" fill="none" marker-end="url(#arr-red)" stroke="#bf4f55" stroke-width="3"/><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="24.0" font-weight="700" opacity="1" text-anchor="start" x="1122" y="580">需要跟随内部结构修改</text><path d="M638 330 L398 410" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4"/><path d="M855 330 L1088 410" fill="none" marker-end="url(#arr-red)" stroke="#bf4f55" stroke-width="4"/><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="20.0" font-weight="700" opacity="1" text-anchor="start" x="750" y="716">friend 是有用的工具，但权限越大、内部耦合越紧，长期演化时需要维护的协作点通常越多。</text></g></svg>