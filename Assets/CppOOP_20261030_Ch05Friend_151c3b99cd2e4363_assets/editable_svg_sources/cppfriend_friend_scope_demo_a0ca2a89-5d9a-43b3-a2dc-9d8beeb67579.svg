<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="690" version="1.1" viewBox="0 0 1500 690" width="1500"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="690" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">61  三种 friend 写法分别授权给谁</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">同一个私有成员可以选择授权普通函数、另一类中的一个成员函数、或另一整个类</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130"/><g transform="translate(0,-54.0)"><rect fill="#ffffff" height="112" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="1316" x="93" y="229"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="28.0" font-weight="700" opacity="1" text-anchor="start" x="136" y="289">friend double Distance(const CPoint&amp;, const CPoint&amp;);</text><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="end" x="1310" y="289">仅 Distance</text><rect fill="#ffffff" height="112" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="1316" x="93" y="381"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="700" opacity="1" text-anchor="start" x="135" y="443">friend void COne::SetMemberOfCTwo(CTwo&amp;) const;</text><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="end" x="1306" y="443">仅一个成员函数</text><rect fill="#ffffff" height="112" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="1316" x="93" y="534"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="start" x="138" y="596">friend class CStack;</text><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="end" x="1306" y="596">整个 CStack 类</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21.0" font-weight="700" opacity="1" text-anchor="start" x="747" y="705">friend 声明必须位于提供权限的类内部；放在 public 或 private 区效果一样。</text></g></svg>