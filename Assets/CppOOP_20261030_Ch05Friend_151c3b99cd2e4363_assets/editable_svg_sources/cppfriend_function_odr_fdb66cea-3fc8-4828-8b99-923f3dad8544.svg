ans CJK SC, sans-serif" font-size="31.0" font-weight="700" opacity="1" text-anchor="middle" x="739" y="247">Functions.h</text><text fill="#506477" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="25.0" font-weight="700" opacity="1" text-anchor="start" x="739" y="283">void Foo() { ... }</text><path d="M741 315 L359 404" fill="none" marker-end="url(#arr-blue)" stroke="#1769aa" stroke-width="4"/><rect fill="#ffffff" height="128" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="300" x="224" y="410"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="374" y="472">main.cpp</text><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="23.0" font-weight="700" opacity="1" text-anchor="start" x="374" y="510">都有 Foo 定义</text><path d="M741 315 L1078 404" fill="none" marker-end="url(#arr-blue)" stroke="#1769aa" stroke-width="4"/><rect fill="#ffffff" height="128" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="300" x="943" y="410"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="1093" y="472">Two.cpp</text><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="23.0" font-weight="700" opacity="1" text-anchor="start" x="1093" y="510">都有 Foo 定义</text><path d="M370 549 L600 636" fill="none" marker-end="url(#arr-red)" stroke="#bf4f55" stroke-width="4"/><path d="M1090 549 L860 636" fill="none" marker-end="url(#arr-red)" stroke="#bf4f55" stroke-width="4"/><rect fill="#fff0ef" height="80" opacity="1" rx="16" ry="16" stroke="#bf4f55" stroke-width="2" width="391" x="552" y="633"/><text fill="#bf4f55" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="28.0" font-weight="700" opacity="1" text-anchor="middle" x="746" y="684">链接：multiple definition</text></g></svg>