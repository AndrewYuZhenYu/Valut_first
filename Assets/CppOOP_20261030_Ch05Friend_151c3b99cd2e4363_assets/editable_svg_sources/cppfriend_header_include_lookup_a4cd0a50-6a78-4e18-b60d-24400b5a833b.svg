<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="688" version="1.1" viewBox="0 0 1486 688" width="1486"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="688" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1486" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1486" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">47  #include &lt;...&gt; 与 #include "..." 的查找语义</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">&lt;&gt; 常用于系统 / 配置包含路径；引号形式通常优先尝试包含文件所在目录，再查包含路径</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1424" y1="130" y2="130"/><g transform="translate(0,-50.0)"><rect fill="#ffffff" height="416" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="626" x="81" y="226"/><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="626" x="81" y="226"/><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="626" x="81" y="255"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="105" y="263">#include &lt;iostream&gt;</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="400" opacity="1" text-anchor="start" x="132" y="326">项目源文件目录</text><rect fill="#fff2f1" height="66" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="485" x="135" y="360"/><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="24.0" font-weight="700" opacity="1" text-anchor="middle" x="380" y="404">一般不按“引号形式”先查本地</text><rect fill="#e8f6f0" height="75" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="489" x="134" y="477"/><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="middle" x="380" y="526">配置的系统 include 搜索路径</text><rect fill="#ffffff" height="416" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="639" x="779" y="226"/><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="639" x="779" y="226"/><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="639" x="779" y="255"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="803" y="263">#include "Complex.h"</text><rect fill="#e8f6f0" height="81" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="504" x="841" y="314"/><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="middle" x="1092" y="363">优先：相应源文件所在目录</text><path d="M1092 402 L1092 457" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4"/><rect fill="#edf4fa" height="82" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="504" x="843" y="472"/><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="26.0" font-weight="700" opacity="1" text-anchor="middle" x="1092" y="524">找不到  -&gt;  其他配置包含路径</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="22.14" font-weight="700" opacity="1" text-anchor="start" x="747" y="701">实际搜索顺序与编译器及配置有关；不要依赖不可移植的绝对磁盘路径。</text></g></svg>