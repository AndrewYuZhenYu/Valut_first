<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="694" version="1.1" viewBox="0 0 1484 694" width="1484"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="694" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1484" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1484" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">52  超前声明：指针 / 引用可用，完整对象尚不能定义</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">编译器只知道名字时可声明地址相关类型；要计算对象大小、访问成员则通常需要完整定义</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1422" y1="130" y2="130"/><g transform="translate(0,-52.0)"><rect fill="#ffffff" height="413" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="667" x="64" y="228"/><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="667" x="64" y="228"/><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="667" x="64" y="257"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="88" y="265">只知道 class CTwo;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="400" opacity="1" text-anchor="start" x="90" y="315">class CTwo;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="400" opacity="1" text-anchor="start" x="90" y="373">CTwo* ptr;        // OK</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="400" opacity="1" text-anchor="start" x="90" y="431">void Use(CTwo&amp;);  // OK</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="400" opacity="1" text-anchor="start" x="90" y="489">CTwo value;       // X</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="400" opacity="1" text-anchor="start" x="90" y="547">// 类型大小未知</text><rect fill="#ffffff" height="413" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="642" x="793" y="228"/><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="642" x="793" y="228"/><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="642" x="793" y="257"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="817" y="265">看到 #include "Two.h" 后</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="25.0" font-weight="400" opacity="1" text-anchor="start" x="822" y="315">#include "Two.h"</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="25.0" font-weight="400" opacity="1" text-anchor="start" x="822" y="380">CTwo value(3, 8);  // OK</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="25.0" font-weight="400" opacity="1" text-anchor="start" x="822" y="445">value.GetY1();    // OK</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="25.0" font-weight="400" opacity="1" text-anchor="start" x="822" y="510">sizeof(CTwo);     // OK</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="26.0" font-weight="700" opacity="1" text-anchor="start" x="745" y="708">friend class CTwo; 在友元类声明时也可配合前向声明使用。</text></g></svg>