<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="650" version="1.1" viewBox="0 0 1468 650" width="1468"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="650" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1468" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1468" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">49  宏参数有副作用：平方宏可能让 ++i 执行两次</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">即使给宏加括号，SQR(++i) 也会多次求值且可能产生未定义行为，不能把它当普通函数</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1406" y1="130" y2="130"/><g transform="translate(0,-44.0)"><rect fill="#ffffff" height="440" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="601" x="80" y="220"/><rect fill="#bf4f55" height="55" opacity="1" rx="17" ry="17" stroke="none" width="601" x="80" y="220"/><rect fill="#bf4f55" height="26" opacity="1" rx="0" ry="0" stroke="none" width="601" x="80" y="249"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="104" y="257">宏展开</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="27.0" font-weight="400" opacity="1" text-anchor="start" x="111" y="317">#define SQR(x) ((x)*(x))</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="27.0" font-weight="400" opacity="1" text-anchor="start" x="111" y="385">int i = 1;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="27.0" font-weight="400" opacity="1" text-anchor="start" x="111" y="453">int y = SQR(++i);</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="27.0" font-weight="400" opacity="1" text-anchor="start" x="111" y="521">// ((++i) * (++i))</text><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="382" y="594">不应依赖其结果</text><rect fill="#ffffff" height="440" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="608" x="810" y="220"/><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="608" x="810" y="220"/><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="608" x="810" y="249"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="834" y="257">inline 函数</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="841" y="312">inline int Square(int x) {</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="841" y="369">  return x * x;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="841" y="426">}</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="841" y="483">int i = 1;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="841" y="540">int y = Square(++i);</text><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="1102" y="604">i == 2，y == 4</text></g></svg>