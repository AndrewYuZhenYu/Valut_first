<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="702" version="1.1" viewBox="0 0 1500 702" width="1500"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="702" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">18  宏替换是文本展开，不是函数调用</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">Area(R - blue) 在错误宏中会展开为 PI*R-blue*R-blue，计算结果完全不同</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130"/><g transform="translate(0,-46.0)"><rect fill="#ffffff" height="420" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="646" x="72" y="221"/><rect fill="#bf4f55" height="55" opacity="1" rx="17" ry="17" stroke="none" width="646" x="72" y="221"/><rect fill="#bf4f55" height="26" opacity="1" rx="0" ry="0" stroke="none" width="646" x="72" y="250"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="96" y="258">错误宏</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="28.0" font-weight="400" opacity="1" text-anchor="start" x="110" y="319">#define Area(r) PI*r*r</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="31.0" font-weight="400" opacity="1" text-anchor="start" x="110" y="386">Area(2 - 1)</text><text fill="#bf4f55" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="start" x="110" y="453"> -&gt;  PI*2 - 1*2 - 1</text><text fill="#bf4f55" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="start" x="110" y="526"> -&gt;  2×PI - 3</text><rect fill="#ffffff" height="420" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="646" x="779" y="221"/><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="646" x="779" y="221"/><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="646" x="779" y="250"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="803" y="258">安全的宏括号（或用函数）</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="25.0" font-weight="400" opacity="1" text-anchor="start" x="814" y="319">#define Area(r) (PI*(r)*(r))</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="31.0" font-weight="400" opacity="1" text-anchor="start" x="818" y="386">Area(2 - 1)</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="816" y="453"> -&gt;  PI*(2-1)*(2-1)</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="31.0" font-weight="700" opacity="1" text-anchor="start" x="816" y="526"> -&gt;  PI</text><text fill="#506477" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="21.0" font-weight="700" opacity="1" text-anchor="start" x="750" y="710">推荐：double Area(double r) { return PI * r * r; }  // 真正的函数，避免宏副作用</text></g></svg>