<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="710" version="1.1" viewBox="0 0 1500 710" width="1500"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="710" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">33  COne 写入 CTwo：两条赋值语句如何改变目标</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">zOne(7,1).SetMemberOfCTwo(zTwo) 把原目标的 (3,8) 改成 (8,6)</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130"/><g transform="translate(0,-30.0)"><rect fill="#ffffff" height="426" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="476" x="92" y="206"/><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="476" x="92" y="206"/><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="476" x="92" y="235"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="116" y="243">COne  源对象 zOne</text><rect fill="#e7f1fa" height="105" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="190" x="132" y="325"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="227.0" y="378">mX1=7</text><rect fill="#e7f1fa" height="105" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="190" x="327" y="325"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="422.0" y="378">mX2=1</text><rect fill="#ffffff" height="426" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="478" x="917" y="206"/><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="478" x="917" y="206"/><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="478" x="917" y="235"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="941" y="243">CTwo  目标对象 zTwo</text><rect fill="#e7f1fa" height="98" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="188" x="954" y="322"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="1048.0" y="375">mY1=3</text><rect fill="#e7f1fa" height="98" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="188" x="1147" y="322"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="1241.0" y="375">mY2=8</text><path d="M593 375 L883 375" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4"/><text fill="#dd7135" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="28.0" font-weight="700" opacity="1" text-anchor="middle" x="733" y="325">mY1 = 7 + 1</text><path d="M593 495 L883 495" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4"/><text fill="#dd7135" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="28.0" font-weight="700" opacity="1" text-anchor="middle" x="733" y="472">mY2 = 7 - 1</text><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="middle" x="1110" y="530">变为：mY1=8，mY2=6</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="22.0" font-weight="700" opacity="1" text-anchor="start" x="751" y="702">const 修饰 COne 的成员函数：不能改 zOne；但可以通过 CTwo&amp; 修改目标。</text></g></svg>