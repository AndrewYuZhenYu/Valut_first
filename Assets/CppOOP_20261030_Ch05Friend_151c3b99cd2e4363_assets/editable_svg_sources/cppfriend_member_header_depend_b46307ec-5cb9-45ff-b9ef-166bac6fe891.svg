<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="724" version="1.1" viewBox="0 0 1500 724" width="1500"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="724" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">35  COne / CTwo 头文件：为什么 include 有方向</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">One.h 先声明 CTwo 并声明成员函数；Two.h 再 include One.h 才可声明该成员为友元</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130"/><g transform="translate(0,-44.0)"><rect fill="#ffffff" height="445" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="594" x="78" y="220"/><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="594" x="78" y="220"/><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="594" x="78" y="249"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="102" y="257">One.h</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="109" y="324">class CTwo;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="109" y="380">class COne {</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="109" y="436">  void SetMemberOfCTwo(CTwo&amp;) const;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="109" y="492">};</text><rect fill="#ffffff" height="445" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="594" x="807" y="220"/><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="594" x="807" y="220"/><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="594" x="807" y="249"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="831" y="257">Two.h</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="838" y="324">#include "One.h"</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="838" y="380">class CTwo {</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="838" y="436">  friend void COne::</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="838" y="492">    SetMemberOfCTwo(CTwo&amp;) const;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="24.0" font-weight="400" opacity="1" text-anchor="start" x="838" y="548">};</text><path d="M694 350 L792 350" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="5"/><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="24.0" font-weight="700" opacity="1" text-anchor="middle" x="744" y="320">include</text><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="20.0" font-weight="700" opacity="1" text-anchor="start" x="751" y="729">只靠 class COne; 还不足以引用 COne::SetMemberOfCTwo：编译器须先知道成员存在。</text></g></svg>