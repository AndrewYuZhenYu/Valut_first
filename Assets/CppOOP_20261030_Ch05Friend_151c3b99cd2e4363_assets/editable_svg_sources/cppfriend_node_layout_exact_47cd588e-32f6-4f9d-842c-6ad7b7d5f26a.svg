<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="720" version="1.1" viewBox="0 0 1500 720" width="1500"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="720" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">36  CNode 的内存：数据字段与链接字段</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">Stack::Push 把旧栈顶地址写入新结点 pPrev；Stack::Pop 读取 mData 并追随 pPrev</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130"/><g transform="translate(0,-46.0)"><rect fill="#ffffff" height="435" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="550" x="476" y="221"/><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="537" y="272">单个 CNode 对象（示意，非按字节比例）</text><rect fill="#e8f3fd" height="109" opacity="1" rx="16" ry="16" stroke="#1769aa" stroke-width="2" width="411" x="542" y="335"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="34.0" font-weight="700" opacity="1" text-anchor="start" x="579" y="397">mData = 50</text><rect fill="#e8f6f0" height="115" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="411" x="542" y="464"/><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="32.0" font-weight="700" opacity="1" text-anchor="start" x="578" y="533">pPrev = 0xB0</text><path d="M970 524 L1220 524" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4"/><rect fill="#ffffff" height="124" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="181" x="1231" y="463"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="30.0" font-weight="700" opacity="1" text-anchor="middle" x="1322" y="517">CNode</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25.0" font-weight="700" opacity="1" text-anchor="start" x="1322" y="555">mData=23</text><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="28.0" font-weight="700" opacity="1" text-anchor="start" x="88" y="369">读 mData</text><path d="M227 373 L530 386" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4"/><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="26.0" font-weight="700" opacity="1" text-anchor="start" x="84" y="506">读 / 改 pPrev</text><path d="M265 506 L527 520" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4"/><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="20.0" font-weight="700" opacity="1" text-anchor="start" x="749" y="727">CStack 能直接访问这些 private 字段，是因为 CNode 声明 friend class CStack。</text></g></svg>