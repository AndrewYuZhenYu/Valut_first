<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="608" version="1.1" viewBox="0 0 1400 608" width="1400"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="608" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1400" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1400" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">37  Push 第一步：创建新结点，但旧 pTop 尚未改变</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">new CNode(50, pTop) 会把旧头指针作为构造参数；新结点先存在于堆中</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1338" y1="130" y2="130"/><g transform="translate(0,-158.0)"><rect fill="#e7f1fa" height="110" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="265" x="165" y="334"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="297.5" y="387">pTop -&gt; 23</text><rect fill="#e7f1fa" height="110" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="265" x="435" y="334"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="567.5" y="387">23 -&gt; 10</text><rect fill="#e7f1fa" height="110" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="265" x="705" y="334"/><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="29.0" font-weight="700" opacity="1" text-anchor="middle" x="837.5" y="387">10 -&gt; null</text><rect fill="#fff4e9" height="118" opacity="1" rx="16" ry="16" stroke="#dd7135" stroke-width="2" width="450" x="548" y="516"/><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="33.0" font-weight="700" opacity="1" text-anchor="middle" x="773" y="565">新结点 50</text><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="26.0" font-weight="700" opacity="1" text-anchor="middle" x="773" y="606">pPrev = 旧 pTop (=23)</text><path d="M780 512 L780 452" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4"/><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="24.0" font-weight="700" opacity="1" text-anchor="start" x="802" y="480">新结点尚未接到 pTop</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="750" y="727">此时若没有执行 pTop = pNode，栈顶仍然是 23。</text></g></svg>