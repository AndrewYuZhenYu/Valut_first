<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink" baseProfile="full" height="698" version="1.1" viewBox="0 0 1500 698" width="1500"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa"/></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d"/></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55"/></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135"/></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477"/></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af"/></marker></defs><rect fill="#f7f9fc" height="698" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0"/><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="40" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">57  SetName 接收自己的名字地址时：先释放会悬空</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">如果传入的 pName 指向 m_pName 旧缓冲区，立即 delete[] 后再 strlen(pName) 会访问失效内存</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130"/><g transform="translate(0,-52.0)"><rect fill="#ffffff" height="421" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="584" x="79" y="227"/><rect fill="#bf4f55" height="55" opacity="1" rx="17" ry="17" stroke="none" width="584" x="79" y="227"/><rect fill="#bf4f55" height="26" opacity="1" rx="0" ry="0" stroke="none" width="584" x="79" y="256"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="103" y="264">错误步骤</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="400" opacity="1" text-anchor="start" x="113" y="321">const char* pName = m_pName;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="400" opacity="1" text-anchor="start" x="113" y="396">delete[] m_pName;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="400" opacity="1" text-anchor="start" x="113" y="471">strlen(pName);  // 悬空指针</text><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="26.0" font-weight="700" opacity="1" text-anchor="middle" x="374" y="602">旧地址失效，后续读取危险</text><rect fill="#ffffff" height="421" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="600" x="814" y="227"/><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="600" x="814" y="227"/><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="600" x="814" y="256"/><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="27.0" font-weight="700" opacity="1" text-anchor="start" x="838" y="264">安全策略（示意）</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="23.0" font-weight="400" opacity="1" text-anchor="start" x="844" y="315">std::string copy = pName ? pName : "";</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="23.0" font-weight="400" opacity="1" text-anchor="start" x="844" y="377">// 先完成独立副本</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="23.0" font-weight="400" opacity="1" text-anchor="start" x="844" y="439">// 再修改内部存储</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="23.0" font-weight="400" opacity="1" text-anchor="start" x="844" y="501">// 更推荐：成员直接用 std::string</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21.0" font-weight="700" opacity="1" text-anchor="start" x="748" y="714">这一图是针对旧式裸指针管理的安全补充，不改变课件对字符数组与指针的介绍。</text></g></svg>