738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="22.0" font-weight="400" opacity="1" text-anchor="start" x="573" y="440">CComplex CComplex::Add(</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="22.0" font-weight="400" opacity="1" text-anchor="start" x="573" y="487">  const CComplex&amp;) const {</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="22.0" font-weight="400" opacity="1" text-anchor="start" x="573" y="534">  ...</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="22.0" font-weight="400" opacity="1" text-anchor="start" x="573" y="581">}</text><rect fill="#ffffff" height="401" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="405" x="1017" y="215"/><text fill="#dd7135" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="31.0" font-weight="700" opacity="1" text-anchor="start" x="1050" y="278">main.cpp</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="23.0" font-weight="400" opacity="1" text-anchor="start" x="1047" y="347">#include "Complex.h"</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="23.0" font-weight="400" opacity="1" text-anchor="start" x="1047" y="394">int main() {</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="23.0" font-weight="400" opacity="1" text-anchor="start" x="1047" y="441">  CComplex a, b;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="23.0" font-weight="400" opacity="1" text-anchor="start" x="1047" y="488">  auto c = a.Add(b);</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="23.0" font-weight="400" opacity="1" text-anchor="start" x="1047" y="5