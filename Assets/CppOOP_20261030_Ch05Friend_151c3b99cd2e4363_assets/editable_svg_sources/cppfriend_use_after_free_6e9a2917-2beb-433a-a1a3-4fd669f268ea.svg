nchor="start" x="847" y="391">pTop = old-&gt;pPrev;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="400" opacity="1" text-anchor="start" x="847" y="456">int data = old-&gt;mData;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, monospace" font-size="26.0" font-weight="400" opacity="1" text-anchor="start" x="847" y="521">delete old;</text><rect fill="#e7f6f1" height="54" opacity="1" rx="16" ry="16" stroke="none" width="488" x="856" y="569"/><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="26.0" font-weight="700" opacity="1" text-anchor="middle" x="1100" y="606">先保存需要的信息再释放</text></g></svg>