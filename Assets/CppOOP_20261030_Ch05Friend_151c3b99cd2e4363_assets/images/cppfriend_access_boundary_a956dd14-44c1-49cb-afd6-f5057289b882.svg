ans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="78" y="350">zP.mX  X</text><path d="M382 337 L495 337" fill="none" marker-end="url(#arr-red)" stroke="#bf4f55" stroke-width="4" /><rect fill="#fff0f0" height="43" opacity="1" rx="11" ry="11" stroke="none" width="91" x="395" y="279" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="440.5" y="309">拒绝</text><path d="M382 435 L495 531" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="90" y="444">zP.GetX()  OK</text><rect fill="#ffffff" height="128" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="328" x="1104" y="264" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="start" x="1124" y="311">获授权的友元函数</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="1124" y="353">zP.mX  OK</text><path d="M1103 338 L982 384" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><rect fill="#e4f4f0" height="43" opacity="1" rx="11" ry="11" stroke="none" width="88" x="1000" y="279" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="1044.0" y="309">授权</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" opacity="1" text-anchor="middle" x="590" y="685">友元不改变成员的 private 性质，只是授予特定函数 / 类访问资格</text></svg>