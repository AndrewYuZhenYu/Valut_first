<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">16  从源代码到可执行程序：实际构建管线</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">头文件主要被预处理展开；各 .cpp 分别编译为目标文件，再由链接器合并</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="178" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="245" x="61" y="282" /><rect fill="#eef4f9" height="48" opacity="1" rx="16" ry="16" stroke="none" width="205" x="81" y="308" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="184" y="342">Point.h</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="184" y="414">声明 / 接口</text><path d="M307 371 L327 371" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3" /><rect fill="#ffffff" height="178" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="245" x="333" y="282" /><rect fill="#eef4f9" height="48" opacity="1" rx="16" ry="16" stroke="none" width="205" x="353" y="308" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="456" y="342">Point.cpp</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="456" y="414">实现</text><path d="M579 371 L599 371" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3" /><rect fill="#ffffff" height="178" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="245" x="605" y="282" /><rect fill="#eef4f9" height="48" opacity="1" rx="16" ry="16" stroke="none" width="205" x="625" y="308" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="728" y="342">main.cpp</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="728" y="414">调用</text><path d="M851 371 L871 371" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3" /><rect fill="#ffffff" height="178" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="245" x="875" y="282" /><rect fill="#eef4f9" height="48" opacity="1" rx="16" ry="16" stroke="none" width="205" x="895" y="308" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="998" y="342">目标文件</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="998" y="414">Point.o + main.o</text><path d="M1121 371 L1141 371" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3" /><rect fill="#ffffff" height="178" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="245" x="1146" y="282" /><rect fill="#eef4f9" height="48" opacity="1" rx="16" ry="16" stroke="none" width="205" x="1166" y="308" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="1269" y="342">可执行程序</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="start" x="1269" y="414">app</text><rect fill="#eef4f9" height="43" opacity="1" rx="11" ry="11" stroke="none" width="490" x="323" y="528" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="568.0" y="558">预处理 / 编译   -&gt;   .o</text><rect fill="#eef4f9" height="43" opacity="1" rx="11" ry="11" stroke="none" width="440" x="902" y="528" /><text fill="#dd7135" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="1122.0" y="558">链接器 + 标准库</text><path d="M375 499 L760 499" fill="none" marker-end="url(#arr-blue)" stroke="#1769aa" stroke-width="3" /><path d="M907 499 L1190 499" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="3" /><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="751" y="673">include 不是把 .cpp 文本“连接”起来；同一个非 inline 函数不能在多个源文件中重复定义</text></svg>