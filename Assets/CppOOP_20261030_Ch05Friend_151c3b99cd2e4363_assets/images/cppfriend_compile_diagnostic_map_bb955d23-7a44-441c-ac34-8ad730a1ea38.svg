4" x1="152" x2="1325" y1="294" y2="294" /><circle cx="241" cy="294" fill="#1769aa" r="11" stroke="none" stroke-width="2" /><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" opacity="1" text-anchor="middle" x="241" y="246">预处理</text><circle cx="728" cy="294" fill="#dd7135" r="11" stroke="none" stroke-width="2" /><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" opacity="1" text-anchor="middle" x="728" y="246">编译</text><circle cx="1193" cy="294" fill="#13857d" r="11" stroke="none" stroke-width="2" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" opacity="1" text-anchor="middle" x="1193" y="246">链接</text><rect fill="#ffffff" height="83" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="390" x="104" y="365" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="middle" x="298" y="414">找不到头文件：检查 -I 路径</text><rect fill="#ffffff" height="83" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="390" x="452" y="467" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="middle" x="646" y="516">invalid use of incomplete type：补完整类定义</text><rect fill="#ffffff" height="83" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="390" x="913" y="362" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="middle" x="1107" y="411">undefined reference：加入 .cpp 构建</text><rect fill="#ffffff" height="83" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="390" x="927" y="550" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="middle" x="1121" y="599">multiple definition：检查重复定义</text><path d="M251 312 L269 35