<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">59  const 成员函数究竟限制了谁</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">SetMemberOfCTwo(CTwo&amp;) const 中的 const 保护当前 COne 对象，不禁止修改传入的非常量 CTwo&amp;</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="368" opacity="1" rx="16" ry="16" stroke="#1769aa" stroke-width="2" width="483" x="92" y="232" /><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" opacity="1" text-anchor="middle" x="330" y="292">this → COne{7, 1}</text><rect fill="#e9f1fc" height="103" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="329" x="170" y="365" /><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="middle" x="333" y="428">不能修改 mX1/mX2</text><rect fill="#ffffff" height="368" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="485" x="924" y="232" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" opacity="1" text-anchor="middle" x="1160" y="292">target → CTwo{3, 8}</text><rect fill="#e6f6ef" height="103" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="329" x="996" y="365" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="1156" y="427">可以改为 {8, 6}</text><path d="M573 417 L909 417" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="middle" x="741" y="390">CTwo&amp; 允许写入</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="748" y="719">const 作用于隐含的 this 对象；是否可以写其他对象还取决于其引用 / 指针类型与访问权限。</text></svg>