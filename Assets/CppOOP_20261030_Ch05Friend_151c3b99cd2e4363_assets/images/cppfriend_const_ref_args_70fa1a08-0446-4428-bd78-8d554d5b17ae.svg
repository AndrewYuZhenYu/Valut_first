nt-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="225" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="347" x="96" y="258" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="347" x="96" y="258" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="347" x="96" y="287" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="120" y="295">原对象 p1</text><text fill="#506477" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="24" font-weight="400" opacity="1" text-anchor="start" x="131" y="366">{ mX, mY }</text><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="30" font-weight="700" opacity="1" text-anchor="start" x="128" y="429">3.5, 5.5</text><rect fill="#ffffff" height="225" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="347" x="1050" y="258" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="347" x="1050" y="258" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="347" x="1050" y="287" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="1074" y="295">原对象 p2</text><text fill="#506477" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="24" font-weight="400" opacity="1" text-anchor="start" x="1085" y="366">{ mX, mY }</text><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="30" font-weight="700" opacity="1" text-anchor="start" x="1082" y="429">6.5, 9.5</text><rect fill="#ffffff" height="224" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="386" x="546" y="301" /><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="386" x="546" y="301" /><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="386" x="546" y="330" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="570" y="338">Distance(const CPoint&amp; a,</text><text fill="#ffffff" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="24" font-weight="700" opacity="1" text-anchor="start" x="585" y="394">const CPoint&amp; b)</text><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="592" y="478">仅读取；不更改 p1/p2</text><path d="M440 364 L540 364" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><path d="M1054 438 L940 438" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="488" y="347">a  -&gt; </text><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="990" y="463"> &lt;-  b</text><rect fill="#eef4f9" height="43" opacity="1" rx="11" ry="11" stroke="none" width="490" x="503" y="612" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="748.0" y="642">引用绑定现有对象，不触发拷贝构造</text></svg>