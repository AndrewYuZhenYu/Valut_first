<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">48  #if defined(DEBUG_)：编译时选择代码分支</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">这一条件由预处理器判断；关闭 DEBUG_ 后调试 cout 不进入编译结果，而不是运行时跳过</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="363" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="452" x="72" y="222" /><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="111" y="312">#if defined(DEBUG_)</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="111" y="378">  cout &lt;&lt; "Radius";</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="111" y="444">#endif</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="111" y="510">cout &lt;&lt; "Area";</text><path d="M530 330 L744 330" fill="none" marker-end="url(#arr-blue)" stroke="#1769aa" stroke-width="4" /><path d="M530 488 L744 488" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4" /><rect fill="#e7f5f0" height="156" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="628" x="776" y="231" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="middle" x="1110" y="280">定义 DEBUG_</text><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="middle" x="1110" y="344">输出 Radius  -&gt;  Area</text><rect fill="#fff1e8" height="157" opacity="1" rx="16" ry="16" stroke="#dd7135" stroke-width="2" width="628" x="776" y="447" /><text fill="#dd7135" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="middle" x="1110" y="496">不定义 DEBUG_</text><text fill="#dd7135" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" opacity="1" text-anchor="middle" x="1110" y="554">只输出 Area</text></svg>