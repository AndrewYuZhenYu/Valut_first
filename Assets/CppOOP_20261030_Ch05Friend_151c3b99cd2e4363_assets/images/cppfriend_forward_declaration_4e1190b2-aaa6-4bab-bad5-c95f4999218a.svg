<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">08  相互关联的类：超前声明如何打断头文件循环</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">先只告知类名，再在需要读取成员的 .cpp 中包含完整定义</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="398" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="405" x="65" y="211" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="405" x="65" y="211" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="405" x="65" y="240" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="89" y="248">Defines.h</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="24" font-weight="400" opacity="1" text-anchor="start" x="97" y="313">class CIntSet;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="24" font-weight="400" opacity="1" text-anchor="start" x="97" y="375">class CRealSet;</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="96" y="447">只知道名字和类型存在</text><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="96" y="489">暂时不知道大小或成员</text><rect fill="#ffffff" height="398" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="390" x="563" y="211" /><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="390" x="563" y="211" /><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="390" x="563" y="240" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="587" y="248">IntSet.h / RealSet.h</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="596" y="316">SetToReal(CRealSet&amp;)</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="596" y="378">SetToInt(CIntSet&amp;)</text><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="594" y="458">参数可使用引用 / 指针</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="594" y="503">不需要在此读取字段</text><rect fill="#ffffff" height="398" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="392" x="1044" y="211" /><rect fill="#dd7135" height="55" opacity="1" rx="17" ry="17" stroke="none" width="392" x="1044" y="211" /><rect fill="#dd7135" height="26" opacity="1" rx="0" ry="0" stroke="none" width="392" x="1044" y="240" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="1068" y="248">IntSet.cpp / RealSet.cpp</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="1072" y="316">#include "IntSet.h"</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="1072" y="376">#include "RealSet.h"</text><text fill="#dd7135" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="1073" y="463">实际调用成员时要完整定义</text><path d="M471 401 L551 401" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><path d="M957 401 L1030 401" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="750" y="690">类名声明 不等于 类的完整定义；“只声明引用”与“创建对象/访问成员”所需信息不同</text></svg>