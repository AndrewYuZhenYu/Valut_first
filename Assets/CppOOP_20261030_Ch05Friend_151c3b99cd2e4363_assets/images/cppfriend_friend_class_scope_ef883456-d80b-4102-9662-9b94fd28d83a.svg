font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="422" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="500" x="74" y="226" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="500" x="74" y="226" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="500" x="74" y="255" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="98" y="263">CNode：权限授予方</text><text fill="#7257af" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="116" y="330">private:</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="24" font-weight="400" opacity="1" text-anchor="start" x="138" y="392">int mData;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="24" font-weight="400" opacity="1" text-anchor="start" x="138" y="445">CNode* pPrev;</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="24" font-weight="700" opacity="1" text-anchor="start" x="116" y="536">friend class CStack;</text><rect fill="#ffffff" height="422" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="503" x="910" y="226" /><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="503" x="910" y="226" /><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="503" x="910" y="255" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="934" y="263">CStack：获授权方</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="947" y="328">Push()    // 建立 pPrev</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="947" y="391">Pop()     // 读取字段</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="947" y="455">~CStack() // 遍历并释放</text><path d="M588 401 L894 401" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="5" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="742" y="375">单向授权</text><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="752" y="725">不是 CNode 的所有成员都变成 public；也不是 CNode 自动成为 CStack 的友元</text></svg>