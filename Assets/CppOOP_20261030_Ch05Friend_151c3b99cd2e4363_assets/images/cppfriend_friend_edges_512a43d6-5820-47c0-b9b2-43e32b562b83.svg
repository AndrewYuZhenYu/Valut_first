<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">02  友元关系：单向、非传递、非继承</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">箭头从“提供权限的类”指向“获权者”；虚线表示不能自动推得的权限</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="104" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="230" x="190" y="250" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" opacity="1" text-anchor="middle" x="305" y="315">类 A</text><rect fill="#ffffff" height="104" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="230" x="645" y="250" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" opacity="1" text-anchor="middle" x="760" y="315">类 B</text><rect fill="#ffffff" height="104" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="230" x="1100" y="250" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" opacity="1" text-anchor="middle" x="1215" y="315">类 C</text><path d="M425 301 L632 301" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="5" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="middle" x="515" y="273">A 声明 B 为友元</text><path d="M645 345 C580 438 475 448 415 350" fill="none" marker-end="url(#arr-red)" stroke="#bf4f55" stroke-dasharray="10,10" stroke-width="4" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="534" y="448">B 不会因此成为 A 的友元</text><path d="M885 301 L1085 301" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="5" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="middle" x="986" y="273">B 声明 C 为友元</text><path d="M305 376 C450 653 1020 659 1200 375" fill="none" marker-end="url(#arr-red)" stroke="#bf4f55" stroke-dasharray="12,11" stroke-width="4" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="758" y="640">A 不会因此让 C 成为其友元：友元不能传递</text><rect fill="#edf4f9" height="56" opacity="1" rx="16" ry="16" stroke="none" width="970" x="265" y="689" /><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="middle" x="750" y="727">若 B 有派生类 D，也不能因此推导 D 自动享有 B 的友元权限（友元关系不继承）</text></svg>