<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">24  Distance 的两条数据通路：Getter 与 friend</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">相同的几何计算，分别通过公开访问器和友元权限获取数据</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="111" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="341" x="580" y="195" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" opacity="1" text-anchor="middle" x="750" y="260">CPoint p1, p2</text><rect fill="#ffffff" height="252" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="555" x="115" y="380" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="555" x="115" y="380" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="555" x="115" y="409" /><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="139" y="417">方案 A：通过 Getter</text><rect fill="#ffffff" height="252" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="555" x="827" y="380" /><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="555" x="827" y="380" /><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="555" x="827" y="409" /><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="851" y="417">方案 B：经 friend</text><path d="M680 310 L392 380" fill="none" marker-end="url(#arr-blue)" stroke="#1769aa" stroke-width="4" /><path d="M825 310 L1094 380" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="144" y="466">dx = p2.GetX() - p1.GetX();</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" opacity="1" text-anchor="start" x="144" y="522">dy = p2.GetY() - p1.GetY();</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="852" y="466">dx = p2.mX - p1.mX;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="852" y="522">dy = p2.mY - p1.mY;</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="750" y="700">通常优先选择清晰稳定的公共接口；是否引入 friend 应由协作与封装权衡决定。</text></svg>