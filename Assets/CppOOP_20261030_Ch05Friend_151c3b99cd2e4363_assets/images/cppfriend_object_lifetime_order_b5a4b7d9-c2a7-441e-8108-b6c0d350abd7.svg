<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">54  静态对象与局部对象：构造析构调用时间线</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">zStaticObject 是静态存储期；main 内 a、b、c 是自动存储期，结束时逆序析构</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><line stroke="#506477" stroke-width="5" x1="153" x2="1347" y1="458" y2="458" /><circle cx="201" cy="458" fill="#13857d" r="11" stroke="none" stroke-width="2" /><circle cx="439" cy="458" fill="#13857d" r="11" stroke="none" stroke-width="2" /><circle cx="682" cy="458" fill="#13857d" r="11" stroke="none" stroke-width="2" /><circle cx="920" cy="458" fill="#13857d" r="11" stroke="none" stroke-width="2" /><circle cx="1148" cy="458" fill="#13857d" r="11" stroke="none" stroke-width="2" /><circle cx="1334" cy="458" fill="#13857d" r="11" stroke="none" stroke-width="2" /><line stroke="#13857d" stroke-width="2" x1="188" x2="188" y1="453" y2="316" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="188" y="296">静态 zStaticObject 构造</text><line stroke="#13857d" stroke-width="2" x1="428" x2="428" y1="453" y2="572" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="428" y="552">main: 构造 a/b/c</text><line stroke="#13857d" stroke-width="2" x1="676" x2="676" y1="453" y2="314" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="676" y="294">main 执行</text><line stroke="#13857d" stroke-width="2" x1="908" x2="908" y1="453" y2="570" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="908" y="550">main 结束：析构 c,b,a</text><line stroke="#13857d" stroke-width="2" x1="1147" x2="1147" y1="453" y2="314" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="1147" y="294">静态对象析构</text><line stroke="#13857d" stroke-width="2" x1="1315" x2="1315" y1="453" y2="572" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="1315" y="552">进程结束</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="753" y="698">同一作用域中的局部对象按构造的逆序销毁；静态成员只定义一份。</text></svg>