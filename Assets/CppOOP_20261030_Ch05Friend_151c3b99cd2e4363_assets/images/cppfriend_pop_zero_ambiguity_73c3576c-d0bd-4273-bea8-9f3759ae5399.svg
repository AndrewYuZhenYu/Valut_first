<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">41  空栈返回 0 为什么不能区分两种情况</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">栈中可能真的存着 0；与空栈失败时 return 0 的返回值完全相同</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="395" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="598" x="77" y="239" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="598" x="77" y="239" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="598" x="77" y="268" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="101" y="276">情形 A：栈内有一个 0</text><rect fill="#ffffff" height="128" opacity="1" rx="16" ry="16" stroke="#1769aa" stroke-width="2" width="305" x="217" y="352" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="29" font-weight="700" opacity="1" text-anchor="middle" x="367" y="419">mData = 0</text><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="377" y="560">Pop()  -&gt;  0  正常弹出</text><rect fill="#ffffff" height="395" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="598" x="825" y="239" /><rect fill="#bf4f55" height="55" opacity="1" rx="17" ry="17" stroke="none" width="598" x="825" y="239" /><rect fill="#bf4f55" height="26" opacity="1" rx="0" ry="0" stroke="none" width="598" x="825" y="268" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="849" y="276">情形 B：栈已经为空</text><rect fill="#fff3f2" height="126" opacity="1" rx="16" ry="16" stroke="#bf4f55" stroke-width="2" width="288" x="978" y="353" /><text fill="#bf4f55" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="1122" y="424">pTop = nullptr</text><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="1122" y="559">Pop()  -&gt;  0  失败哨兵</text><rect fill="#eef4f9" height="43" opacity="1" rx="11" ry="11" stroke="none" width="788" x="358" y="697" /><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="752.0" y="727">现代示例：空栈抛 std::underflow_error，避免把正常值当错误码</text></svg>