<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">30  打印空集合、单元素集合、多元素集合</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">用 i &lt; mCard 并在 i &gt; 0 时打印分隔符，可统一覆盖所有边界状态</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="122" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="1301" x="96" y="237" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="143" y="284">mCard = 0</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="542" y="285">循环次数：0</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" opacity="1" text-anchor="middle" x="1193" y="314">{}</text><rect fill="#ffffff" height="122" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="1301" x="96" y="398" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="143" y="445">mCard = 1</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="542" y="446">循环次数：1</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" opacity="1" text-anchor="middle" x="1193" y="475">{7}</text><rect fill="#ffffff" height="122" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="1301" x="96" y="559" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="143" y="606">mCard = 3</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="542" y="607">循环次数：3</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" opacity="1" text-anchor="middle" x="1193" y="636">{1, 2, 3}</text><rect fill="#eef4f9" height="43" opacity="1" rx="11" ry="11" stroke="none" width="845" x="330" y="748" /><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="752.5" y="778">边界检查：if (i &gt; 0) 输出 ", "；随后输出 mElems[i]</text></svg>