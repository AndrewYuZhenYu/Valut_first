ht="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#e7f1fa" height="110" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="265" x="165" y="334" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="297.5" y="387">pTop -&gt; 23</text><rect fill="#e7f1fa" height="110" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="265" x="435" y="334" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="567.5" y="387">23 -&gt; 10</text><rect fill="#e7f1fa" height="110" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="265" x="705" y="334" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="837.5" y="387">10 -&gt; null</text><rect fill="#fff4e9" height="118" opacity="1" rx="16" ry="16" stroke="#dd7135" stroke-width="2" width="450" x="548" y="516" /><text fill="#dd7135" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" opacity="1" text-anchor="middle" x="773" y="565">新结点 50</text><text fill="#dd7135" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="middle" x="773" y="606">pPrev = 旧 pTop (=23)</text><path d="M780 512 L780 452" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="802" y="480">新结点尚未接到 pTop</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="750" y="727">此时若没有执行 pTop = pNode，栈顶仍然是 23。</text></svg>