<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">55  指针“指向”不等于“拥有”：两个指针可指向同一对象</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">a.pObject = &amp;b 与 CObject::pStaticObject = &amp;c 只是保存地址，不意味着应该 delete b 或 c</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="121" opacity="1" rx="16" ry="16" stroke="#1769aa" stroke-width="2" width="315" x="135" y="228" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="29" font-weight="700" opacity="1" text-anchor="middle" x="291" y="281">a.pObject</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="291" y="315">非拥有指针</text><rect fill="#ffffff" height="121" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="343" x="1007" y="228" /><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="22" font-weight="700" opacity="1" text-anchor="middle" x="1175" y="278">CObject::pStaticObject</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="1175" y="317">类级非拥有指针</text><rect fill="#eef4fa" height="124" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="249" x="238" y="483" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="362" y="544">b（局部对象）</text><rect fill="#eef4fa" height="124" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="249" x="1040" y="483" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="1164" y="544">c（局部对象）</text><path d="M291 355 L358 470" fill="none" marker-end="url(#arr-blue)" stroke="#1769aa" stroke-width="4" /><path d="M1172 357 L1163 469" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><rect fill="#eef4f9" height="43" opacity="1" rx="11" ry="11" stroke="none" width="642" x="440" y="682" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="761.0" y="712">析构时不 delete 这两个地址，否则可能释放非堆对象</text></svg>