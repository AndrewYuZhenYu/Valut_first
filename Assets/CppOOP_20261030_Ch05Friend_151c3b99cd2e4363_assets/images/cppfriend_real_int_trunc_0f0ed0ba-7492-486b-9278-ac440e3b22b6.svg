<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">31  static_cast&lt;int&gt; 对浮点值：向零截断</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">转换不是四舍五入，也不是对负数取 floor；数值必须位于 int 可表示范围内</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="138" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="248" x="143" y="252" /><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="middle" x="267" y="307">4.8</text><path d="M266 396 L266 496" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4" /><rect fill="#e7f6f2" height="122" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="211" x="161" y="512" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700" opacity="1" text-anchor="middle" x="267" y="585">4</text><rect fill="#ffffff" height="138" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="248" x="457" y="252" /><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="middle" x="581" y="307">-3.7</text><path d="M580 396 L580 496" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4" /><rect fill="#e7f6f2" height="122" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="211" x="475" y="512" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700" opacity="1" text-anchor="middle" x="581" y="585">-3</text><rect fill="#ffffff" height="138" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="248" x="784" y="252" /><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="middle" x="908" y="307">0.9</text><path d="M907 396 L907 496" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4" /><rect fill="#e7f6f2" height="122" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="211" x="802" y="512" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700" opacity="1" text-anchor="middle" x="908" y="585">0</text><rect fill="#ffffff" height="138" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="248" x="1110" y="252" /><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="middle" x="1234" y="307">-0.9</text><path d="M1233 396 L1233 496" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4" /><rect fill="#e7f6f2" height="122" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="211" x="1128" y="512" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700" opacity="1" text-anchor="middle" x="1234" y="585">0</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="744" y="693">4.8 → 4；−3.7 → −3；绝不简单使用 floor(x) 来模拟 C++ 的整数转换。</text></svg>