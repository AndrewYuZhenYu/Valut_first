<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">19  为什么不能在类里直接放自身对象</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">对象大小必须有限、可计算；自身对象的无限嵌套无法完成布局，指针大小却固定</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="433" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="630" x="70" y="224" /><rect fill="#bf4f55" height="55" opacity="1" rx="17" ry="17" stroke="none" width="630" x="70" y="224" /><rect fill="#bf4f55" height="26" opacity="1" rx="0" ry="0" stroke="none" width="630" x="70" y="253" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="94" y="261">错误：CObject child;</text><rect fill="#fff3f1" height="279" opacity="1" rx="16" ry="16" stroke="#bf4f55" stroke-width="2" width="477" x="145" y="319" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="start" x="179" y="361">CObject</text><rect fill="#ffffff" height="175" opacity="1" rx="16" ry="16" stroke="#bf4f55" stroke-width="2" width="375" x="197" y="390" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="225" y="424">CObject child</text><rect fill="#fff3f1" height="86" opacity="1" rx="16" ry="16" stroke="#bf4f55" stroke-width="2" width="269" x="252" y="448" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="279" y="498">CObject child ...</text><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="225" y="624">每个对象内部继续无限包含一个对象</text><rect fill="#ffffff" height="433" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="649" x="775" y="224" /><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="649" x="775" y="224" /><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="649" x="775" y="253" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="799" y="261">正确：CObject* pObject;</text><rect fill="#eaf8f2" height="174" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="243" x="840" y="327" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="middle" x="958" y="377">CObject</text><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="middle" x="958" y="427">pObject</text><rect fill="#ffffff" height="174" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="195" x="1173" y="327" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="1270" y="408">另一个</text><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="1270" y="452">CObject</text><path d="M1083 419 L1158 419" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="910" y="601">指针占固定大小，不会递归存放整个对象</text></svg>