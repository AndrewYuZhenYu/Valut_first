93" x="325" y="262" /><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="middle" x="400" y="450">i = 1，找到 2</text><path d="M750 342 L1125 342" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4" /><text fill="#dd7135" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="920" y="313">mElems[i] == value</text><rect fill="#e5f6f2" height="124" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="337" x="1065" y="460" /><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" opacity="1" text-anchor="middle" x="1231" y="512">mCard: 3 → 3</text><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="start" x="1231" y="552">数组不变，返回 NOERR</text><rect fill="#eef4f9" height="43" opacity="1" rx="11" ry="11" stroke="none" width="870" x="304" y="631" /><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="739.0" y="661">容量检查必须放在查重之后：满集合里已存在的值也不应报溢出</text></svg>