<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">07  两种集合转换实现：封装接口与友元直达</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">对照函数调用的路径；不是所有“少一次调用”都有值得牺牲封装的收益</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="439" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="635" x="83" y="217" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="635" x="83" y="217" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="635" x="83" y="246" /><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="107" y="254">通过公开接口（非友元）</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="115" y="329">CRealSet::Empty()</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="115" y="392">CRealSet::AddItem(value)</text><line stroke="#dbe4ec" stroke-width="2" x1="130" x2="660" y1="431" y2="431" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="126" y="492">✓ 自动检查重复项</text><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="126" y="537">✓ 维护 mCard 不变量</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="126" y="584">• 通过公开方法调用</text><rect fill="#ffffff" height="439" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="635" x="792" y="217" /><rect fill="#dd7135" height="55" opacity="1" rx="17" ry="17" stroke="none" width="635" x="792" y="217" /><rect fill="#dd7135" height="26" opacity="1" rx="0" ry="0" stroke="none" width="635" x="792" y="246" /><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="816" y="254">友元直接访问（需自行负责一致性）</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="825" y="329">target.mCard = source.mCard</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" opacity="1" text-anchor="start" x="825" y="393">target.mElems[i] = ...</text><line stroke="#dbe4ec" stroke-width="2" x1="836" x2="1361" y1="431" y2="431" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="833" y="492">! 可能绕过去重逻辑</text><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="833" y="537">! 直接依赖类内部结构</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="833" y="584">• 修改类结构需复核友元代码</text></svg>