oto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="953" y="267">CTwo 的 private 成员</text><text fill="#7257af" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="35" font-weight="700" opacity="1" text-anchor="start" x="987" y="371">mY1</text><text fill="#7257af" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="35" font-weight="700" opacity="1" text-anchor="start" x="987" y="460">mY2</text><path d="M572 354 C740 354 755 385 906 385" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="5" /><path d="M573 446 C739 451 750 475 900 488" fill="none" marker-end="url(#arr-red)" stroke="#bf4f55" stroke-dasharray="7,9" stroke-width="3" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" opacity="1" text-anchor="middle" x="746" y="438">其他成员：拒绝</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="751" y="704">类成员函数的友元声明需先让编译器看到 COne 及其成员声明。</text></svg>