<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">14  析构函数：沿 pPrev 逐结点清空</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">循环每次先记住下一结点，然后 delete 当前结点，直到 pTop == nullptr</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="125" opacity="1" rx="12" ry="12" stroke="#13857d" stroke-width="4" width="207" x="157" y="286" /><rect fill="#eef4f9" height="48" opacity="1" rx="12" ry="12" stroke="none" width="207" x="157" y="286" /><rect fill="#eef4f9" height="18" opacity="1" rx="0" ry="0" stroke="none" width="207" x="157" y="316" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" opacity="1" text-anchor="start" x="175" y="321">50</text><line stroke="#dbe4ec" stroke-width="2" x1="157" x2="364" y1="352" y2="352" /><text fill="#506477" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="175" y="390">pPrev</text><circle cx="344" cy="379" fill="#13857d" r="5" stroke="none" stroke-width="2" /><rect fill="#eef4f9" height="43" opacity="1" rx="11" ry="11" stroke="none" width="192" x="165" y="464" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="261.0" y="494">第 1 次 delete</text><path d="M367 349 L555 349" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><rect fill="#ffffff" height="125" opacity="1" rx="12" ry="12" stroke="#13857d" stroke-width="4" width="207" x="587" y="286" /><rect fill="#eef4f9" height="48" opacity="1" rx="12" ry="12" stroke="none" width="207" x="587" y="286" /><rect fill="#eef4f9" height="18" opacity="1" rx="0" ry="0" stroke="none" width="207" x="587" y="316" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" opacity="1" text-anchor="start" x="605" y="321">23</text><line stroke="#dbe4ec" stroke-width="2" x1="587" x2="794" y1="352" y2="352" /><text fill="#506477" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="605" y="390">pPrev</text><circle cx="774" cy="379" fill="#13857d" r="5" stroke="none" stroke-width="2" /><rect fill="#eef4f9" height="43" opacity="1" rx="11" ry="11" stroke="none" width="192" x="595" y="464" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="691.0" y="494">第 2 次 delete</text><path d="M797 349 L985 349" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><rect fill="#ffffff" height="125" opacity="1" rx="12" ry="12" stroke="#13857d" stroke-width="4" width="207" x="1017" y="286" /><rect fill="#eef4f9" height="48" opacity="1" rx="12" ry="12" stroke="none" width="207" x="1017" y="286" /><rect fill="#eef4f9" height="18" opacity="1" rx="0" ry="0" stroke="none" width="207" x="1017" y="316" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" opacity="1" text-anchor="start" x="1035" y="321">10</text><line stroke="#dbe4ec" stroke-width="2" x1="1017" x2="1224" y1="352" y2="352" /><text fill="#506477" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="1035" y="390">pPrev</text><circle cx="1204" cy="379" fill="#13857d" r="5" stroke="none" stroke-width="2" /><rect fill="#eef4f9" height="43" opacity="1" rx="11" ry="11" stroke="none" width="192" x="1025" y="464" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" opacity="1" text-anchor="middle" x="1121.0" y="494">第 3 次 delete</text><path d="M1234 350 L1400 350" fill="none" marker-end="url(#arr-blue)" stroke="#1769aa" stroke-width="4" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="20" font-weight="400" opacity="1" text-anchor="end" x="1390" y="325">nullptr</text><rect fill="#edf4fa" height="85" opacity="1" rx="16" ry="16" stroke="none" width="1115" x="174" y="591" /><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="750" y="644">while (pTop) { CNode* old = pTop; pTop = pTop-&gt;pPrev; delete old; }</text><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="middle" x="750" y="731">析构只释放自己拥有的动态结点；不要删除仅指向别处的非拥有指针</text></svg>