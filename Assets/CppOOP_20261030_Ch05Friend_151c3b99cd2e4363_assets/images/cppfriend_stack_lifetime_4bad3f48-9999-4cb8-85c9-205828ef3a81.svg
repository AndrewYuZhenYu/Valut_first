<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">43  栈对象的作用域结束：析构顺序与残留结点</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">局部 CStack 创建后 Push 三次、Pop 两次，main 返回时析构函数会释放剩下的结点</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="133" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="226" x="93" y="282" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="206" y="357">构造空栈</text><path d="M325 348 L344 348" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3" /><rect fill="#ffffff" height="133" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="226" x="348" y="282" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="461" y="357">Push 10</text><path d="M580 348 L599 348" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3" /><rect fill="#ffffff" height="133" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="226" x="603" y="282" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="716" y="357">Push 23</text><path d="M835 348 L854 348" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3" /><rect fill="#ffffff" height="133" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="226" x="858" y="282" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="971" y="357">Push 50</text><path d="M1090 348 L1109 348" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3" /><rect fill="#ffffff" height="133" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="226" x="1114" y="282" /><text fill="#dd7135" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="1227" y="357">Pop 50/23</text><rect fill="#e7f5f1" height="111" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="480" x="509" y="508" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" opacity="1" text-anchor="middle" x="749" y="555">作用域结束  -&gt;  ~CStack()</text><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="749" y="597">delete 剩余结点 10</text><path d="M1224 425 C1224 483 1080 548 1007 548" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4" /><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="750" y="696">无需手动写 delete stack；局部对象析构时负责清理它所拥有的结点。</text></svg>