<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">42  持有堆结点的 CStack：默认浅拷贝造成双重释放</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">CStack b = a 会复制 pTop 指针而不是复制整条链，两个析构函数就会重复 delete 同一结点</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="143" opacity="1" rx="16" ry="16" stroke="#1769aa" stroke-width="2" width="274" x="140" y="225" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="28" font-weight="700" opacity="1" text-anchor="middle" x="277" y="285">CStack a</text><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="23" font-weight="700" opacity="1" text-anchor="middle" x="277" y="333">pTop  ─────┐</text><rect fill="#ffffff" height="143" opacity="1" rx="16" ry="16" stroke="#dd7135" stroke-width="2" width="274" x="140" y="481" /><text fill="#dd7135" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" opacity="1" text-anchor="middle" x="277" y="539">CStack b = a</text><text fill="#dd7135" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="23" font-weight="700" opacity="1" text-anchor="middle" x="277" y="589">pTop  ─────┘</text><rect fill="#e6f5f0" height="154" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="402" x="820" y="342" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="31" font-weight="700" opacity="1" text-anchor="middle" x="1021" y="407">同一批堆结点</text><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="1021" y="452">50  -&gt;  23  -&gt;  10</text><path d="M421 320 L756 320 L808 385" fill="none" marker-end="url(#arr-blue)" stroke="#1769aa" stroke-width="3" /><path d="M421 569 L757 569 L807 454" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="3" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="742" y="702">本例显式禁止复制；更完整的设计可选择深拷贝或标准容器管理资源。</text></svg>