<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">20  静态成员与普通成员：存储位置不同</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">mID 与 pObject 随每个实例各有一份；static 成员属于类，共用一份独立存储</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="246" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="398" x="75" y="208" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="398" x="75" y="208" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="398" x="75" y="237" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="99" y="245">zObjectA</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="100" y="306">mID = 1</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="100" y="369">pObject = 地址 / null</text><rect fill="#ffffff" height="246" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="398" x="515" y="208" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="398" x="515" y="208" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="398" x="515" y="237" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="539" y="245">zObjectB</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="540" y="306">mID = 2</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="540" y="369">pObject = 地址 / null</text><rect fill="#ffffff" height="246" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="398" x="955" y="208" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="398" x="955" y="208" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="398" x="955" y="237" /><text fill="#ffffff" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="979" y="245">zObjectC</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="25" font-weight="400" opacity="1" text-anchor="start" x="980" y="306">mID = 3</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="20" font-weight="400" opacity="1" text-anchor="start" x="980" y="369">pObject = 地址 / null</text><rect fill="#e8f5f1" height="114" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="1110" x="205" y="548" /><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="750" y="595">CObject::zStaticObject   /   CObject::pStaticObject</text><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="750" y="636">所有 CObject 实例共同访问同一份静态成员数据</text><path d="M277 455 L277 527 L750 527 L750 546" fill="none" stroke="#13857d" stroke-width="2.5" /><path d="M717 455 L717 527 L750 527 L750 546" fill="none" stroke="#13857d" stroke-width="2.5" /><path d="M1157 455 L1157 527 L750 527 L750 546" fill="none" stroke="#13857d" stroke-width="2.5" /></svg>