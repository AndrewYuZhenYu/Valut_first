<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">56  CStudent::SetName：重新分配字符数组的全过程</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">先释放旧缓冲区，再按 strlen+1 分配，复制字符和结尾 \0；空指针时应保持一致的空状态</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="157" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="362" x="93" y="279" /><text fill="#1769aa" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="middle" x="274" y="324">m_pName → 旧缓冲区</text><rect fill="#e7f1fa" height="53" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="71" x="122" y="362" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="157.5" y="415">A</text><rect fill="#e7f1fa" height="53" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="71" x="198" y="362" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="233.5" y="415">n</text><rect fill="#e7f1fa" height="53" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="71" x="274" y="362" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="309.5" y="415">n</text><rect fill="#e7f1fa" height="53" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="71" x="350" y="362" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="385.5" y="415">\0</text><path d="M464 365 L686 365" fill="none" marker-end="url(#arr-orange)" stroke="#dd7135" stroke-width="4" /><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="middle" x="563" y="339">delete[]</text><rect fill="#fff1e8" height="156" opacity="1" rx="16" ry="16" stroke="#dd7135" stroke-width="2" width="251" x="709" y="280" /><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="833" y="342">旧存储失效</text><text fill="#dd7135" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="833" y="390">再申请新内存</text><path d="M974 365 L1118 365" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><rect fill="#ffffff" height="157" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="313" x="1121" y="279" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="middle" x="1275" y="324">m_pName → 新缓冲区</text><rect fill="#e6f6f2" height="53" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="65" x="1141" y="362" /><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="1173.5" y="415">B</text><rect fill="#e6f6f2" height="53" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="65" x="1211" y="362" /><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="1243.5" y="415">o</text><rect fill="#e6f6f2" height="53" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="65" x="1281" y="362" /><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="1313.5" y="415">b</text><rect fill="#e6f6f2" height="53" opacity="1" rx="7" ry="7" stroke="#dbe4ec" stroke-width="2" width="65" x="1351" y="362" /><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="1383.5" y="415">\0</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" opacity="1" text-anchor="middle" x="746" y="596">name = "Bob" 需要 4 字节：B | o | b | \0</text><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="746" y="708">额外注意：原课件的先 delete 再从 pName 复制，在参数与旧缓冲区别名时存在风险。</text></svg>