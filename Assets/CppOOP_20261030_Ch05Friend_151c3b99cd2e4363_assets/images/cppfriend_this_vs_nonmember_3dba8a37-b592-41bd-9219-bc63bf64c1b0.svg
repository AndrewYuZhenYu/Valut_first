<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">23  this 从哪里来：成员函数与友元函数的调用差异</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">成员函数可通过隐式 this 访问自己所属对象；友元函数必须通过显式传入的对象</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="460" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="640" x="69" y="203" /><rect fill="#1769aa" height="55" opacity="1" rx="17" ry="17" stroke="none" width="640" x="69" y="203" /><rect fill="#1769aa" height="26" opacity="1" rx="0" ry="0" stroke="none" width="640" x="69" y="232" /><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="93" y="240">CPoint::GetX()：成员函数</text><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" opacity="1" text-anchor="start" x="121" y="312">p1.GetX()</text><path d="M257 340 L257 423" fill="none" marker-end="url(#arr-blue)" stroke="#1769aa" stroke-width="4" /><rect fill="#eef4f9" height="100" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="355" x="136" y="442" /><text fill="#1769aa" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="start" x="174" y="501">this → p1  (mX=3.5)</text><text fill="#506477" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="114" y="594">实现：return mX;  等价于 this-&gt;mX</text><rect fill="#ffffff" height="460" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="644" x="785" y="203" /><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="644" x="785" y="203" /><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="644" x="785" y="232" /><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="809" y="240">Distance(p1, p2)：友元函数</text><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="700" opacity="1" text-anchor="start" x="831" y="312">Distance(p1, p2)</text><rect fill="#e7f6f2" height="117" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="250" x="845" y="414" /><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="970" y="485">a → p1</text><rect fill="#e7f6f2" height="117" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="250" x="1140" y="414" /><text fill="#13857d" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" opacity="1" text-anchor="middle" x="1265" y="485">b → p2</text><path d="M958 334 L958 408" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3" /><path d="M1255 334 L1255 408" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="3" /><text fill="#506477" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="1104" y="589">没有 this；通过 a.mX / b.mX 访问</text></svg>