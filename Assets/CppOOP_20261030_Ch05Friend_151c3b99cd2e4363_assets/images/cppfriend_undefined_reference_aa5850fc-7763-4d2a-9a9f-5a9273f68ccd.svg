<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">45  只有 main.cpp：能编译不等于能链接</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">如果 Point.cpp 没有参与构建，调用 CPoint 构造函数 / Distance 的符号就找不到定义</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="125" opacity="1" rx="16" ry="16" stroke="#1769aa" stroke-width="2" width="345" x="116" y="239" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" opacity="1" text-anchor="middle" x="289" y="295">main.cpp</text><text fill="#506477" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="289" y="334">含调用声明</text><path d="M465 296 L670 296" fill="none" marker-end="url(#arr-blue)" stroke="#1769aa" stroke-width="4" /><rect fill="#ffffff" height="130" opacity="1" rx="16" ry="16" stroke="#dbe4ec" stroke-width="2" width="302" x="686" y="231" /><text fill="#1769aa" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" opacity="1" text-anchor="middle" x="836" y="294">main.o</text><text fill="#dd7135" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" opacity="1" text-anchor="start" x="836" y="335">未解析符号</text><path d="M994 299 L1180 299" fill="none" marker-end="url(#arr-red)" stroke="#bf4f55" stroke-width="4" /><rect fill="#fff1ef" height="118" opacity="1" rx="16" ry="16" stroke="#bf4f55" stroke-width="2" width="223" x="1188" y="237" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" opacity="1" text-anchor="middle" x="1300" y="301">链接失败</text><rect fill="#e8f6f2" height="127" opacity="1" rx="16" ry="16" stroke="#13857d" stroke-width="2" width="417" x="264" y="483" /><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" opacity="1" text-anchor="middle" x="472" y="537">Point.cpp  -&gt;  Point.o</text><text fill="#13857d" font-family="Noto Sans CJK SC, Noto Sans SC, SimHei, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="start" x="472" y="576">提供所需函数定义</text><path d="M688 550 L832 550 L832 368" fill="none" marker-end="url(#arr-teal)" stroke="#13857d" stroke-width="4" /><text fill="#506477" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, Noto Sans Mono, monospace" font-size="22" font-weight="700" opacity="1" text-anchor="start" x="760" y="693">g++ main.cpp Point.cpp -o app  // 所有需要的源文件都应参与同一次构建</text></svg>