<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="820" version="1.1" viewBox="0 0 1500 820" width="1500" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arr-blue" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#1769aa" /></marker><marker id="arr-teal" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#13857d" /></marker><marker id="arr-red" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf4f55" /></marker><marker id="arr-orange" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#dd7135" /></marker><marker id="arr-gray" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#506477" /></marker><marker id="arr-purple" markerHeight="10" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7257af" /></marker></defs><rect fill="#f7f9fc" height="820" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><rect fill="#13857d" height="12" opacity="1" rx="0" ry="0" stroke="none" stroke-width="2" width="1500" x="0" y="0" /><text fill="#152738" font-family="Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" opacity="1" text-anchor="start" x="62" y="68">40  Pop 的危险错误：先 delete 再读取 pPrev</text><text fill="#506477" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" opacity="1" text-anchor="start" x="62" y="109">delete oldTop 后内存已失效，不能继续用 oldTop-&gt;pPrev；这属于未定义行为</text><line stroke="#dbe4ec" stroke-width="2" x1="62" x2="1438" y1="130" y2="130" /><text fill="#7892a4" font-family="Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" opacity="1" text-anchor="start" x="62" y="794">C++  ·  第五讲 友元   /   原创机制示意图</text><rect fill="#ffffff" height="422" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="595" x="87" y="233" /><rect fill="#bf4f55" height="55" opacity="1" rx="17" ry="17" stroke="none" width="595" x="87" y="233" /><rect fill="#bf4f55" height="26" opacity="1" rx="0" ry="0" stroke="none" width="595" x="87" y="262" /><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="111" y="270">错误顺序</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="121" y="326">CNode* old = pTop;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="121" y="395">delete old;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="121" y="464">pTop = old-&gt;pPrev;   // 错误！</text><rect fill="#fff0ef" height="60" opacity="1" rx="16" ry="16" stroke="none" width="490" x="131" y="555" /><text fill="#bf4f55" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" opacity="1" text-anchor="middle" x="377" y="597">读取已释放对象 = 未定义行为</text><rect fill="#ffffff" height="422" opacity="1" rx="20" ry="20" stroke="#dbe4ec" stroke-width="2" width="609" x="808" y="233" /><rect fill="#13857d" height="55" opacity="1" rx="17" ry="17" stroke="none" width="609" x="808" y="233" /><rect fill="#13857d" height="26" opacity="1" rx="0" ry="0" stroke="none" width="609" x="808" y="262" /><text fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" opacity="1" text-anchor="start" x="832" y="270">正确顺序</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="847" y="326">CNode* old = pTop;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="847" y="391">pTop = old-&gt;pPrev;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="847" y="456">int data = old-&gt;mData;</text><text fill="#152738" font-family="Noto Sans Mono CJK SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" opacity="1" text-anchor="start" x="847" y="521">delete old;</text><rect fill="#e7f6f1" height="54" opacity="1" rx="16" ry="16" stroke="none" width="488" x="856" y="569" /><text fill="#13857d" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" opacity="1" text-anchor="middle" x="1100" y="606">先保存需要的信息再释放</text></svg>