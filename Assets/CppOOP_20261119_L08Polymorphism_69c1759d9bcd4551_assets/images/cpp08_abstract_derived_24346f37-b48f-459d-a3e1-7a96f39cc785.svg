<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="690px" version="1.1" viewBox="0 0 1120 690" width="1120px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="690" width="1120" x="0" y="0" /><rect fill="#2c68a3" height="7" width="1120" x="0" y="0" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="52" y="60">未实现全部纯虚函数的派生类仍是抽象类</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="52" y="103">从上到下为继承/覆盖关系</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.6" x1="52" x2="1068" y1="118" y2="118" /><rect fill="#eaf3fa" height="86" rx="14" ry="14" stroke="#2c68a3" stroke-width="2.2" width="252" x="435" y="145" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="561.0" y="169.0">Base</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" x="561.0" y="208.0">virtual F() = 0</text><rect fill="#e4f5f1" height="86" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="252" x="435" y="290" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="561.0" y="314.0">Middle</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" x="561.0" y="353.0">未重写 F()</text><rect fill="#e4f5f1" height="86" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="252" x="435" y="430" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="561.0" y="454.0">Final</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" x="561.0" y="493.0">F() override</text><line stroke="#c85d56" stroke-linecap="round" stroke-width="3" x1="561" x2="561" y1="233" y2="285" /><polygon fill="#c85d56" points="561,285 555.5653645754512,274.30118054165604 566.4346354245488,274.30118054165604" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" x="573.0" y="263.5">仍然抽象</text><line stroke="#138d86" stroke-linecap="round" stroke-width="3" x1="561" x2="561" y1="378" y2="425" /><polygon fill="#138d86" points="561,425 555.5653645754512,414.30118054165604 566.4346354245488,414.30118054165604" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" x="573.0" y="406.0">变为具体类</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.5" x1="52" x2="1068" y1="620" y2="620" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" x="55" y="662">只有满足所有最终纯虚函数要求后，派生类才可被实例化</text></svg>