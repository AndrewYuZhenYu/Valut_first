<svg baseProfile="full" height="540px" version="1.1" viewBox="0 0 1120 540" width="1120px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="540" width="1120" x="0" y="0" /><rect fill="#2c68a3" height="7" width="1120" x="0" y="0" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="52" y="60">const 成员限定符不同，函数不是同一虚槽</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="52" y="103">同一表达式在两种声明下产生不同的调用效果</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.6" x1="52" x2="1068" y1="118" y2="118" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" x="65" y="147">基类</text><rect fill="#eaf3fa" height="88" rx="14" ry="14" stroke="#2c68a3" stroke-width="2.2" width="282" x="63" y="170" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="204.0" y="214.0">virtual void F() const</text><line stroke="#2c68a3" stroke-linecap="round" stroke-width="4" x1="356" x2="435" y1="213" y2="213" /><polygon fill="#2c68a3" points="435,213 423.40961225346075,218.88752170992788 423.40961225346075,207.11247829007212" /><rect fill="#e4f5f1" height="88" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="246" x="447" y="170" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="570.0" y="214.0">Base 虚函数</text><line stroke="#b7852d" stroke-linecap="round" stroke-width="4" x1="707" x2="787" y1="213" y2="213" /><polygon fill="#b7852d" points="787,213 775.4096122534608,218.88752170992788 775.4096122534608,207.11247829007212" 