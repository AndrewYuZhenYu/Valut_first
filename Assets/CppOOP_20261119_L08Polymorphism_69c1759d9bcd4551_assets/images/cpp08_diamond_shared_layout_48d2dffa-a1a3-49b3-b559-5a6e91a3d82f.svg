<svg baseProfile="full" height="600px" version="1.1" viewBox="0 0 1120 600" width="1120px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="600" width="1120" x="0" y="0" /><rect fill="#2c68a3" height="7" width="1120" x="0" y="0" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="52" y="60">虚继承后的 Bat 只共享一个 Animal</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="52" y="103">按对象内实际存在的基类子对象绘制结构</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.6" x1="52" x2="1068" y1="118" y2="118" /><rect fill="#e4f5f1" height="97" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="300" x="63" y="168" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="213.0" y="197.5">CBeast 部分</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" x="213.0" y="236.5">指向共享基类</text><rect fill="#e4f5f1" height="97" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="300" x="751" y="168" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="901.0" y="197.5">CBird 部分</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" x="901.0" y="236.5">指向共享基类</text><rect fill="#eaf3fa" height="90" rx="14" ry="14" stroke="#2c68a3" stroke-width="2.2" width="296" x="411" y="303" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="559.0" y="