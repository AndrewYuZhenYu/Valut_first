="985" y="393">同名同参</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="985" y="429">可覆盖</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.5" x1="52" x2="1068" y1="500" y2="500" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" x="55" y="542">派生类中引入同名函数通常隐藏基类同名重载集；可用 using Base::Who 恢复</text></svg>