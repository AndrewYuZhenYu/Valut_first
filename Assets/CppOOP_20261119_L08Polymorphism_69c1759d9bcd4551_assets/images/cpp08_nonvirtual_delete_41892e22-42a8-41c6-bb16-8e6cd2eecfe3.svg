<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 1120 560" width="1120px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="560" width="1120" x="0" y="0" /><rect fill="#2c68a3" height="7" width="1120" x="0" y="0" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="52" y="60">非虚析构下经基类指针删除是未定义行为</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="52" y="103">根据 C++ 对象与函数的实际性质判断调用规则</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.6" x1="52" x2="1068" y1="118" y2="118" /><polygon fill="#eaf3fa" points="555,161.0 755.0,220 555,279.0 355.0,220" stroke="#2c68a3" stroke-width="2.5" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="555" y="230">通过 Base* delete 派生对象，基类析构虚吗？</text><line stroke="#138d86" stroke-linecap="round" stroke-width="4" x1="355" x2="205" y1="220" y2="310" /><polygon fill="#138d86" points="205,310 211.90957056917748,298.98828648440417 217.9677804286681,309.0853029168885" /><line stroke="#c85d56" stroke-linecap="round" stroke-width="4" x1="755" x2="906" y1="220" y2="310" /><polygon fill="#c85d56" points="906,310 893.0295979633877,309.12326115140087 899.0582297580931,299.0085566958394" /><text fill="#138d86" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" x="270" y="261">是</text><text fill="#c85d56" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" x="818" y="261">否</text><rect fill="#e4f5f1" height="139" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="408" x="60" y="324" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="264.0" y="374.5">虚析构</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" x="264.0" y="413.5">正确完整销毁对象</text><rect fill="#fff0ee" height="139" rx="14" ry="14" stroke="#c85d56" stroke-width="2.2" width="408" x="651" y="324" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="855.0" y="374.5">非虚且不满足特例</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" x="855.0" y="413.5">未定义行为</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.5" x1="52" x2="1068" y1="490" y2="490" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" x="55" y="532">不能把未定义行为简单总结为“只执行基类析构”；具体表现无保证</text></svg>