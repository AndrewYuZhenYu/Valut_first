<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="570px" version="1.1" viewBox="0 0 1120 570" width="1120px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="570" width="1120" x="0" y="0" /><rect fill="#2c68a3" height="7" width="1120" x="0" y="0" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="52" y="60">重写必须匹配对应函数的参数与限定符</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="52" y="103">相同函数名不保证构成重写（override）</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.6" x1="52" x2="1068" y1="118" y2="118" /><rect fill="#eaf3fa" height="78" rx="14" ry="14" stroke="#2c68a3" stroke-width="2.2" width="405" x="58" y="147" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="73" y="196">virtual void Who();</text><line stroke="#2c68a3" stroke-linecap="round" stroke-width="3" x1="470" x2="529" y1="187" y2="187" /><polygon fill="#2c68a3" points="529,187 519.1927488298513,191.98174913916975 519.1927488298513,182.01825086083025" /><rect fill="#e4f5f1" height="78" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="393" x="537" y="147" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="552" y="196">void Who() override;</text><text fill="#138d86" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" x="985" y="181">重写</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="985" y="217">匹配</text><rect fill="#eaf3fa" height="78" rx="14" ry="14" stroke="#2c68a3" stroke-width="2.2" width="405" x="58" y="253" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="73" y="302">virtual void Who() const;</text><line stroke="#2c68a3" stroke-linecap="round" stroke-width="3" x1="470" x2="529" y1="293" y2="293" /><polygon fill="#2c68a3" points="529,293 519.1927488298513,297.9817491391698 519.1927488298513,288.0182508608302" /><rect fill="#e4f5f1" height="78" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="393" x="537" y="253" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="552" y="302">void Who() const override;</text><text fill="#138d86" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" x="985" y="287">重写</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="985" y="323">匹配</text><rect fill="#eaf3fa" height="78" rx="14" ry="14" stroke="#2c68a3" stroke-width="2.2" width="405" x="58" y="359" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="73" y="408">virtual void Who() const;</text><line stroke="#2c68a3" stroke-linecap="round" stroke-width="3" x1="470" x2="529" y1="399" y2="399" /><polygon fill="#2c68a3" points="529,399 519.1927488298513,403.9817491391698 519.1927488298513,394.0182508608302" /><rect fill="#e4f5f1" height="78" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="393" x="537" y="359" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="start" x="552" y="408">void Who() override;</text><text fill="#c85d56" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" x="985" y="393">错误</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="middle" x="985" y="429">不匹配</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.5" x1="52" x2="1068" y1="500" y2="500" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" x="55" y="542">返回类型通常也需匹配；协变返回类型是有限例外</text></svg>