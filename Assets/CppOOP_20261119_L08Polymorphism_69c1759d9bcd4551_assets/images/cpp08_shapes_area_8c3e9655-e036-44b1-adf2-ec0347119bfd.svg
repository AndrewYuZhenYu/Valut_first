<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="580px" version="1.1" viewBox="0 0 1120 580" width="1120px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="580" width="1120" x="0" y="0" /><rect fill="#2c68a3" height="7" width="1120" x="0" y="0" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="52" y="60">相同 Area() 接口在不同几何对象上计算</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="52" y="103">不同具体图形通过同一个虚接口计算面积</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.6" x1="52" x2="1068" y1="118" y2="118" /><circle cx="209" cy="285" fill="#e4f5f1" r="83" stroke="#138d86" stroke-width="5" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="29" font-weight="400" text-anchor="middle" x="209" y="299">r=2</text><rect fill="#eaf3fa" height="116" stroke="#2c68a3" stroke-width="5" width="195" x="494" y="229" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" x="591" y="294">w=3, h=4</text><polygon fill="#fbf1de" points="818,355 993,355 905,205" stroke="#b7852d" stroke-width="5" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="middle" x="905" y="390">b=6, h=3</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" x="209" y="434">圆形</text><text fill="#138d86" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" x="209" y="480">Area() = 4π</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" x="591" y="434">矩形</text><text fill="#2c68a3" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" x="591" y="480">Area() = 12</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" x="905" y="434">三角形</text><text fill="#b7852d" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" x="905" y="480">Area() = 9</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.5" x1="52" x2="1068" y1="510" y2="510" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" x="55" y="552">用 Shape* 指向三种派生对象，调用 Area() 得到各自的结果</text></svg>