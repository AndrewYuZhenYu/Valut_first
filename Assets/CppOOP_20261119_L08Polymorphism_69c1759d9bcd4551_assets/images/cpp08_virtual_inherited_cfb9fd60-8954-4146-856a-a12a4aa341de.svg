<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="550px" version="1.1" viewBox="0 0 1120 550" width="1120px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="550" width="1120" x="0" y="0" /><rect fill="#2c68a3" height="7" width="1120" x="0" y="0" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="52" y="60">派生类不再写 virtual 仍然保留虚特性</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="52" y="103">从上到下为继承/覆盖关系</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.6" x1="52" x2="1068" y1="118" y2="118" /><rect fill="#eaf3fa" height="86" rx="14" ry="14" stroke="#2c68a3" stroke-width="2.2" width="252" x="435" y="151" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="561.0" y="175.0">CAnimal</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" x="561.0" y="214.0">virtual void Who()</text><rect fill="#e4f5f1" height="86" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="252" x="435" y="346" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="561.0" y="370.0">CBird</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" x="561.0" y="409.0">void Who() override</text><line stroke="#138d86" stroke-linecap="round" stroke-width="3" x1="561" x2="561" y1="239" y2="341" /><polygon fill="#138d86" points="561,341 555.5653645754512,330.30118054165604 566.4346354245488,330.30118054165604" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="middle" x="573.0" y="294.5">覆盖同一虚函数</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.5" x1="52" x2="1068" y1="480" y2="480" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" x="55" y="522">建议在派生类使用 override 显式标注重写意图</text></svg>