<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="600px" version="1.1" viewBox="0 0 1120 600" width="1120px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="600" width="1120" x="0" y="0" /><rect fill="#2c68a3" height="7" width="1120" x="0" y="0" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="52" y="60">典型实现：派生对象的虚函数槽更新</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="52" y="103">对象内存布局仅为典型实现示意，不是标准规定的固定字节布局</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.6" x1="52" x2="1068" y1="118" y2="118" /><rect fill="#eaf3fa" height="92" rx="14" ry="14" stroke="#2c68a3" stroke-width="2.2" width="258" x="58" y="220" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" x="187.0" y="266.0">CAnimal* p</text><line stroke="#2c68a3" stroke-linecap="round" stroke-width="4" x1="322" x2="422" y1="263" y2="263" /><polygon fill="#2c68a3" points="422,263 410.40961225346075,268.8875217099279 410.40961225346075,257.1124782900721" /><rect fill="#e4f5f1" height="235" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="270" x="430" y="160" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" x="565" y="201">CBird 对象</text><line stroke="#138d86" stroke-linecap="round" stroke-width="2" x1="430" x2="700" y1="225" y2="225" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" x="467" y="270">vptr</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="2" x1="445" x2="684" y1="287" y2="287" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="27" font-weight="400" text-anchor="middle" x="565" y="335">对象数据成员</text><line stroke="#c85d56" stroke-linecap="round" stroke-width="4" x1="690" x2="768" y1="259" y2="259" /><polygon fill="#c85d56" points="768,259 756.4096122534608,264.8875217099279 756.4096122534608,253.11247829007212" /><rect fill="#fbf1de" height="230" rx="14" ry="14" stroke="#b7852d" stroke-width="2.2" width="293" x="774" y="165" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" x="922" y="209">CBird vtable</text><line stroke="#b7852d" stroke-linecap="round" stroke-width="2" x1="781" x2="1060" y1="228" y2="228" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" x="817" y="290">槽位：Who →</text><rect fill="#ffffff" height="49" rx="9" ry="9" stroke="#b7852d" stroke-width="2.2" width="220" x="809" y="321" /><text fill="#c85d56" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="918" y="354">CBird::Who</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.5" x1="52" x2="1068" y1="530" y2="530" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" x="55" y="572">标准保证虚调用行为，不要求所有编译器必须采用 vptr / vtable 实现</text></svg>