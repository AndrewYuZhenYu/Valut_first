<svg baseProfile="full" height="600px" version="1.1" viewBox="0 0 1120 600" width="1120px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="600" width="1120" x="0" y="0" /><rect fill="#2c68a3" height="7" width="1120" x="0" y="0" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="37" font-weight="700" text-anchor="start" x="52" y="60">多个同类对象可以共享同一虚函数表</text><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" x="52" y="103">按对象内实际存在的基类子对象绘制结构</text><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.6" x1="52" x2="1068" y1="118" y2="118" /><rect fill="#e4f5f1" height="114" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="250" x="58" y="160" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="183.0" y="198.0">bird1</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" x="183.0" y="237.0">vptr → T</text><rect fill="#e4f5f1" height="114" rx="14" ry="14" stroke="#138d86" stroke-width="2.2" width="250" x="58" y="335" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="183.0" y="373.0">bird2</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" x="183.0" y="412.0">vptr → T</text><rect fill="#fbf1de" height="150" rx="14" ry="14" stroke="#b7852d" stroke-width="2.2" width="345" x="723" y="235" /><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle" x="895.5" y="291.0">CBird vtable</text><text fill="#18324b" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="25" font-weight="400" text-anchor="middle" x="895.5" y="330.0">Who → CBird::Who</text><line stroke="#138d86" stroke-linecap="round" stroke-width="4" x1="310" x2="711" y1="221" y2="292" /><polygon fill="#138d86" points="711,292 698.560660909362,295.77661792985793 700.6135883636484,284.1819149838172" /><line stroke="#138d86" stroke-linecap="round" stroke-width="4" x1="310" x2="711" y1="390" y2="338" /><polygon fill="#138d86" points="711,338 700.2629809127964,345.32914873099355 698.7487212910493,333.65187741713623" /><line stroke="#bfced9" stroke-linecap="round" stroke-width="1.5" x1="52" x2="1068" y1="530" y2="530" /><text fill="#5a6976" font-family="Noto Sans CJK SC, Noto Sans CJK, Arial, sans-serif" font-size="26" font-weight="400" text-anchor="start" x="55" y="572">图为常见实现；vptr 存放位置与 vtable 共享方式不属于标准布局保证</text></svg>