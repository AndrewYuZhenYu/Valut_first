<svg baseProfile="full" height="615px" version="1.1" viewBox="0 0 1320 615" width="1320px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow_blue" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#2475bb" /></marker><marker id="arrow_teal" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#168c88" /></marker><marker id="arrow_purple" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#7860bb" /></marker><marker id="arrow_muted" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#536783" /></marker><marker id="arrow_line" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#b7c9df" /></marker><marker id="arrow_red" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#bc5561" /></marker></defs><rect fill="#ffffff" height="615" width="1320" x="0" y="0" /><rect fill="#168c88" height="54" rx="2" width="7" x="30" y="29" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="44" font-weight="bold" text-anchor="start" x="55" y="76">前置与后置返回的对象身份不同</text><line stroke="#e1e7ef" stroke-width="2" x1="40" x2="1280" y1="106" y2="106" /><rect fill="#e3f6f1" height="320" rx="20" ry="20" stroke="#b7c9df" stroke-width="2" width="600" x="60" y="147" /><rect fill="#ffffff" height="50" rx="25" ry="25" stroke="none" stroke-width="2" width="540" x="88" y="161" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="358.0" y="196">前置 ++x</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="98" y="260">返回当前对象 T&amp;</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="98" y="321">结果与 x 是同一对象</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="98" y="382">修改的是 x</text><rect fill="#f0ebff" height="320" rx="20" ry="20" stroke="#b7c9df" stroke-width="2" width="600" x="705" y="147" /><rect fill="#ffffff" height="50" rx="25" ry="25" stroke="none" stroke-width="2" width="540" x="733" y="161" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="1003.0" y="196">后置 x++</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="743" y="260">返回旧值副本 T</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="743" y="321">结果不是更新后的 x</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="743" y="382">保留历史状态</text><text fill="#536783" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" text-anchor="middle" x="660" y="559">示意遵循典型自增语义；具体重载类必须自行实现</text></svg>