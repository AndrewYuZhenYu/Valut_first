<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="605px" version="1.1" viewBox="0 0 1320 605" width="1320px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow_blue" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#2475bb" /></marker><marker id="arrow_teal" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#168c88" /></marker><marker id="arrow_purple" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#7860bb" /></marker><marker id="arrow_muted" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#536783" /></marker><marker id="arrow_line" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#b7c9df" /></marker><marker id="arrow_red" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#bc5561" /></marker></defs><rect fill="#ffffff" height="605" width="1320" x="0" y="0" /><rect fill="#168c88" height="54" rx="2" width="7" x="30" y="29" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="44" font-weight="bold" text-anchor="start" x="55" y="76">运算符重载能做与不能做</text><line stroke="#e1e7ef" stroke-width="2" x1="40" x2="1280" y1="106" y2="106" /><rect fill="#edf6ff" height="50" rx="25" ry="25" stroke="none" stroke-width="2" width="350" x="80" y="145" /><text fill="#168c88" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" text-anchor="middle" x="255.0" y="180">可重载</text><line marker-end="url(#arrow_teal)" stroke="#168c88" stroke-linecap="round" stroke-width="4" x1="450" x2="570" y1="170" y2="170" /><rect fill="#e3f6f1" height="66" rx="12" ry="12" stroke="none" stroke-width="2" width="630" x="595" y="142" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" text-anchor="start" x="620" y="186">a + b → 调用用户定义的 +</text><rect fill="#ffeaed" height="50" rx="25" ry="25" stroke="none" stroke-width="2" width="350" x="80" y="234" /><text fill="#bc5561" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" text-anchor="middle" x="255.0" y="269">不可新造</text><line stroke="#bc5561" stroke-linecap="round" stroke-width="4" x1="450" x2="570" y1="259" y2="259" /><rect fill="#fff3dd" height="66" rx="12" ry="12" stroke="none" stroke-width="2" width="630" x="595" y="231" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" text-anchor="start" x="620" y="275">不能创造 ** 运算符</text><rect fill="#ffeaed" height="50" rx="25" ry="25" stroke="none" stroke-width="2" width="350" x="80" y="323" /><text fill="#bc5561" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" text-anchor="middle" x="255.0" y="358">不可改变元数</text><line stroke="#bc5561" stroke-linecap="round" stroke-width="4" x1="450" x2="570" y1="348" y2="348" /><rect fill="#fff3dd" height="66" rx="12" ry="12" stroke="none" stroke-width="2" width="630" x="595" y="320" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" text-anchor="start" x="620" y="364">二元 + 不能改成三元运算</text><rect fill="#ffeaed" height="50" rx="25" ry="25" stroke="none" stroke-width="2" width="350" x="80" y="412" /><text fill="#bc5561" font-family="Noto Sans CJK SC" font-size="27" font-weight="bold" text-anchor="middle" x="255.0" y="447">不可改变优先级</text><line stroke="#bc5561" stroke-linecap="round" stroke-width="4" x1="450" x2="570" y1="437" y2="437" /><rect fill="#fff3dd" height="66" rx="12" ry="12" stroke="none" stroke-width="2" width="630" x="595" y="409" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" text-anchor="start" x="620" y="453">a + b * c 仍先处理 *</text><text fill="#536783" font-family="Noto Sans CJK SC" font-size="28" font-weight="normal" text-anchor="middle" x="660" y="570">这里的“元数”指操作数个数</text></svg>