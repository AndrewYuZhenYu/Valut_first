<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="615px" version="1.1" viewBox="0 0 1320 615" width="1320px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow_blue" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#2475bb" /></marker><marker id="arrow_teal" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#168c88" /></marker><marker id="arrow_purple" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#7860bb" /></marker><marker id="arrow_muted" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#536783" /></marker><marker id="arrow_line" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#b7c9df" /></marker><marker id="arrow_red" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#bc5561" /></marker></defs><rect fill="#ffffff" height="615" width="1320" x="0" y="0" /><rect fill="#168c88" height="54" rx="2" width="7" x="30" y="29" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="44" font-weight="bold" text-anchor="start" x="55" y="76">为什么有些运算符返回值，有些返回引用</text><line stroke="#e1e7ef" stroke-width="2" x1="40" x2="1280" y1="106" y2="106" /><rect fill="#e3f6f1" height="320" rx="20" ry="20" stroke="#b7c9df" stroke-width="2" width="600" x="60" y="147" /><rect fill="#ffffff" height="50" rx="25" ry="25" stroke="none" stroke-width="2" width="540" x="88" y="161" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="358.0" y="196">生成新结果</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="98" y="260">a + b 得到独立新对象</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="98" y="321">return T</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="98" y="382">避免返回局部对象引用</text><rect fill="#edf6ff" height="320" rx="20" ry="20" stroke="#b7c9df" stroke-width="2" width="600" x="705" y="147" /><rect fill="#ffffff" height="50" rx="25" ry="25" stroke="none" stroke-width="2" width="540" x="733" y="161" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="29" font-weight="bold" text-anchor="middle" x="1003.0" y="196">修改当前对象</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="743" y="260">a = b 返回当前对象</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="743" y="321">return T&amp;</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="start" x="743" y="382">保留对象身份</text><text fill="#536783" font-family="Noto Sans CJK SC" font-size="29" font-weight="normal" text-anchor="middle" x="660" y="559">具体以语义和生命周期为准，不是凭运算符名称机械决定</text></svg>