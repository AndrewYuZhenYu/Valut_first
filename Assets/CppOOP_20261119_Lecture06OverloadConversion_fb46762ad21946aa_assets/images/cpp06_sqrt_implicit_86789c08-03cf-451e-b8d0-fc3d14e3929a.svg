<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="575px" version="1.1" viewBox="0 0 1320 575" width="1320px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow_blue" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#2475bb" /></marker><marker id="arrow_teal" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#168c88" /></marker><marker id="arrow_purple" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#7860bb" /></marker><marker id="arrow_muted" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#536783" /></marker><marker id="arrow_line" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#b7c9df" /></marker><marker id="arrow_red" markerHeight="24" markerUnits="userSpaceOnUse" markerWidth="26" orient="auto" refX="23" refY="12"><path d="M1,1 L24,12 L1,23 z" fill="#bc5561" /></marker></defs><rect fill="#ffffff" height="575" width="1320" x="0" y="0" /><rect fill="#168c88" height="54" rx="2" width="7" x="30" y="29" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="44" font-weight="bold" text-anchor="start" x="55" y="76">调用 sqrt(z) 实际发生的数学变化</text><line stroke="#e1e7ef" stroke-width="2" x1="40" x2="1280" y1="106" y2="106" /><rect fill="#edf6ff" height="185" rx="20" ry="20" stroke="#b7c9df" stroke-width="2" width="310" x="55.0" y="205" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="middle" x="210.0" y="265">z = 3 + 4i</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="middle" x="210.0" y="313">CComplex</text><line marker-end="url(#arrow_blue)" stroke="#2475bb" stroke-linecap="round" stroke-width="4" x1="368.0" x2="485.0" y1="296" y2="296" /><rect fill="#e3f6f1" height="185" rx="20" ry="20" stroke="#b7c9df" stroke-width="2" width="310" x="495.0" y="205" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="middle" x="650.0" y="265">operator double()</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="middle" x="650.0" y="313">模长为 5</text><line marker-end="url(#arrow_blue)" stroke="#2475bb" stroke-linecap="round" stroke-width="4" x1="808.0" x2="925.0" y1="296" y2="296" /><rect fill="#f0ebff" height="185" rx="20" ry="20" stroke="#b7c9df" stroke-width="2" width="310" x="935.0" y="205" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="middle" x="1090.0" y="265">sqrt(5.0)</text><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="31" font-weight="normal" text-anchor="middle" x="1090.0" y="313">得到 √5</text><rect fill="#fff3dd" height="73" rx="19" ry="19" stroke="none" stroke-width="2" width="1110" x="105" y="460" /><text fill="#1c2c46" font-family="Noto Sans CJK SC" font-size="30" font-weight="normal" text-anchor="middle" x="660" y="511">这不是复数 3+4i 的复平方根；要区分运算含义</text></svg>