<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#f9fbff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><text x="42" y="48" fill="#14283b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="31" font-weight="700">循环队列判空与判满 · 满</text><line x1="42" y1="65" x2="1158" y2="65" stroke="#c5d3df" stroke-width="2" stroke-linecap="round"/><text x="44" y="580" fill="#64758b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400">队满：rear 的下一个位置恰好等于 front</text><rect x="75" y="285" width="65" height="63" rx="0" fill="#d9f5ec" stroke="#c5d3df" stroke-width="1.5"/><text x="107.5" y="373" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">0</text><rect x="140" y="285" width="65" height="63" rx="0" fill="#d9f5ec" stroke="#c5d3df" stroke-width="1.5"/><text x="172.5" y="373" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">1</text><rect x="205" y="285" width="65" height="63" rx="0" fill="#d9f5ec" stroke="#c5d3df" stroke-width="1.5"/><text x="237.5" y="373" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">2</text><rect x="270" y="285" width="65" height="63" rx="0" fill="#d9f5ec" stroke="#c5d3df" stroke-width="1.5"/><text x="302.5" y="373" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">3</text><rect x="335" y="285" width="65" height="63" rx="0" fill="#d9f5ec" stroke="#c5d3df" stroke-width="1.5"/><text x="367.5" y="373" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="4