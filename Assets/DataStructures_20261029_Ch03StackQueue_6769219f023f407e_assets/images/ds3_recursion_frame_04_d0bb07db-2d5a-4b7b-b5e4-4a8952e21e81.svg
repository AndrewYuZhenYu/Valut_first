<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#f9fbff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><text x="42" y="48" fill="#14283b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="31" font-weight="700">递归调用栈 · factorial(4) 第 4/5 层</text><line x1="42" y1="65" x2="1158" y2="65" stroke="#c5d3df" stroke-width="2" stroke-linecap="round"/><text x="44" y="580" fill="#64758b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400">每一层都保存自己的参数、局部变量和返回位置；最后一层最先返回。</text><rect x="295" y="410" width="550" height="63" rx="8" fill="#e9f2fc" stroke="#2b65a2" stroke-width="2"/><text x="570" y="450" fill="#14283b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="700">factorial(4)</text><rect x="295" y="334" width="550" height="63" rx="8" fill="#fff1db" stroke="#2b65a2" stroke-width="2"/><text x="570" y="374" fill="#14283b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="700">factorial(3)</text><text x="885" y="180" fill="#b4454f" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="27" font-weight="400">当前 n = 1</text></svg>