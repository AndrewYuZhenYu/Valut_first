<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#f9fbff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><text x="42" y="48" fill="#14283b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="31" font-weight="700">栈与队列：相同入序，不同出序</text><line x1="42" y1="65" x2="1158" y2="65" stroke="#c5d3df" stroke-width="2" stroke-linecap="round"/><text x="44" y="580" fill="#64758b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400">示例入序 A → B → C → D，区别仅在允许删除的端点。</text><text x="115" y="190" fill="#64758b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="400">入序</text><text x="225" y="190" fill="#2b65a2" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="35" font-weight="700">A  →  B  →  C  →  D</text><text x="115" y="300" fill="#64758b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="400">栈出序</text><text x="325" y="300" fill="#b4454f" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="34" font-weight="700">D  →  C  →  B  →  A</text><text x="115" y="420" fill="#64758b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="25" font-weight="400">队出序</text><text x="325" y="420" fill="#128071" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="34" font-weight="700">A  →  B  →  C  →  D</text></svg>