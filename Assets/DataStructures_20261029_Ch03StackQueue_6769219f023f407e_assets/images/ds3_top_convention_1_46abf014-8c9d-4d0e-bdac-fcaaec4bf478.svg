<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#f9fbff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="context-stroke"/></marker></defs><text x="42" y="48" fill="#14283b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="31" font-weight="700">顺序栈 top 指针的两套约定 · top 指向下一个空位</text><line x1="42" y1="65" x2="1158" y2="65" stroke="#c5d3df" stroke-width="2" stroke-linecap="round"/><text x="44" y="580" fill="#64758b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="19" font-weight="400">空栈 top=base；当前 top 对应空槽 2</text><rect x="170" y="252" width="65" height="63" rx="0" fill="#d9f5ec" stroke="#c5d3df" stroke-width="1.5"/><text x="202.5" y="293" fill="#14283b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="27" font-weight="700">A</text><text x="202.5" y="340" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">0</text><rect x="235" y="252" width="65" height="63" rx="0" fill="#d9f5ec" stroke="#c5d3df" stroke-width="1.5"/><text x="267.5" y="293" fill="#14283b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="27" font-weight="700">B</text><text x="267.5" y="340" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">1</text><rect x="300" y="252" width="65" height="63" rx="0" fill="#fff" stroke="#c5d3df" stroke-width="1.5"/><text x="332.5" y="340" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">2</text><rect x="365" y="252" width="65" height="63" rx="0" fill="#fff" stroke="#c5d3df" stroke-width="1.5"/><text x="397.5" y="340" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">3</text><rect x="430" y="252" width="65" height="63" rx="0" fill="#fff" stroke="#c5d3df" stroke-width="1.5"/><text x="462.5" y="340" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">4</text><rect x="495" y="252" width="65" height="63" rx="0" fill="#fff" stroke="#c5d3df" stroke-width="1.5"/><text x="527.5" y="340" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">5</text><rect x="560" y="252" width="65" height="63" rx="0" fill="#fff" stroke="#c5d3df" stroke-width="1.5"/><text x="592.5" y="340" fill="#64758b" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400">6</text><line x1="332.5" y1="174" x2="332.5" y2="244" stroke="#b4454f" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="332.5" y="161" fill="#b4454f" text-anchor="middle" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="700">top=2</text><text x="830" y="265" fill="#14283b" text-anchor="start" font-family="Noto Sans CJK SC,Arial,sans-serif" font-size="24" font-weight="700">Push/Pop 的计算</text><text x="830" y="318" fill="#14283b" text-anchor="start" font-family="DejaVu Sans Mono, Noto Sans Mono CJK SC,monospace" font-size="22" font-weight="400">Push:  data[top++] = x</text><text x="830" y="373" fill="#14283b" text-anchor="start" font-family="DejaVu Sans Mono, Noto Sans Mono CJK SC,monospace" font-size="22" font-weight="400">Pop:   x = data[--top]</text></svg>