<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="560" viewBox="0 0 1140 560" role="img" aria-label="四字符结点的块链串"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="560.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">四字符结点的块链串</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">每块 4 字符；最后一块空余位置用占位符表示</text><text x="48.0" y="151.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">结点块容量 = 4 字符</text><rect x="47.0" y="215.0" width="220.0" height="85.0" rx="12.0" fill="#E8F5F3" stroke="#0B8A83" stroke-width="2"/><text x="67.0" y="252.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">A</text><text x="110.8" y="252.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">B</text><text x="154.5" y="252.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">C</text><text x="198.2" y="252.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">D</text><line x1="227.0" y1="271.0" x2="257.0" y2="271.0" stroke="#2363B3" stroke-width="2" stroke-linecap="round"/><line x1="267.0" y1="255.0" x2="304.0" y2="255.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="307.0" y="215.0" width="220.0" height="85.0" rx="12.0" fill="#E8F5F3" stroke="#0B8A83" stroke-width="2"/><text x="327.0" y="252.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">E</text><text x="370.8" y="252.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">F</text><text x="414.5" y="252.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">G</text><text x="458.2" y="252.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">H</text><line x1="487.0" y1="271.0" x2="517.0" y2="271.0" stroke="#2363B3" stroke-width="2" stroke-linecap="round"/><line x1="527.0" y1="255.0" x2="564.0" y2="255.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="567.0" y="215.0" width="220.0" height="85.0" rx="12.0" fill="#E8F5F3" stroke="#0B8A83" stroke-width="2"/><text x="587.0" y="252.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">I</text><text x="630.8" y="252.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="500" dominant-baseline="middle">#</text><text x="674.5" y="252.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="500" dominant-baseline="middle">#</text><text x="718.2" y="252.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="500" dominant-baseline="middle">#</text><line x1="747.0" y1="271.0" x2="777.0" y2="271.0" stroke="#2363B3" stroke-width="2" stroke-linecap="round"/><text x="54.0" y="370.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" dominant-baseline="middle">head → 第一个块；tail → 最后一个块；curlen 保存真实字符数</text><rect x="36.0" y="496.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="515.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">最后一块只有 I 是有效字符；# 为占位，不是逻辑串的内容</text></svg>