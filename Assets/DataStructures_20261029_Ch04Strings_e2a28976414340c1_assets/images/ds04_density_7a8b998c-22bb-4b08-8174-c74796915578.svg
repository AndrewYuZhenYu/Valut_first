<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="600" viewBox="0 0 1140 600" role="img" aria-label="块链串的存储密度"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="600.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">块链串的存储密度</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">不能只看字符区，还应计算结点指针与未用空间</text><rect x="36.0" y="114.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="56.0" y="144.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">块大小 1</text><text x="53.0" y="180.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">字符区利用率高</text><text x="53.0" y="208.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">指针开销相对非常大</text><rect x="577.0" y="114.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="597.0" y="144.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">块大小 4</text><text x="594.0" y="180.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">9 字符需 3 块</text><text x="594.0" y="208.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">最后块空闲 3 字符</text><rect x="36.0" y="258.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="56.0" y="288.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">块大小大</text><text x="53.0" y="324.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">链表结点数可能降低</text><text x="53.0" y="352.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">修改小片段可能有空位浪费</text><rect x="577.0" y="258.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="597.0" y="288.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">衡量方式</text><text x="594.0" y="324.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">有效字符占用字节</text><text x="594.0" y="352.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">÷ 总实际分配字节</text></svg>