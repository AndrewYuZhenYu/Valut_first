<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="590" viewBox="0 0 1140 590" role="img" aria-label="利用最小操作子集实现 Index"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="590.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">利用最小操作子集实现 Index</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">无须直接读底层数组，也能实现模式定位</text><rect x="40.0" y="161.0" width="256.8" height="259.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="60.0" y="191.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">1  求长度</text><text x="54.0" y="243.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">n = StrLength(S)</text><text x="54.0" y="281.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">m = StrLength(T)</text><line x1="298.8" y1="295.0" x2="304.8" y2="295.0" stroke="#0B8A83" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="307.8" y="161.0" width="256.8" height="259.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="327.8" y="191.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">2  枚举起点</text><text x="321.8" y="243.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">i 从 pos 开始</text><text x="321.8" y="281.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">截止 n−m+1</text><line x1="566.5" y1="295.0" x2="572.5" y2="295.0" stroke="#0B8A83" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="575.5" y="161.0" width="256.8" height="259.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="595.5" y="191.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">3  取等长子串</text><text x="589.5" y="243.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">SubString(S,i,m)</text><text x="589.5" y="281.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">StrCompare(sub,T)</text><line x1="834.2" y1="295.0" x2="840.2" y2="295.0" stroke="#0B8A83" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="843.2" y="161.0" width="256.8" height="259.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="863.2" y="191.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">4  报告答案</text><text x="857.2" y="243.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">相同 → 返回 i</text><text x="857.2" y="281.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">遍历完 → 返回 0</text></svg>