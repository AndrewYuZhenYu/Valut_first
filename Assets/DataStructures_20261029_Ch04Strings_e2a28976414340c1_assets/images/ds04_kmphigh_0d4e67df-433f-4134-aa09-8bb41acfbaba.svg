<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="600" viewBox="0 0 1140 600" role="img" aria-label="KMP 的核心不变量"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="600.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">KMP 的核心不变量</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">失配后主串 i 不回退：已匹配内容可复用</text><rect x="36.0" y="114.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="56.0" y="144.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">已匹配信息</text><text x="53.0" y="180.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">S[i−j+1..i−1]</text><text x="53.0" y="208.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">=</text><text x="53.0" y="236.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">T[1..j−1]</text><rect x="577.0" y="114.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="597.0" y="144.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">寻找重用</text><text x="594.0" y="180.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">模式已匹配段的</text><text x="594.0" y="208.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">最长相等真前后缀</text><rect x="36.0" y="258.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="56.0" y="288.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">回退规则</text><text x="53.0" y="324.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">主串 i 不改变</text><text x="53.0" y="352.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">模式 j ← next[j]</text><rect x="577.0" y="258.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="597.0" y="288.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">复杂度</text><text x="594.0" y="324.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">预处理 O(m)</text><text x="594.0" y="352.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">匹配 O(n)，合计 O(n+m)</text></svg>