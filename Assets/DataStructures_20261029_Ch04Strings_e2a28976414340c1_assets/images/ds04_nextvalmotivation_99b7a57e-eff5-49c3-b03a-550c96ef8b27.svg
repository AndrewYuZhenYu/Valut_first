<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="600" viewBox="0 0 1140 600" role="img" aria-label="为什么需要 nextval"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="600.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">为什么需要 nextval</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">若回退位置字符与失配位置字符相同，立即再次失配</text><rect x="36.0" y="114.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="56.0" y="144.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">普通 next</text><text x="53.0" y="180.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">T = aaaab</text><text x="53.0" y="208.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">next = 0,1,2,3,4</text><rect x="577.0" y="114.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="597.0" y="144.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">重复失败</text><text x="594.0" y="180.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">失配位字符都是 a</text><text x="594.0" y="208.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">j:4→3→2→1→0</text><rect x="36.0" y="258.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="56.0" y="288.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">nextval</text><text x="53.0" y="324.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">nextval = 0,0,0,0,4</text><text x="53.0" y="352.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">重复 a 的比较直接省略</text><rect x="577.0" y="258.0" width="520.0" height="133.0" rx="14.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="597.0" y="288.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">本质</text><text x="594.0" y="324.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">只是优化失败跳转</text><text x="594.0" y="352.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">不更改成功匹配判定</text></svg>