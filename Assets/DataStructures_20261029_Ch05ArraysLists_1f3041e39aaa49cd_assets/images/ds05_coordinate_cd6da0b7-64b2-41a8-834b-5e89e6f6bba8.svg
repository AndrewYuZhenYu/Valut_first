idth="1"/><text x="380.0" y="370.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">a23</text><rect x="600.0" y="178.0" width="470.0" height="260.0" rx="15.0" fill="#F6F9FC" stroke="#CBD8E1" stroke-width="1.4"/><text x="618.0" y="207.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">两个不同的方向</text><text x="632.0" y="258.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">i → 向下确定行</text><text x="632.0" y="316.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">j → 向右确定列</text><text x="632.0" y="382.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">A[1][2] ← 行 1 / 列 2</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">数组默认采用从 0 开始的示例下标；下标不是元素在物理内存中的地址。</text></svg>