<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="十字链表：同一结点参与行链和列链"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">十字链表：同一结点参与行链和列链</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">蓝色横向边表示 right；绿色纵向边表示 down</text><rect x="36.0" y="120.0" width="1060.0" height="445.0" rx="15.0" fill="#F6F9FC" stroke="#CBD8E1" stroke-width="1.4"/><text x="54.0" y="149.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">三元组结点在矩阵坐标位置排列</text><rect x="186.0" y="172.0" width="100.0" height="46.0" rx="6.0" fill="#EAF5F2" stroke="#0B8A83" stroke-width="1.5"/><text x="236.0" y="195.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" dominant-baseline="middle">3</text><rect x="786.0" y="172.0" width="100.0" height="46.0" rx="6.0" fill="#EAF5F2" stroke="#0B8A83" stroke-width="1.5"/><text x="836.0" y="195.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" dominant-baseline="middle">7</text><rect x="486.0" y="246.0" width="100.0" height="46.0" rx="6.0" fill="#EAF5F2" stroke="#0B8A83" stroke-width="1.5"/><text x="536.0" y="269.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" dominant-baseline="middle">-1</text><rect x="186.0" y="320.0" width="100.0" height="46.0" rx="6.0" fill="#EAF5F2" stroke="#0B8A83" stroke-width="1.5"/><text x="236.0" y="343.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" dominant-baseline="middle">-1</text><rect x="336.0" y="320.0" width="100.0" height="46.0" rx="6.0" fill="#EAF5F2" stroke="#0B8A83" stroke-width="1.5"/><text x="386.0" y="343.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" dominant-baseline="middle">-2</text><rect x="636.0" y="394.0" width="100.0" height="46.0" rx="6.0" fill="#EAF5F2" stroke="#0B8A83" stroke-width="1.5"/><text x="686.0" y="417.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" dominant-baseline="middle">2</text><line x1="286.0" y1="195.0" x2="783.0" y2="195.0" stroke="#2363B3" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="286.0" y1="343.0" x2="333.0" y2="343.0" stroke="#2363B3" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><line x1="236.0" y1="219.0" x2="236.0" y2="319.0" stroke="#0B8A83" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/><text x="90.0" y="541.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">每一行/列只串联真正存在的非零元，缺失位置没有结点。</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">此图采用重新设计的双向归属示意，体现十字链表与普通单链表的根本区别。</text></svg>