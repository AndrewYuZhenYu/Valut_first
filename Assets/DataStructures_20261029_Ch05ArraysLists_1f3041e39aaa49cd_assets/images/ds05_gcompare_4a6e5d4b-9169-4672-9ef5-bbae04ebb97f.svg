<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="头尾分析法与子表分析法一图速查"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">头尾分析法与子表分析法一图速查</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">相同广义表可以有两种不同的链式编码</text><rect x="36.0" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="54.0" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">头尾分析法</text><text x="54.0" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">tp 指整个表尾</text><text x="54.0" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">hp 指一个表头元素</text><text x="54.0" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">直接适配 Head/Tail 递归</text><rect x="397.3" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="415.3" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">子表分析法</text><text x="415.3" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">tp 指当前层下一个元素</text><text x="415.3" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">hp 只负责内部子表链接</text><text x="415.3" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">结点通常更少</text><rect x="758.7" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="776.7" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">易错提醒</text><text x="776.7" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">不要把 tp 含义混用</text><text x="776.7" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">子表与兄弟元素不是同一关系</text><text x="776.7" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">图中必须区分 tag=0/1</text></svg>