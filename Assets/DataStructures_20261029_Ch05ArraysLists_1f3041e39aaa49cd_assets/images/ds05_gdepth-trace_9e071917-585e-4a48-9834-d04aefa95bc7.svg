<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="递归深度：从子表向外回传结果"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">递归深度：从子表向外回传结果</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">L=(a,(b,(c)))，递归返回自内向外：1 → 2 → 3</text><line x1="883.3" y1="391.5" x2="883.3" y2="466.8" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="726.7" y1="279.9" x2="570.0" y2="355.1" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="726.7" y1="279.9" x2="883.3" y2="355.1" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="491.7" y1="168.2" x2="256.7" y2="243.5" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="491.7" y1="168.2" x2="726.7" y2="243.5" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><circle cx="256.7" cy="261.7" r="26.0" fill="#FFF2E7" stroke="#D67A2C" stroke-width="3"/><text x="256.7" y="262.7" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">a</text><circle cx="570.0" cy="373.3" r="26.0" fill="#FFF2E7" stroke="#D67A2C" stroke-width="3"/><text x="570.0" y="374.3" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">b</text><circle cx="883.3" cy="485.0" r="26.0" fill="#FFF2E7" stroke="#D67A2C" stroke-width="3"/><text x="883.3" y="486.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">c</text><circle cx="883.3" cy="373.3" r="26.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="883.3" y="374.3" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" dominant-baseline="middle">list</text><circle cx="726.7" cy="261.7" r="26.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="726.7" y="262.7" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" dominant-baseline="middle">list</text><circle cx="491.7" cy="150.0" r="26.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="491.7" y="151.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700" dominant-baseline="middle">list</text><text x="94.0" y="535.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">最深子表 (c) 深度 1；(b,(c)) 深度 2；整个 L 深度 3。</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">注意外层深度是“子元素最大深度再加 1”，不是所有元素深度相加。</text></svg>