<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="头尾分析法的结点数为什么较多"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">头尾分析法的结点数为什么较多</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">L=(a,b,c)，每个非空表尾都对应一个表结点</text><rect x="46.0" y="132.0" width="1040.0" height="392.0" rx="15.0" fill="#F6F9FC" stroke="#CBD8E1" stroke-width="1.4"/><text x="64.0" y="161.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">当前层：L → Tail(L) → Tail(Tail(L))</text><rect x="100.0" y="230.0" width="222.0" height="80.0" rx="11.0" fill="#EAF3FC" stroke="#2363B3" stroke-width="2"/><text x="210.0" y="270.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">table 1</text><rect x="130.0" y="405.0" width="160.0" height="50.0" rx="10.0" fill="#FCEBDD" stroke="#D67A2C" stroke-width="1.8"/><text x="210.0" y="430.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">a</text><line x1="210.0" y1="310.0" x2="210.0" y2="402.0" stroke="#7249C7" stroke-width="2" stroke-linecap="round" marker-end="url(#arrp)"/><rect x="410.0" y="230.0" width="222.0" height="80.0" rx="11.0" fill="#EAF3FC" stroke="#2363B3" stroke-width="2"/><text x="520.0" y="270.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">table 2</text><rect x="440.0" y="405.0" width="160.0" height="50.0" rx="10.0" fill="#FCEBDD" stroke="#D67A2C" stroke-width="1.8"/><text x="520.0" y="430.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">b</text><line x1="520.0" y1="310.0" x2="520.0" y2="402.0" stroke="#7249C7" stroke-width="2" stroke-linecap="round" marker-end="url(#arrp)"/><rect x="720.0" y="230.0" width="222.0" height="80.0" rx="11.0" fill="#EAF3FC" stroke="#2363B3" stroke-width="2"/><text x="830.0" y="270.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">table 3</text><rect x="750.0" y="405.0" width="160.0" height="50.0" rx="10.0" fill="#FCEBDD" stroke="#D67A2C" stroke-width="1.8"/><text x="830.0" y="430.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">c</text><line x1="830.0" y1="310.0" x2="830.0" y2="402.0" stroke="#7249C7" stroke-width="2" stroke-linecap="round" marker-end="url(#arrp)"/><line x1="320.0" y1="270.0" x2="410.0" y2="270.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="632.0" y1="270.0" x2="723.0" y2="270.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">这种结构便于直接求 Head/Tail；但同一层 n 个元素通常需要 n 个表结点。</text></svg>