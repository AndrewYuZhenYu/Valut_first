<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="表头—表尾分析法的指针方向"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">表头—表尾分析法的指针方向</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">以 L=(a,(b,c)) 为例，表尾链向右，表头指向下方</text><rect x="35.0" y="125.0" width="1060.0" height="432.0" rx="15.0" fill="#F6F9FC" stroke="#CBD8E1" stroke-width="1.4"/><text x="53.0" y="154.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">蓝色为表结点，橙色为原子结点</text><rect x="145.0" y="210.0" width="220.0" height="63.0" rx="10.0" fill="#EAF3FC" stroke="#2363B3" stroke-width="2"/><text x="255.0" y="241.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">tag=1 | hp,tp</text><rect x="585.0" y="210.0" width="220.0" height="63.0" rx="10.0" fill="#EAF3FC" stroke="#2363B3" stroke-width="2"/><text x="695.0" y="241.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">tag=1 | hp,tp</text><line x1="365.0" y1="240.0" x2="585.0" y2="240.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="493.0" y="215.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">tp</text><rect x="175.0" y="365.0" width="190.0" height="60.0" rx="9.0" fill="#FCEBDD" stroke="#D67A2C" stroke-width="2"/><text x="270.0" y="396.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" dominant-baseline="middle">atom: a</text><line x1="256.0" y1="275.0" x2="256.0" y2="363.0" stroke="#7249C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrp)"/><text x="211.0" y="320.0" text-anchor="start" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">hp</text><rect x="625.0" y="363.0" width="225.0" height="60.0" rx="9.0" fill="#EEF3F9" stroke="#2363B3" stroke-width="2"/><text x="735.0" y="394.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" dominant-baseline="middle">子表 (b,c)</text><line x1="692.0" y1="273.0" x2="692.0" y2="359.0" stroke="#7249C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrp)"/><text x="746.0" y="323.0" text-anchor="start" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">hp</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">第二个表结点的 tp 为空；表头为子表时 hp 指向该子表的首个表结点。</text></svg>