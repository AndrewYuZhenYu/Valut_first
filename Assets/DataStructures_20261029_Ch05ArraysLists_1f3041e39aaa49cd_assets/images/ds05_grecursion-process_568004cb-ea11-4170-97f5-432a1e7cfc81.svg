<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="广义表递归算法的三个必要分支"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">广义表递归算法的三个必要分支</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">以求深度为例，每一层只向子表继续递归</text><rect x="36.0" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="54.0" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">原子</text><text x="54.0" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">depth(atom)=0</text><text x="54.0" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">原子不再展开</text><text x="54.0" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">终止递归</text><rect x="397.3" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="415.3" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">空表</text><text x="415.3" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">depth(())=1</text><text x="415.3" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">不再遍历下一元素</text><text x="415.3" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">基础情形</text><rect x="758.7" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="776.7" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">非空列表</text><text x="776.7" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">depth(L)=1+max(depth(eᵢ))</text><text x="776.7" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">检查每个元素的深度</text><text x="776.7" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">共享/环另行处理</text></svg>