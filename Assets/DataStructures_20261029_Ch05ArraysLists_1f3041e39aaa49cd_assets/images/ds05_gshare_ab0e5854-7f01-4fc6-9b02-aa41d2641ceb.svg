<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="共享子表：两个列表引用同一个对象"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">共享子表：两个列表引用同一个对象</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">U=(a,b)，L=(U,U) 可以让两个位置都指向同一个 U</text><rect x="42.0" y="130.0" width="1050.0" height="400.0" rx="15.0" fill="#F6F9FC" stroke="#CBD8E1" stroke-width="1.4"/><text x="60.0" y="159.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">有向无环共享：两条引用箭头指向同一个子表</text><rect x="450.0" y="182.0" width="200.0" height="70.0" rx="12.0" fill="#EAF3FC" stroke="#2363B3" stroke-width="2"/><text x="550.0" y="217.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="500" dominant-baseline="middle">L=(U,U)</text><rect x="450.0" y="398.0" width="200.0" height="70.0" rx="12.0" fill="#EAF5F2" stroke="#0B8A83" stroke-width="2"/><text x="550.0" y="431.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="500" dominant-baseline="middle">U=(a,b)</text><path d="M490,254 Q280,310 498,395" fill="none" stroke="#7249C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrp)"/><path d="M610,254 Q810,310 600,395" fill="none" stroke="#2363B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="220.0" y="322.0" text-anchor="start" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">第 1 个元素</text><text x="785.0" y="322.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">第 2 个元素</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">共享并不必然形成递归；同一对象被多个引用复用仍可能是有向无环图。</text></svg>