<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="子表分析法的结点为什么更少"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">子表分析法的结点为什么更少</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">L=(a,b,c) 只需要 3 个原子结点（加一个表入口约定）</text><rect x="45.0" y="138.0" width="1040.0" height="366.0" rx="15.0" fill="#F6F9FC" stroke="#CBD8E1" stroke-width="1.4"/><text x="63.0" y="167.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">同级三个原子通过 tp 串联</text><rect x="95.0" y="236.0" width="245.0" height="92.0" rx="11.0" fill="#FCEBDD" stroke="#D67A2C" stroke-width="2"/><text x="217.0" y="282.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" dominant-baseline="middle">atom: a | tp</text><rect x="405.0" y="236.0" width="245.0" height="92.0" rx="11.0" fill="#FCEBDD" stroke="#D67A2C" stroke-width="2"/><text x="527.0" y="282.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" dominant-baseline="middle">atom: b | tp</text><rect x="715.0" y="236.0" width="245.0" height="92.0" rx="11.0" fill="#FCEBDD" stroke="#D67A2C" stroke-width="2"/><text x="837.0" y="282.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" dominant-baseline="middle">atom: c | tp</text><line x1="344.0" y1="280.0" x2="404.0" y2="280.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="654.0" y1="280.0" x2="714.0" y2="280.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="965.0" y="282.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="500" dominant-baseline="middle">NIL</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">主要取舍：子表分析法减少列表结点，但对头尾递归操作不如头尾结构直观。</text></svg>