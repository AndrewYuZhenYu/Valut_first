<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="子表分析法：同级结点用 tp 链接"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">子表分析法：同级结点用 tp 链接</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">以 L=(a,(b,c),d) 为例，原子结点也携带后继指针</text><rect x="38.0" y="129.0" width="1055.0" height="407.0" rx="15.0" fill="#F6F9FC" stroke="#CBD8E1" stroke-width="1.4"/><text x="56.0" y="158.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">顶层元素序列：a → (b,c) → d</text><rect x="110.0" y="220.0" width="220.0" height="69.0" rx="9.0" fill="#FCEBDD" stroke="#D67A2C" stroke-width="2"/><text x="220.0" y="255.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">atom a</text><rect x="430.0" y="220.0" width="220.0" height="69.0" rx="9.0" fill="#EAF3FC" stroke="#2363B3" stroke-width="2"/><text x="540.0" y="255.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">list (b,c)</text><rect x="750.0" y="220.0" width="220.0" height="69.0" rx="9.0" fill="#FCEBDD" stroke="#D67A2C" stroke-width="2"/><text x="860.0" y="255.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">atom d</text><line x1="330.0" y1="255.0" x2="430.0" y2="255.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="650.0" y1="255.0" x2="750.0" y2="255.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><text x="386.0" y="223.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">tp</text><text x="704.0" y="223.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">tp</text><rect x="431.0" y="402.0" width="230.0" height="63.0" rx="9.0" fill="#EAF5F2" stroke="#0B8A83" stroke-width="2"/><text x="547.0" y="434.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">内部 b → c</text><line x1="536.0" y1="291.0" x2="536.0" y2="400.0" stroke="#7249C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrp)"/><text x="550.0" y="353.0" text-anchor="start" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">hp</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">子表分析法的原子结点也需 tp 域，因为原子同样可能拥有下一个兄弟元素。</text></svg>