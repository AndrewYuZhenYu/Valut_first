<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="为什么表尾必须是一个表？"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">为什么表尾必须是一个表？</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">L=(a,(b,c),d) 被切分成“第一个元素”和“剩余元素序列”</text><rect x="48.0" y="145.0" width="1040.0" height="338.0" rx="15.0" fill="#F6F9FC" stroke="#CBD8E1" stroke-width="1.4"/><text x="66.0" y="174.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">Head 是一个元素，Tail 是一个列表</text><rect x="95.0" y="249.0" width="345.0" height="115.0" rx="12.0" fill="#FBEADF" stroke="#D67A2C" stroke-width="2"/><text x="267.0" y="282.0" text-anchor="middle" fill="#D67A2C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">Head(L)</text><text x="267.0" y="338.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="500" dominant-baseline="middle">a</text><rect x="520.0" y="249.0" width="485.0" height="115.0" rx="12.0" fill="#EAF3FC" stroke="#2363B3" stroke-width="2"/><text x="762.0" y="282.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">Tail(L)</text><text x="762.0" y="338.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="500" dominant-baseline="middle">((b,c),d)</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">即使只剩一个元素，尾部也是 (d)，而不是原子 d；只剩零个元素时尾是 ()。</text></svg>