<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="下标起点不是 0 时如何调整"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">下标起点不是 0 时如何调整</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">把真实下标先变成从 0 开始的相对下标</text><rect x="36.0" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="54.0" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">先确定上下界</text><text x="54.0" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">行：l₁ 到 u₁</text><text x="54.0" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">列：l₂ 到 u₂</text><text x="54.0" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">列长度 n = u₂-l₂+1</text><rect x="397.3" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="415.3" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">相对下标</text><text x="415.3" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">行偏移：i-l₁</text><text x="415.3" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">列偏移：j-l₂</text><text x="415.3" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">用相对下标进入映射</text><rect x="758.7" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="776.7" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">行优先地址</text><text x="776.7" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">LOC(i,j)=base +</text><text x="776.7" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">[(i-l₁)n+(j-l₂)]L</text><text x="776.7" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">注意 base 对应 A[l₁][l₂]</text></svg>