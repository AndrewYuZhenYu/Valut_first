<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="多维数组寻址的递推思想"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">多维数组寻址的递推思想</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">从最后一维向前建立“步长”</text><rect x="36.0" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="54.0" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">最后一维</text><text x="54.0" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">cₙ = L</text><text x="54.0" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">最后一维下标 +1</text><text x="54.0" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">地址偏移增加 L</text><rect x="397.3" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="415.3" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">逐维向前</text><text x="415.3" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">cᵢ = bᵢ₊₁ × cᵢ₊₁</text><text x="415.3" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">用后一维步长与长度</text><text x="415.3" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">计算当前维步长</text><rect x="758.7" y="115.0" width="345.3" height="440.0" rx="17.0" fill="#F7FAFC" stroke="#CBD8E1" stroke-width="1"/><text x="776.7" y="148.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">最终求和</text><text x="776.7" y="200.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">LOC = base + Σ jᵢcᵢ</text><text x="776.7" y="240.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">每维下标与步长相乘</text><text x="776.7" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">再统一累加</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">对任意正维界、有效下标，映射是一一对应的。</text></svg>