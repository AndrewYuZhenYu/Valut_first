<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="行逻辑链接顺序表：为每行添加 rpos"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">行逻辑链接顺序表：为每行添加 rpos</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">行内容仍在一个连续三元组数组里，rpos 直接定位行首</text><rect x="85.0" y="175.0" width="172.0" height="40.0" rx="4.0" fill="#DDEBF9" stroke="#CBD8E1" stroke-width="1"/><text x="171.0" y="195.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" dominant-baseline="middle">行 r</text><rect x="260.0" y="175.0" width="235.0" height="40.0" rx="4.0" fill="#DDEBF9" stroke="#CBD8E1" stroke-width="1"/><text x="377.5" y="195.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" dominant-baseline="middle">行中元素数</text><rect x="498.0" y="175.0" width="257.0" height="40.0" rx="4.0" fill="#DDEBF9" stroke="#CBD8E1" stroke-width="1"/><text x="626.5" y="195.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" dominant-baseline="middle">rpos[r]