<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="普通三元组转置：按原列号扫描"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">普通三元组转置：按原列号扫描</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">逐列寻找非零元，相当于依次生成新矩阵的各行</text><rect x="86.0" y="185.0" width="152.0" height="40.0" rx="4.0" fill="#DDEBF9" stroke="#CBD8E1" stroke-width="1"/><text x="162.0" y="205.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" dominant-baseline="middle">原列号</text><rect x="241.0" y="185.0" width="667.0" height="40.0" rx="4.0" fill="#DDEBF9" stroke="#CBD8E1" stroke-width="1"/><text x="574.5" y="205.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" dominant-baseline="middle">匹配的原三元组</text><rect x="86.0" y="230.0" width="152.0" height="48.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="162.0" y="254.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">0</text><rect x="241.0" y="230.0" width="667.0" height="48.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="574.5" y="254.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">(0,0,3), (2,0,-1)</text><rect x="86.0" y="281.0" width="152.0" height="48.0" rx="4.0" fill="#F8FAFD" stroke="#CBD8E1" stroke-width="0.9"/><text x="162.0" y="305.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">1</text><rect x="241.0" y="281.0" width="667.0" height="48.0" rx="4.0" fill="#F8FAFD" stroke="#CBD8E1" stroke-width="0.9"/><text x="574.5" y="305.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">(2,1,-2)</text><rect x="86.0" y="332.0" width="152.0" height="48.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="162.0" y="356.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">2</text><rect x="241.0" y="332.0" width="667.0" height="48.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="574.5" y="356.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">(1,2,-1)</text><rect x="86.0" y="383.0" width="152.0" height="48.0" rx="4.0" fill="#F8FAFD" stroke="#CBD8E1" stroke-width="0.9"/><text x="162.0" y="407.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">3</text><rect x="241.0" y="383.0" width="667.0" height="48.0" rx="4.0" fill="#F8FAFD" stroke="#CBD8E1" stroke-width="0.9"/><text x="574.5" y="407.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">(3,3,2)</text><rect x="86.0" y="434.0" width="152.0" height="48.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="162.0" y="458.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">4</text><rect x="241.0" y="434.0" width="667.0" height="48.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="574.5" y="458.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">(0,4,7)</text><text x="95.0" y="492.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">每列需要扫描全部 t 个三元组：O(n×t)</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">这种算法实现直接，适合示范；大规模稀疏矩阵可使用快速转置。</text></svg>