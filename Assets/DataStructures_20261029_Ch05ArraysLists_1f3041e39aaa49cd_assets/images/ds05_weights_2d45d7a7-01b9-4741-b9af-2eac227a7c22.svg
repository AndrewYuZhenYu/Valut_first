<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="三维行优先数组的跨维步长"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">三维行优先数组的跨维步长</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">A[2][3][4]，以字节数 L 表示单个元素大小</text><rect x="50.0" y="140.0" width="1010.0" height="344.0" rx="15.0" fill="#F6F9FC" stroke="#CBD8E1" stroke-width="1.4"/><text x="68.0" y="169.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="700" dominant-baseline="middle">每移动一个下标单位，将跨过多少个元素？</text><rect x="100.0" y="213.0" width="247.0" height="40.0" rx="4.0" fill="#DDEBF9" stroke="#CBD8E1" stroke-width="1"/><text x="223.5" y="233.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" dominant-baseline="middle">变化坐标</text><rect x="350.0" y="213.0" width="277.0" height="40.0" rx="4.0" fill="#DDEBF9" stroke="#CBD8E1" stroke-width="1"/><text x="488.5" y="233.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" dominant-baseline="middle">对应步长（元素）</text><rect x="630.0" y="213.0" width="343.0" height="40.0" rx="4.0" fill="#DDEBF9" stroke="#CBD8E1" stroke-width="1"/><text x="801.5" y="233.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" dominant-baseline="middle">原因</text><rect x="100.0" y="258.0" width="247.0" height="51.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="223.5" y="283.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">i + 1</text><rect x="350.0" y="258.0" width="277.0" height="51.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="488.5" y="283.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">3 × 4 = 12</text><rect x="630.0" y="258.0" width="343.0" height="51.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="801.5" y="283.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">跨一整层</text><rect x="100.0" y="312.0" width="247.0" height="51.0" rx="4.0" fill="#F8FAFD" stroke="#CBD8E1" stroke-width="0.9"/><text x="223.5" y="337.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">j + 1</text><rect x="350.0" y="312.0" width="277.0" height="51.0" rx="4.0" fill="#F8FAFD" stroke="#CBD8E1" stroke-width="0.9"/><text x="488.5" y="337.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">4</text><rect x="630.0" y="312.0" width="343.0" height="51.0" rx="4.0" fill="#F8FAFD" stroke="#CBD8E1" stroke-width="0.9"/><text x="801.5" y="337.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">跨一整行</text><rect x="100.0" y="366.0" width="247.0" height="51.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="223.5" y="391.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">k + 1</text><rect x="350.0" y="366.0" width="277.0" height="51.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="488.5" y="391.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">1</text><rect x="630.0" y="366.0" width="343.0" height="51.0" rx="4.0" fill="white" stroke="#CBD8E1" stroke-width="0.9"/><text x="801.5" y="391.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">跨一个元素</text><text x="110.0" y="456.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">偏移量 = 12i + 4j + k（元素数）</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">按行优先存储的 n 维数组，右侧维度的维界连乘决定左侧维度的步长。</text></svg>