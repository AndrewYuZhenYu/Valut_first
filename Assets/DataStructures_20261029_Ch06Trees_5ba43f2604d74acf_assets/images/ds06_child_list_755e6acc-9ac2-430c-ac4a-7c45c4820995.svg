="280.0" y2="398.0" stroke="#2363B3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><text x="305.0" y="398.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">∅</text><rect x="45.0" y="430.0" width="160.0" height="44.0" rx="8.0" fill="#EDF5FA" stroke="#CBD8E1" stroke-width="1.5"/><text x="125.0" y="452.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">F</text><line x1="208.0" y1="452.0" x2="280.0" y2="452.0" stroke="#2363B3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><text x="305.0" y="452.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">∅</text><rect x="45.0" y="484.0" width="160.0" height="44.0" rx="8.0" fill="#EDF5FA" stroke="#CBD8E1" stroke-width="1.5"/><text x="125.0" y="506.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">G</text><line x1="208.0" y1="506.0" x2="280.0" y2="506.0" stroke="#2363B3" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><text x="305.0" y="506.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">∅</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">找孩子很方便；若要找双亲，可增加 parent 下标变成带双亲的孩子链表。</text></svg>