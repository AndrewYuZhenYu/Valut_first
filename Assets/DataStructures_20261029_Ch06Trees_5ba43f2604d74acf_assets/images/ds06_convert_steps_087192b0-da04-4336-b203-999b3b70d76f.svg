<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="树转换为二叉树的三个动作"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">树转换为二叉树的三个动作</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">加兄弟连接 → 删除非首孩子的亲子边 → 整理为二叉树布局</text><rect x="40.0" y="150.0" width="345.0" height="370.0" rx="15.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="61.0" y="195.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">① 连接兄弟</text><text x="63.0" y="287.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">B—C—D</text><text x="63.0" y="351.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">E—F</text><text x="63.0" y="415.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">A→B/C/D</text><rect x="407.0" y="150.0" width="345.0" height="370.0" rx="15.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="428.0" y="195.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">② 仅保留首孩子</text><text x="430.0" y="287.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">A→B</text><text x="430.0" y="351.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">B→E</text><text x="430.0" y="415.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">其他孩子改走兄弟链</text><rect x="774.0" y="150.0" width="345.0" height="370.0" rx="15.0" fill="#F5F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="795.0" y="195.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">③ 用左右指针表达</text><text x="797.0" y="287.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">left=首孩子</text><text x="797.0" y="351.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">right=下个兄弟</text><text x="797.0" y="415.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">A.right=∅</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">这种转换主要是指针关系的重新解释，不能把“兄弟关系”误认成一般二叉树的亲子关系。</text></svg>