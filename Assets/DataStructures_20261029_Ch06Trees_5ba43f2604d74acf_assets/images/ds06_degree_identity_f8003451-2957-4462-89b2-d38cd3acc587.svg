<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="二叉树的边数与结点度数"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">二叉树的边数与结点度数</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">从两个角度计算一棵非空二叉树的边数</text><line x1="173.3" y1="263.8" x2="124.4" y2="316.2" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="173.3" y1="263.8" x2="271.1" y2="316.2" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="271.1" y1="351.2" x2="222.2" y2="403.8" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="271.1" y1="351.2" x2="320.0" y2="403.8" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="368.9" y1="176.2" x2="173.3" y2="228.8" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="368.9" y1="176.2" x2="466.7" y2="228.8" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="466.7" y1="263.8" x2="417.8" y2="316.2" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="466.7" y1="263.8" x2="515.6" y2="316.2" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><circle cx="124.4" cy="333.8" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="124.4" y="334.8" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">D</text><circle cx="173.3" cy="246.2" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="173.3" y="247.2" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">B</text><circle cx="222.2" cy="421.2" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="222.2" y="422.2" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">H</text><circle cx="271.1" cy="333.8" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="271.1" y="334.8" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">E</text><circle cx="320.0" cy="421.2" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="320.0" y="422.2" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">I</text><circle cx="368.9" cy="158.8" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="368.9" y="159.8" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">A</text><circle cx="417.8" cy="333.8" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="417.8" y="334.8" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">F</text><circle cx="466.7" cy="246.2" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="466.7" y="247.2" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">C</text><circle cx="515.6" cy="333.8" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="515.6" y="334.8" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">G</text><rect x="620.0" y="165.0" width="445.0" height="305.0" rx="18.0" fill="#F6FAFC" stroke="#CBD8E1" stroke-width="1.5"/><text x="650.0" y="214.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" dominant-baseline="middle">n = n₀ + n₁ + n₂</text><text x="650.0" y="282.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" dominant-baseline="middle">边数 = n − 1</text><text x="650.0" y="350.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" dominant-baseline="middle">边数 = n₁ + 2n₂</text><text x="650.0" y="418.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">因此 n₀ = n₂ + 1</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">公式适用于任意非空二叉树，不要求它是满二叉树或完全二叉树。</text></svg>