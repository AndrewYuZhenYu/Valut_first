<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="n 个结点的二叉链表，为什么有 n+1 个空指针？"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">n 个结点的二叉链表，为什么有 n+1 个空指针？</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">一共有 2n 个孩子指针域；实际边数是 n−1</text><rect x="85.0" y="170.0" width="440.0" height="270.0" rx="16.0" fill="#F3F9FC" stroke="#CBD8E1" stroke-width="1.5"/><text x="305.0" y="225.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" dominant-baseline="middle">指针域总数</text><text x="305.0" y="310.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="54" font-weight="700" dominant-baseline="middle">2n</text><rect x="615.0" y="170.0" width="440.0" height="270.0" rx="16.0" fill="#F5FBF7" stroke="#CBD8E1" stroke-width="1.5"/><text x="835.0" y="225.0" text-anchor="middle" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" dominant-baseline="middle">实际孩子指针</text><text x="835.0" y="310.0" text-anchor="middle" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="54" font-weight="700" dominant-baseline="middle">n−1</text><text x="572.0" y="315.0" text-anchor="middle" fill="#D67A2C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="56" font-weight="500" dominant-baseline="middle">−</text><text x="571.0" y="473.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" dominant-baseline="middle">2n − (n−1) = n+1</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">线索化只占用原来的空孩子指针域，原本非空的左右孩子连接必须保持不变。</text></svg>