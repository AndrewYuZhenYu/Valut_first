<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="孩子—兄弟表示：两个指针保存任意度的树"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">孩子—兄弟表示：两个指针保存任意度的树</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">firstchild 指向第一个孩子，nextsibling 指向右边紧邻的兄弟</text><rect x="100.0" y="210.0" width="290.0" height="115.0" rx="14.0" fill="#F6FAFD" stroke="#0B8A83" stroke-width="2"/><text x="245.0" y="249.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">data</text><text x="245.0" y="289.0" text-anchor="middle" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">结点值</text><rect x="425.0" y="210.0" width="290.0" height="115.0" rx="14.0" fill="#F6FAFD" stroke="#2363B3" stroke-width="2"/><text x="570.0" y="249.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">firstchild</text><text x="570.0" y="289.0" text-anchor="middle" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">第一个孩子</text><rect x="750.0" y="210.0" width="290.0" height="115.0" rx="14.0" fill="#F6FAFD" stroke="#2363B3" stroke-width="2"/><text x="895.0" y="249.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">nextsibling</text><text x="895.0" y="289.0" text-anchor="middle" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">下一个兄弟</text><line x1="570.0" y1="326.0" x2="500.0" y2="440.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="895.0" y1="326.0" x2="995.0" y2="440.0" stroke="#7249C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrp)"/><text x="479.0" y="475.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">↓ 左指针</text><text x="980.0" y="475.0" text-anchor="middle" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">→ 右指针</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">左孩子（第一个孩子），右兄弟（下一个兄弟）；这里右指针不是“右孩子”。</text></svg>