<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="二叉树的五种基本形态"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">二叉树的五种基本形态</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">左子树和右子树的位置不能颠倒，即便只有一个孩子也要分左、右</text><rect x="18.0" y="130.0" width="188.0" height="405.0" rx="16.0" fill="#F6FAFD" stroke="#CBD8E1" stroke-width="1.5"/><text x="112.0" y="165.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">空树</text><text x="112.0" y="298.0" text-anchor="middle" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="50" font-weight="500" dominant-baseline="middle">∅</text><rect x="232.0" y="130.0" width="188.0" height="405.0" rx="16.0" fill="#F6FAFD" stroke="#CBD8E1" stroke-width="1.5"/><text x="326.0" y="165.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">只有根</text><circle cx="326.0" cy="252.0" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="326.0" y="252.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">N</text><rect x="446.0" y="130.0" width="188.0" height="405.0" rx="16.0" fill="#F6FAFD" stroke="#CBD8E1" stroke-width="1.5"/><text x="540.0" y="165.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">仅左子树</text><circle cx="540.0" cy="252.0" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="540.0" y="252.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">N</text><line x1="530.0" y1="276.0" x2="488.0" y2="345.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><circle cx="478.0" cy="371.0" r="23.0" fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="478.0" y="371.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">L</text><rect x="660.0" y="130.0" width="188.0" height="405.0" rx="16.0" fill="#F6FAFD" stroke="#CBD8E1" stroke-width="1.5"/><text x="754.0" y="165.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">仅右子树</text><circle cx="754.0" cy="252.0" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="754.0" y="252.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">N</text><line x1="764.0" y1="276.0" x2="806.0" y2="345.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><circle cx="816.0" cy="371.0" r="23.0" fill="#FFFFFF" stroke="#D67A2C" stroke-width="2.5"/><text x="816.0" y="371.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">R</text><rect x="874.0" y="130.0" width="188.0" height="405.0" rx="16.0" fill="#F6FAFD" stroke="#CBD8E1" stroke-width="1.5"/><text x="968.0" y="165.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">左右都有</text><circle cx="968.0" cy="252.0" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="968.0" y="252.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">N</text><line x1="958.0" y1="276.0" x2="916.0" y2="345.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><circle cx="906.0" cy="371.0" r="23.0" fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="906.0" y="371.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">L</text><line x1="978.0" y1="276.0" x2="1020.0" y2="345.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><circle cx="1030.0" cy="371.0" r="23.0" fill="#FFFFFF" stroke="#D67A2C" stroke-width="2.5"/><text x="1030.0" y="371.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">R</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">只含左孩子的结构与只含右孩子的结构不同，这是二叉树区别于“度不超过 2 的一般树”的关键。</text></svg>