<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="森林转二叉树：结构关系对应"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">森林转二叉树：结构关系对应</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">原森林可分解为：第一棵树的根、它的子树森林、剩余树的森林</text><rect x="49.0" y="165.0" width="338.0" height="306.0" rx="16.0" fill="#F7FAFD" stroke="#CBD8E1" stroke-width="1.5"/><text x="71.0" y="213.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">根</text><text x="71.0" y="313.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">T₁ 根：A</text><text x="71.0" y="388.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">成为 B 的根</text><rect x="414.0" y="165.0" width="338.0" height="306.0" rx="16.0" fill="#F7FAFD" stroke="#CBD8E1" stroke-width="1.5"/><text x="436.0" y="213.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">左子树</text><text x="436.0" y="313.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">A 的孩子森林</text><text x="436.0" y="388.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">转换为 B.left</text><rect x="779.0" y="165.0" width="338.0" height="306.0" rx="16.0" fill="#F7FAFD" stroke="#CBD8E1" stroke-width="1.5"/><text x="801.0" y="213.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">右子树</text><text x="801.0" y="313.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">其余 T₂、T₃</text><text x="801.0" y="388.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">转换为 B.right</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">这是森林与二叉树的一一对应关系（固定森林中树的顺序后）。</text></svg>