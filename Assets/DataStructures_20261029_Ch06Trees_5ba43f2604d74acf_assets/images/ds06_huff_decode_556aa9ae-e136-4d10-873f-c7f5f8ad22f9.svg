<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="解码不是“按空格分割”，而是从根沿位走"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">解码不是“按空格分割”，而是从根沿位走</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">以一套前缀码 A=0、B=10、C=11 为例</text><text x="66.0" y="158.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" dominant-baseline="middle">待解码比特流：0 11 10 0</text><rect x="80.0" y="233.0" width="230.0" height="147.0" rx="16.0" fill="#F3FAF8" stroke="#0B8A83" stroke-width="1.5"/><text x="195.0" y="285.0" text-anchor="middle" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" dominant-baseline="middle">0</text><text x="195.0" y="339.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" dominant-baseline="middle">→ A</text><rect x="342.0" y="233.0" width="230.0" height="147.0" rx="16.0" fill="#F3FAF8" stroke="#0B8A83" stroke-width="1.5"/><text x="457.0" y="285.0" text-anchor="middle" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" dominant-baseline="middle">11</text><text x="457.0" y="339.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" dominant-baseline="middle">→ C</text><rect x="604.0" y="233.0" width="230.0" height="147.0" rx="16.0" fill="#F3FAF8" stroke="#0B8A83" stroke-width="1.5"/><text x="719.0" y="285.0" text-anchor="middle" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" dominant-baseline="middle">10</text><text x="719.0" y="339.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" dominant-baseline="middle">→ B</text><rect x="866.0" y="233.0" width="230.0" height="147.0" rx="16.0" fill="#F3FAF8" stroke="#0B8A83" stroke-width="1.5"/><text x="981.0" y="285.0" text-anchor="middle" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" dominant-baseline="middle">0</text><text x="981.0" y="339.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="500" dominant-baseline="middle">→ A</text><text x="565.0" y="454.0" text-anchor="middle" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" dominant-baseline="middle">最终得到：A C B A</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">读取到叶子就输出字符，并回到树根继续读取；前缀性质保证可以唯一解码。</text></svg>