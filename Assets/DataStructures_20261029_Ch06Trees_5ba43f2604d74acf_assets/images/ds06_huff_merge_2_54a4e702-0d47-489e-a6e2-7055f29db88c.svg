<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="哈夫曼构造 · 第 2 步"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">哈夫曼构造 · 第 2 步</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">每轮从当前森林里取两棵权值最小的树，合并后重新加入</text><text x="70.0" y="166.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" dominant-baseline="middle">本轮最小的两棵树：6 与 7</text><circle cx="250.0" cy="321.0" r="45.0" fill="#F4FBF7" stroke="#0B8A83" stroke-width="3"/><text x="250.0" y="321.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" dominant-baseline="middle">6</text><circle cx="470.0" cy="321.0" r="45.0" fill="#F4FBF7" stroke="#0B8A83" stroke-width="3"/><text x="470.0" y="321.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" dominant-baseline="middle">7</text><circle cx="825.0" cy="321.0" r="45.0" fill="#FFF0E0" stroke="#D67A2C" stroke-width="3"/><text x="825.0" y="321.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" dominant-baseline="middle">13</text><text x="350.0" y="321.0" text-anchor="middle" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="700" dominant-baseline="middle">+</text><text x="644.0" y="321.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="50" font-weight="700" dominant-baseline="middle">→</text><text x="91.0" y="436.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">合并后的候选根权值：7、9、13</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">每次合并都创建一个新的内部结点，新权值＝左右子树的权值之和；已选的两棵树移出森林。</text></svg>