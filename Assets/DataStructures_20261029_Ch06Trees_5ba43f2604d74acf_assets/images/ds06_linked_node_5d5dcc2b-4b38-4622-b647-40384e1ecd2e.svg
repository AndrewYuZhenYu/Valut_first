<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="二叉链表：一个数据域与两个孩子指针域"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">二叉链表：一个数据域与两个孩子指针域</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">每个结点显式存放 left、data、right 三个区域</text><rect x="205.0" y="255.0" width="210.0" height="105.0" rx="10.0" fill="#F5F9FD" stroke="#2363B3" stroke-width="2"/><text x="310.0" y="307.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" dominant-baseline="middle">left</text><rect x="435.0" y="255.0" width="210.0" height="105.0" rx="10.0" fill="#F5F9FD" stroke="#0B8A83" stroke-width="2"/><text x="540.0" y="307.0" text-anchor="middle" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" dominant-baseline="middle">data</text><rect x="665.0" y="255.0" width="210.0" height="105.0" rx="10.0" fill="#F5F9FD" stroke="#2363B3" stroke-width="2"/><text x="770.0" y="307.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" dominant-baseline="middle">right</text><line x1="310.0" y1="359.0" x2="230.0" y2="474.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="770.0" y1="359.0" x2="900.0" y2="474.0" stroke="#2363B3" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="230.0" cy="497.0" r="24.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="230.0" y="547.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" dominant-baseline="middle">左子树</text><circle cx="900.0" cy="497.0" r="24.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="900.0" y="547.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" dominant-baseline="middle">右子树</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">孩子不存在时对应指针为 nullptr；二叉链表的空间需求与实际结点数成正比。</text></svg>