<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="有序树：兄弟次序不能交换"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">有序树：兄弟次序不能交换</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">相邻孩子的左右次序是结构的一部分</text><line x1="565.0" y1="355.0" x2="443.8" y2="512.5" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="565.0" y1="355.0" x2="686.2" y2="512.5" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="565.0" y1="162.5" x2="201.2" y2="320.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="565.0" y1="162.5" x2="565.0" y2="320.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="565.0" y1="162.5" x2="928.8" y2="320.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><circle cx="201.2" cy="337.5" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="201.2" y="338.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">B</text><circle cx="443.8" cy="530.0" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="443.8" y="531.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">E</text><circle cx="686.2" cy="530.0" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="686.2" y="531.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">F</text><circle cx="565.0" cy="337.5" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="565.0" y="338.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">C</text><circle cx="928.8" cy="337.5" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="928.8" y="338.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">D</text><circle cx="565.0" cy="145.0" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="565.0" y="146.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">A</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">将 B 与 C 交换后，有序树已经发生变化；无序树则不区分兄弟间的排列。</text></svg>