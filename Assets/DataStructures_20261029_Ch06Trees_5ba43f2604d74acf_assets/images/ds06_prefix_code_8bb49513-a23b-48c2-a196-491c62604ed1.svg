<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="前缀编码能直接沿树逐位解码"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">前缀编码能直接沿树逐位解码</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">一个字符位于叶子时立即结束；不会发生“短码是长码开头”的歧义</text><rect x="42.0" y="161.0" width="510.0" height="336.0" rx="17.0" fill="#F5FBF7" stroke="#2E9663" stroke-width="1.5"/><text x="67.0" y="206.0" text-anchor="start" fill="#2E9663" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">合法前缀码</text><text x="67.0" y="299.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">A=0，B=10，C=11</text><text x="67.0" y="388.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">A=0 不可能是 B=10 的前缀</text><rect x="594.0" y="161.0" width="510.0" height="336.0" rx="17.0" fill="#FFF8F4" stroke="#C24857" stroke-width="1.5"/><text x="619.0" y="206.0" text-anchor="start" fill="#C24857" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" dominant-baseline="middle">不是前缀码</text><text x="619.0" y="299.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">A=0，B=01，C=11</text><text x="619.0" y="388.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">A=0 是 B=01 的前缀</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">前缀码能即时解码；哈夫曼码只是最优前缀码的一种构造方法，并非唯一可能的编码。</text></svg>