<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="先序 + 中序：由根拆分左右子树"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">先序 + 中序：由根拆分左右子树</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">以 ABCDEFG 的先序与 C B D A E G F 的中序为例</text><text x="66.0" y="145.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" dominant-baseline="middle">先序：a  b  c  d  e  f  g</text><text x="66.0" y="216.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" dominant-baseline="middle">中序：c  b  d  a  e  g  f</text><rect x="147.0" y="183.0" width="165.0" height="76.0" rx="11.0" fill="#E6F4F1" stroke="#0B8A83" stroke-width="1.5"/><rect x="388.0" y="183.0" width="60.0" height="76.0" rx="11.0" fill="#FFF0DC" stroke="#D67A2C" stroke-width="1.5"/><rect x="460.0" y="183.0" width="240.0" height="76.0" rx="11.0" fill="#EAF3FF" stroke="#2363B3" stroke-width="1.5"/><text x="230.0" y="313.0" text-anchor="middle" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">左子树 (c b d)</text><text x="418.0" y="313.0" text-anchor="middle" fill="#D67A2C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">根 a</text><text x="589.0" y="313.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">右子树 (e g f)</text><line x1="417.0" y1="337.0" x2="417.0" y2="382.0" stroke="#647B8C" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><text x="417.0" y="427.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="500" dominant-baseline="middle">左子树先序 b c d；右子树先序 e f g</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">先序的第一个值是根；在中序中定位根，左边的长度决定先序应切走多少个结点。</text></svg>