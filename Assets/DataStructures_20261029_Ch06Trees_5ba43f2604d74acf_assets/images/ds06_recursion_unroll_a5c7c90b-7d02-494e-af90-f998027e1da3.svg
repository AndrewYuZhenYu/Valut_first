<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="递归访问展开：先序遍历 A(B, C)"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">递归访问展开：先序遍历 A(B, C)</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">函数调用与回到父结点的时机</text><rect x="35.0" y="183.0" width="203.0" height="180.0" rx="15.0" fill="#F6F9FD" stroke="#CBD8E1" stroke-width="1.5"/><text x="52.0" y="226.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">① 进入 A</text><text x="52.0" y="282.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">访问 A</text><line x1="238.0" y1="264.0" x2="254.0" y2="264.0" stroke="#2363B3" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="257.0" y="183.0" width="203.0" height="180.0" rx="15.0" fill="#F6F9FD" stroke="#CBD8E1" stroke-width="1.5"/><text x="274.0" y="226.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">② 进入 B</text><text x="274.0" y="282.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">访问 B</text><line x1="460.0" y1="264.0" x2="476.0" y2="264.0" stroke="#2363B3" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="479.0" y="183.0" width="203.0" height="180.0" rx="15.0" fill="#F6F9FD" stroke="#CBD8E1" stroke-width="1.5"/><text x="496.0" y="226.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">③ 从 B 返回</text><text x="496.0" y="282.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">左子树结束</text><line x1="682.0" y1="264.0" x2="698.0" y2="264.0" stroke="#2363B3" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="701.0" y="183.0" width="203.0" height="180.0" rx="15.0" fill="#F6F9FD" stroke="#CBD8E1" stroke-width="1.5"/><text x="718.0" y="226.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">④ 进入 C</text><text x="718.0" y="282.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">访问 C</text><line x1="904.0" y1="264.0" x2="920.0" y2="264.0" stroke="#2363B3" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="923.0" y="183.0" width="203.0" height="180.0" rx="15.0" fill="#F6F9FD" stroke="#CBD8E1" stroke-width="1.5"/><text x="940.0" y="226.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" dominant-baseline="middle">⑤ 从 C 返回</text><text x="940.0" y="282.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">遍历完成</text><rect x="120.0" y="428.0" width="900.0" height="84.0" rx="14.0" fill="#F4FAF8"/><text x="570.0" y="470.0" text-anchor="middle" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">pre(A) → visit A → pre(B) → visit B → pre(C) → visit C</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">递归调用栈会自动记录尚未完成的结点；改成非递归时需要显式管理类似的信息。</text></svg>