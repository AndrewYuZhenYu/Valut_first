th="3"/><text x="807.5" y="287.2" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">C</text><circle cx="969.2" cy="414.5" r="25.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="969.2" y="415.5" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="700" dominant-baseline="middle">F</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">这里只绘制部分前驱／后继线索；真正的孩子指针不能改写为线索。</text></svg>