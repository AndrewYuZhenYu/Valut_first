<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="中序线索：利用空指针连接相邻结点"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">中序线索：利用空指针连接相邻结点</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">紫色虚线仅用于示意新增线索，原孩子指针仍是实线</text><line x1="322.5" y1="303.7" x2="160.8" y2="397.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="322.5" y1="303.7" x2="484.2" y2="397.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="645.8" y1="175.3" x2="322.5" y2="268.7" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="645.8" y1="175.3" x2="807.5" y2="268.7" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="807.5" y1="303.7" x2="969.2" y2="397.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><path d="M160.8,438.5 Q241.7,498.5 322.5,308.2" fill="none" stroke="#7249C7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrp)"/><text x="241.7" y="485.5" text-anchor="middle" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="500" dominant-baseline="middle">后继</text><path d="M484.2,438.5