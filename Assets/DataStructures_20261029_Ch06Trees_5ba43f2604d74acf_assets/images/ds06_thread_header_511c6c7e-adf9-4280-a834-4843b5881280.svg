<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="带头结点的中序线索链表"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">带头结点的中序线索链表</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">头结点把中序序列首尾连接起来，降低遍历边界处理难度</text><circle cx="70.0" cy="285.0" r="25.0" fill="#FFF2E1" stroke="#D67A2C" stroke-width="2.5"/><text x="70.0" y="285.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">头</text><line x1="97.0" y1="285.0" x2="185.0" y2="285.0" stroke="#7249C7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrp)"/><circle cx="213.0" cy="285.0" r="25.0" fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="213.0" y="285.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">D</text><line x1="240.0" y1="285.0" x2="328.0" y2="285.0" stroke="#CBD8E1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="356.0" cy="285.0" r="25.0" fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="356.0" y="285.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">B</text><line x1="383.0" y1="285.0" x2="471.0" y2="285.0" stroke="#CBD8E1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="499.0" cy="285.0" r="25.0" fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="499.0" y="285.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">E</text><line x1="526.0" y1="285.0" x2="614.0" y2="285.0" stroke="#CBD8E1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="642.0" cy="285.0" r="25.0" fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="642.0" y="285.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">A</text><line x1="669.0" y1="285.0" x2="757.0" y2="285.0" stroke="#CBD8E1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="785.0" cy="285.0" r="25.0" fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="785.0" y="285.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">C</text><line x1="812.0" y1="285.0" x2="900.0" y2="285.0" stroke="#CBD8E1" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="928.0" cy="285.0" r="25.0" fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="928.0" y="285.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">F</text><line x1="955.0" y1="285.0" x2="1043.0" y2="285.0" stroke="#7249C7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#arrp)"/><circle cx="1071.0" cy="285.0" r="25.0" fill="#FFF2E1" stroke="#D67A2C" stroke-width="2.5"/><text x="1071.0" y="285.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" dominant-baseline="middle">头</text><text x="573.0" y="393.0" text-anchor="middle" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="20" font-weight="500" dominant-baseline="middle">概念上的中序访问顺序（不代表所有相邻结点都以线索直接相连）</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">头结点的 left 指向根，right 指向中序最后结点；首结点的前驱与末结点后继可回指头结点。</text></svg>