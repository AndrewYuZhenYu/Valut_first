<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="线索化过程中 pre 与 p 的关系"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">线索化过程中 pre 与 p 的关系</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">pre 始终保存“刚刚访问过”的结点；p 是当前要访问的结点</text><circle cx="94.0" cy="273.0" r="28.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="94.0" y="273.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">D</text><line x1="124.0" y1="273.0" x2="248.0" y2="273.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="278.0" cy="273.0" r="28.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="278.0" y="273.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">B</text><line x1="308.0" y1="273.0" x2="432.0" y2="273.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="462.0" cy="273.0" r="28.0" fill="#E8F6F2" stroke="#0B8A83" stroke-width="3"/><text x="462.0" y="273.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">E</text><line x1="492.0" y1="273.0" x2="616.0" y2="273.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="646.0" cy="273.0" r="28.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="646.0" y="273.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">A</text><line x1="676.0" y1="273.0" x2="800.0" y2="273.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="830.0" cy="273.0" r="28.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="830.0" y="273.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">C</text><line x1="860.0" y1="273.0" x2="984.0" y2="273.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="1014.0" cy="273.0" r="28.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="3"/><text x="1014.0" y="273.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">F</text><line x1="275.0" y1="352.0" x2="275.0" y2="403.0" stroke="#7249C7" stroke-width="3" stroke-linecap="round" marker-end="url(#arrp)"/><text x="275.0" y="433.0" text-anchor="middle" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">pre 指向 B</text><line x1="462.0" y1="352.0" x2="462.0" y2="403.0" stroke="#D67A2C" stroke-width="3" stroke-linecap="round"/><text x="462.0" y="433.0" text-anchor="middle" fill="#D67A2C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">p 指向 E</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">处理中序序列中的 E 时：若 E.left 为空，则指向 B；若 B.right 为空，则指向 E。</text></svg>