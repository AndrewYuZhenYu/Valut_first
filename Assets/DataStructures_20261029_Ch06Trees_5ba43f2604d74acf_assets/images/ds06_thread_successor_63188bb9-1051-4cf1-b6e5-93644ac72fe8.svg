<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="中序线索二叉树：如何寻找后继"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">中序线索二叉树：如何寻找后继</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">如果 RTag=1，右指针直接是后继；如果 RTag=0，找右子树最左结点</text><rect x="46.0" y="157.0" width="512.0" height="330.0" rx="16.0" fill="#F6FAFC" stroke="#CBD8E1" stroke-width="1.5"/><text x="71.0" y="205.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">情形一：右指针是线索</text><text x="70.0" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">RTag = 1</text><text x="70.0" y="343.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">successor(p) = p→right</text><text x="70.0" y="406.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">例如叶子 D 的后继是 B</text><rect x="588.0" y="157.0" width="512.0" height="330.0" rx="16.0" fill="#F6FAFC" stroke="#CBD8E1" stroke-width="1.5"/><text x="613.0" y="205.0" text-anchor="start" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">情形二：有真实右子树</text><text x="612.0" y="280.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">RTag = 0</text><text x="612.0" y="343.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">从 p→right 一路向左</text><text x="612.0" y="406.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">例如 A 的后继是 C</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">中序前驱对称：若左指针是线索则直接读取，否则进入左子树沿右孩子走到底。</text></svg>