<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="线索结点中的两个标志位"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">线索结点中的两个标志位</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">LTag/RTag = 0 表示真实孩子；= 1 表示前驱/后继线索</text><rect x="50.0" y="200.0" width="194.0" height="105.0" rx="13.0" fill="#F6FAFD" stroke="#D67A2C" stroke-width="2"/><text x="147.0" y="251.0" text-anchor="middle" fill="#D67A2C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">LTag</text><rect x="260.0" y="200.0" width="194.0" height="105.0" rx="13.0" fill="#F6FAFD" stroke="#2363B3" stroke-width="2"/><text x="357.0" y="251.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">left</text><rect x="470.0" y="200.0" width="194.0" height="105.0" rx="13.0" fill="#F6FAFD" stroke="#0B8A83" stroke-width="2"/><text x="567.0" y="251.0" text-anchor="middle" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">data</text><rect x="680.0" y="200.0" width="194.0" height="105.0" rx="13.0" fill="#F6FAFD" stroke="#2363B3" stroke-width="2"/><text x="777.0" y="251.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">right</text><rect x="890.0" y="200.0" width="194.0" height="105.0" rx="13.0" fill="#F6FAFD" stroke="#D67A2C" stroke-width="2"/><text x="987.0" y="251.0" text-anchor="middle" fill="#D67A2C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">RTag</text><text x="78.0" y="375.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">0：left 是左孩子</text><text x="610.0" y="375.0" text-anchor="start" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">1：left 是中序前驱</text><text x="78.0" y="440.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">0：right 是右孩子</text><text x="610.0" y="440.0" text-anchor="start" fill="#7249C7" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="500" dominant-baseline="middle">1：right 是中序后继</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">访问孩子前先检查标志位！把“线索”当作子树递归会出现错误甚至循环。</text></svg>