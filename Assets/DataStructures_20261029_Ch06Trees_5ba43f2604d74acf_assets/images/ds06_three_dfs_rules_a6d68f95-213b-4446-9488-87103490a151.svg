<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="三种深度优先遍历的“根”位置"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">三种深度优先遍历的“根”位置</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">每次进入非空子树，都按同一规则处理根、左子树和右子树</text><text x="65.0" y="195.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" dominant-baseline="middle">先序</text><rect x="260.0" y="165.0" width="205.0" height="64.0" rx="13.0" fill="#E8F4FF" stroke="#2363B3" stroke-width="1.5"/><text x="362.0" y="198.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">根</text><rect x="512.0" y="165.0" width="205.0" height="64.0" rx="13.0" fill="#F3F7FB" stroke="#CBD8E1" stroke-width="1.5"/><text x="614.0" y="198.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">左</text><rect x="764.0" y="165.0" width="205.0" height="64.0" rx="13.0" fill="#F3F7FB" stroke="#CBD8E1" stroke-width="1.5"/><text x="866.0" y="198.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">右</text><text x="1040.0" y="197.0" text-anchor="middle" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">根在最前</text><text x="65.0" y="339.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" dominant-baseline="middle">中序</text><rect x="260.0" y="309.0" width="205.0" height="64.0" rx="13.0" fill="#F3F7FB" stroke="#CBD8E1" stroke-width="1.5"/><text x="362.0" y="342.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">左</text><rect x="512.0" y="309.0" width="205.0" height="64.0" rx="13.0" fill="#E8F4FF" stroke="#2363B3" stroke-width="1.5"/><text x="614.0" y="342.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">根</text><rect x="764.0" y="309.0" width="205.0" height="64.0" rx="13.0" fill="#F3F7FB" stroke="#CBD8E1" stroke-width="1.5"/><text x="866.0" y="342.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">右</text><text x="1040.0" y="341.0" text-anchor="middle" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">根在中间</text><text x="65.0" y="483.0" text-anchor="start" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="700" dominant-baseline="middle">后序</text><rect x="260.0" y="453.0" width="205.0" height="64.0" rx="13.0" fill="#F3F7FB" stroke="#CBD8E1" stroke-width="1.5"/><text x="362.0" y="486.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">左</text><rect x="512.0" y="453.0" width="205.0" height="64.0" rx="13.0" fill="#F3F7FB" stroke="#CBD8E1" stroke-width="1.5"/><text x="614.0" y="486.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">右</text><rect x="764.0" y="453.0" width="205.0" height="64.0" rx="13.0" fill="#E8F4FF" stroke="#2363B3" stroke-width="1.5"/><text x="866.0" y="486.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="700" dominant-baseline="middle">根</text><text x="1040.0" y="485.0" text-anchor="middle" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">根在最后</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">三者均规定先处理左子树再处理右子树，只是“访问根”的位置不同。</text></svg>