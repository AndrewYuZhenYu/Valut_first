<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="为什么只知道先序不能还原形态"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">为什么只知道先序不能还原形态</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">两棵不同的树具有同一个先序序列 A、B、C</text><text x="240.0" y="140.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">树 ①：左链</text><line x1="240.0" y1="207.0" x2="180.0" y2="293.0" stroke="#0B8A83" stroke-width="3" stroke-linecap="round"/><line x1="180.0" y1="337.0" x2="130.0" y2="408.0" stroke="#0B8A83" stroke-width="3" stroke-linecap="round"/><circle cx="240.0" cy="185.0" r="23.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="240.0" y="185.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">A</text><circle cx="180.0" cy="315.0" r="23.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="180.0" y="315.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">B</text><circle cx="130.0" cy="430.0" r="23.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="130.0" y="430.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">C</text><text x="780.0" y="140.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">树 ②：右链</text><line x1="780.0" y1="207.0" x2="850.0" y2="293.0" stroke="#0B8A83" stroke-width="3" stroke-linecap="round"/><line x1="850.0" y1="337.0" x2="930.0" y2="408.0" stroke="#0B8A83" stroke-width="3" stroke-linecap="round"/><circle cx="780.0" cy="185.0" r="23.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="780.0" y="185.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">A</text><circle cx="850.0" cy="315.0" r="23.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="850.0" y="315.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">B</text><circle cx="930.0" cy="430.0" r="23.0" fill="#FFFFFF" stroke="#2363B3" stroke-width="2.5"/><text x="930.0" y="430.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="500" dominant-baseline="middle">C</text><text x="550.0" y="320.0" text-anchor="middle" fill="#D67A2C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="58" font-weight="700" dominant-baseline="middle">≠</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">两棵不同的二叉树，先序都为 A B C；仅有先序或仅有后序通常不足以确定左右位置。</text></svg>