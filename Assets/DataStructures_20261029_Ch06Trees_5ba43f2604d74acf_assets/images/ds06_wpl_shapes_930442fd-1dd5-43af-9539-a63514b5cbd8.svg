 fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="1025.0" y="390.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" dominant-baseline="middle">*</text><circle cx="978.0" cy="486.0" r="22.0" fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="978.0" y="486.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" dominant-baseline="middle">2</text><circle cx="1062.0" cy="486.0" r="22.0" fill="#FFFFFF" stroke="#0B8A83" stroke-width="2.5"/><text x="1062.0" y="486.0" text-anchor="middle" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" dominant-baseline="middle">4</text><text x="285.0" y="491.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">WPL = 36</text><text x="786.0" y="522.0" text-anchor="middle" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="500" dominant-baseline="middle">WPL = 7×1 + 5×2 + 2×3 + 4×3 = 35</text><rect x="36.0" y="576.0" width="1068.0" height="38.0" rx="10.0" fill="#F3F7FB"/><text x="54.0" y="595.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="500" dominant-baseline="middle">哈夫曼算法系统地选择两棵最小权值树合并，以得到最小可能 WPL。</text></svg>