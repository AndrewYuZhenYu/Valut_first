<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" role="img" aria-label="同样权值，不同形态产生不同 WPL"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2363B3"/></marker><marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7249C7"/></marker></defs><rect x="0.0" y="0.0" width="1140.0" height="640.0" rx="0.0" fill="#FFFFFF"/><rect x="0.0" y="0.0" width="1140.0" height="6.0" rx="0.0" fill="#0B8A83"/><text x="34.0" y="49.0" text-anchor="start" fill="#19334B" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="29" font-weight="700" dominant-baseline="middle">同样权值，不同形态产生不同 WPL</text><text x="36.0" y="79.0" text-anchor="start" fill="#647B8C" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="500" dominant-baseline="middle">四个叶子权值 7、5、2、4</text><text x="285.0" y="135.0" text-anchor="middle" fill="#2363B3" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">方案 ①：等长编码</text><text x="833.0" y="135.0" text-anchor="middle" fill="#0B8A83" font-family="Noto Sans CJK SC,PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" dominant-baseline="middle">方案 ②：较重权值更靠近根</text><line x1="285.0" y1="215.0" x2="174.0" y2="270.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="285.0" y1="215.0" x2="392.0" y2="270.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="174.0" y1="314.0" x2="125.0" y2="385.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="174.0" y1="314.0" x2="224.0" y2="385.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/><line x1="392.0" y1="314.0" x2="346.0" y2="385.0" stroke="#CBD8E1" stroke-width="3" stroke-linecap="round"/>