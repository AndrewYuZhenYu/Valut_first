<svg baseProfile="full" height="350" version="1.1" viewBox="0 0 1180 350" width="1180" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="12" markerUnits="userSpaceOnUse" markerWidth="15" orient="auto" refX="12" refY="6"><path d="M1,1 L12,6 L1,11 Z" fill="#246FD1" /></marker></defs><rect fill="white" height="350" width="1180" x="0" y="0" /><line stroke="#B8C9DE" stroke-width="2" x1="35" x2="1145" y1="77" y2="77" /><text fill="#24324A" font-family="Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700" text-anchor="start" x="45" y="54">折叠法：长关键字拆段后求和</text><rect fill="#E9F2FF" height="65" rx="12" ry="12" stroke="#246FD1" stroke-width="2.3" width="230" x="70" y="143" /><text fill="#24324A" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" text-anchor="middle" x="185.0" y="187.05">1234</text><rect fill="#E9F2FF" height="65" rx="12" ry="12" stroke="#246FD1" stroke-width="2.3" width="230" x="370" y="143" /><text fill="#24324A" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" text-anchor="middle" x="485.0" y="187.05">5678</text><rect fill="#E9F2FF" height="65" rx="12" ry="12" stroke="#246FD1" stroke-width="2.3" width="230" x="670" y="143" /><text fill="#24324A" font-family="Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" text-anchor="middle" x="785.0" y="187.05">9012</text><line fill="none" marker-end="url(#arrow)" stroke="#246FD1" stroke-linecap="round" stroke-width="3" x1="955" x2="1080" y1="170" y2="170" /><rect fill="#DDF5ED" height="68" rx="12" ry="12" stroke="#078B75" stroke-width="2.3" width="205" x="903" y="240" /><text fill="#24324A" font-family="Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" text-anchor="middle" x="1005.5" y="285.9">15924</text><text fill="#66758D" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="400" text-anchor="start" x="7