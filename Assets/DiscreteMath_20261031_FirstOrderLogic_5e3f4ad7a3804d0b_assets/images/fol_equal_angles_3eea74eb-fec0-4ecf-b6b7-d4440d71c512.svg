<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 1200 520" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="520" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">角度相等不等于同一对象或对顶关系</text><rect fill="#f2f7fc" height="365" rx="15" ry="15" stroke="#bfd0df" stroke-width="2" width="510" x="65" y="120" /><rect fill="#eaf8f5" height="365" rx="15" ry="15" stroke="#bfd0df" stroke-width="2" width="510" x="625" y="120" /><text fill="#2865bd" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="320" y="169">相等的角：可以在不同位置</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="880" y="169">对顶角：共顶点且两边反向</text><line stroke="#2865bd" stroke-width="4" x1="172" x2="282" y1="325" y2="325" /><line stroke="#2865bd" stroke-width="4" x1="172" x2="172" y1="325" y2="213" /><path d="M 218 325 A 46 46 0 0 0 172 279" fill="none" stroke="#c2761f" stroke-width="5" /><line stroke="#2865bd" stroke-width="4" x1="402" x2="512" y1="325" y2="325" /><line stroke="#2865bd" stroke-width="4" x1="402" x2="402" y1="325" y2="213" /><path d="M 448 325 A 46 46 0 0 0 402 279" fill="none" stroke="#c2761f" stroke-width="5" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="400" text-anchor="middle" x="220" y="383">∠1 = 90°</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="400" text-anchor="middle" x="446" y="383">∠2 = 90°</text><line stroke="#2865bd" stroke-width="5" x1="737" x2="1033" y1="234" y2="420" /><line stroke="#0a897e" stroke-width="5" x1="737" x2="1033" y1="420" y2="234" /><circle cx="885" cy="327" fill="#13263b" r="7" stroke="#13263b" stroke-width="2" /><path d="M 941 362 Q 971 327 941 292" fill="none" stroke="#c2761f" stroke-width="5" /><path d="M 829 292 Q 799 327 829 362" fill="none" stroke="#c2761f" stroke-width="5" /><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="400" text-anchor="middle" x="320" y="444">等角不保证具有对顶的位置关系</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="884" y="444">对顶角必相等，反向不成立</text></svg>