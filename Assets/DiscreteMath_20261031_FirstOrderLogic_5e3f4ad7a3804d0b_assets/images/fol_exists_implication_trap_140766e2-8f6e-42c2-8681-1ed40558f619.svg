<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="475px" version="1.1" viewBox="0 0 1200 475" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="475" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">错误写法为什么会“找错见证对象”</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="start" x="65" y="147">论域 D = {石头 a, 学生 b}；M(x)：是学生；G(x)：成绩好</text><rect fill="#fff0f1" height="255" rx="15" ry="15" stroke="#c34655" stroke-width="2" width="510" x="70" y="190" /><rect fill="#eaf8f5" height="255" rx="15" ry="15" stroke="#0a897e" stroke-width="2" width="510" x="620" y="190" /><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="31" font-weight="600" text-anchor="start" x="90" y="245">∃x(M(x) → G(x))</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="31" font-weight="600" text-anchor="start" x="640" y="245">∃x(M(x) ∧ G(x))</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="400" text-anchor="start" x="92" y="307">取石头 a：M(a) 为假</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="400" text-anchor="start" x="92" y="346">所以 M(a)→G(a) 为真</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="start" x="92" y="390">即使没有优秀学生，也可能为真</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="400" text-anchor="start" x="644" y="307">必须有某个对象同时满足</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="600" text-anchor="start" x="644" y="351">M(x) 与 G(x)</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="start" x="644" y="400">不允许用“非学生”充数</text></svg>