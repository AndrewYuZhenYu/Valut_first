<svg baseProfile="full" height="515px" version="1.1" viewBox="0 0 1200 515" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="515" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">有限论域：全称量词展开为合取</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="700" text-anchor="start" x="60" y="144">D={1,2,3,4}，P(x)：x²&lt;10</text><rect fill="#eaf8f5" height="172" rx="15" ry="15" stroke="#0a897e" stroke-width="2" width="205" x="90" y="195" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" x="192" y="247">x=1</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="192" y="300">1&lt;10</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="192" y="343">真</text><rect fill="#eaf8f5" height="172" rx="15" ry="15" stroke="#0a897e" stroke-width="2" width="205" x="377" y="195" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" x="479" y="247">x=2</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="479" y="300">4&lt;10</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="479" y="343">真</text><rect fill="#eaf8f5" height="172" rx="15" ry="15" stroke="#0a897e" stroke-width="2" width="205" x="664" y="195" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" x="766" y="247">x=3</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="766" y="300">9&lt;10</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="766" y="343">真</text><rect fill="#fff0f1" height="172" rx="15" ry="15" stroke="#c34655" stroke-width="2" width="205" x="951" y="195" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="700" text-anchor="middle" x="1053" y="247">x=4</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="1053" y="300">16&gt;10</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="1053" y="343">假</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="600" text-anchor="middle" x="600" y="449">∀x P(x) = 真 ∧ 真 ∧ 真 ∧ 假 = 假</text></svg>