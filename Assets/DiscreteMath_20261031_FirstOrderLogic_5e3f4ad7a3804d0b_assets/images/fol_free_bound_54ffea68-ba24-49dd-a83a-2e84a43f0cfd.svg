<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="495px" version="1.1" viewBox="0 0 1200 495" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="495" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">同名变元可以同时自由出现与约束出现</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="32" font-weight="700" text-anchor="middle" x="600" y="163">H(x,y) ∨ ∃x F(x) ∨ ∀y (G(y) → H(x,y))</text><rect fill="#fff0f1" height="195" rx="15" ry="15" stroke="#c34655" stroke-width="2" width="310" x="66" y="226" /><rect fill="#eaf8f5" height="195" rx="15" ry="15" stroke="#0a897e" stroke-width="2" width="310" x="405" y="226" /><rect fill="#f2f7fc" height="195" rx="15" ry="15" stroke="#2865bd" stroke-width="2" width="389" x="746" y="226" /><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="start" x="88" y="281">第一部分 H(x,y)</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="start" x="88" y="343">x、y 自由出现</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="600" text-anchor="start" x="430" y="281">第二部分 ∃xF(x)</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="start" x="430" y="343">x 受 ∃x 约束</text><text fill="#2865bd" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="start" x="766" y="279">第三部分 ∀y(…)</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="start" x="766" y="327">y 受 ∀y 约束</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="start" x="766" y="375">H 中的 x 仍自由</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" x="52" y="470">是否自由要逐次看出现位置，不能只看变量名。</text></svg>