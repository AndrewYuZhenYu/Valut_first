<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 1200 500" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="500" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">解释给非逻辑符号赋予具体意义</text><rect fill="#eaf8f5" height="335" rx="15" ry="15" stroke="#0a897e" stroke-width="2" width="505" x="65" y="110" /><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="600" text-anchor="start" x="85" y="163">解释 I₁：自然数</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="400" text-anchor="start" x="87" y="228">a=2，b=4，f=加法</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="400" text-anchor="start" x="87" y="274">F 表示等于</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="33" font-weight="700" text-anchor="start" x="87" y="346">2+2=4  → 真</text><rect fill="#fff0f1" height="335" rx="15" ry="15" stroke="#c34655" stroke-width="2" width="505" x="645" y="110" /><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="600" text-anchor="start" x="665" y="163">解释 I₂：实数</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="400" text-anchor="start" x="667" y="228">a=3，b=5，f=减法</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="400" text-anchor="start" x="667" y="274">F 表示大于</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="33" font-weight="700" text-anchor="start" x="667" y="346">3−3&gt;5  → 假</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" x="52" y="475">同一个符号串 F(f(a,a),b)，因解释不同而具有不同真值。</text></svg>