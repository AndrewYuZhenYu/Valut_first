<svg baseProfile="full" height="510px" version="1.1" viewBox="0 0 1200 510" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="510" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">最小自然数：一个对象必须不大于所有对象</text><line stroke="#2865bd" stroke-width="4" x1="90" x2="1110" y1="270" y2="270" /><polygon fill="#2865bd" points="1110,270 1096.3596076470478,278.36299566289057 1096.3596076470478,261.63700433710943" /><line stroke="#13263b" stroke-width="3" x1="155" x2="155" y1="250" y2="290" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="155" y="328">0</text><line stroke="#13263b" stroke-width="3" x1="297" x2="297" y1="250" y2="290" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="297" y="328">1</text><line stroke="#13263b" stroke-width="3" x1="439" x2="439" y1="250" y2="290" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="439" y="328">2</text><line stroke="#13263b" stroke-width="3" x1="581" x2="581" y1="250" y2="290" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="581" y="328">3</text><line stroke="#13263b" stroke-width="3" x1="723" x2="723" y1="250" y2="290" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="723" y="328">4</text><line stroke="#13263b" stroke-width="3" x1="865" x2="865" y1="250" y2="290" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="865" y="328">5</text><line stroke="#13263b" stroke-width="3" x1="1007" x2="1007" y1="250" y2="290" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="400" text-anchor="middle" x="1007" y="328">6</text><circle cx="155" cy="270" fill="#eaf8f5" r="50" stroke="#0a897e" stroke-width="5" /><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="600" text-anchor="middle" x="155" y="199">最小元素 0</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="400" text-anchor="middle" x="625" y="405">对每个 y∈N，均有 0≤y</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" x="52" y="485">以 N={0,1,2,…} 为例；若自然数从 1 起算，最小元素改为 1。</text></svg>