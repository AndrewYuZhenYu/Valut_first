<svg baseProfile="full" height="490px" version="1.1" viewBox="0 0 1200 490" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="490" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">没有最大自然数：反例总可继续构造</text><circle cx="140" cy="260" fill="#f2f7fc" r="44" stroke="#2865bd" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="140" y="270">4</text><line stroke="#0a897e" stroke-width="4" x1="190" x2="305" y1="260" y2="260" /><polygon fill="#0a897e" points="305,260 291.35960764704794,268.36299566289057 291.35960764704794,251.63700433710946" /><circle cx="360" cy="260" fill="#f2f7fc" r="44" stroke="#2865bd" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="360" y="270">5</text><line stroke="#0a897e" stroke-width="4" x1="410" x2="525" y1="260" y2="260" /><polygon fill="#0a897e" points="525,260 511.35960764704794,268.36299566289057 511.35960764704794,251.63700433710946" /><circle cx="580" cy="260" fill="#f2f7fc" r="44" stroke="#2865bd" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="580" y="270">6</text><line stroke="#0a897e" stroke-width="4" x1="630" x2="745" y1="260" y2="260" /><polygon fill="#0a897e" points="745,260 731.3596076470479,268.36299566289057 731.3596076470479,251.63700433710946" /><circle cx="800" cy="260" fill="#f2f7fc" r="44" stroke="#2865bd" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="800" y="270">7</text><line stroke="#0a897e" stroke-width="4" x1="850" x2="965" y1="260" y2="260" /><polygon fill="#0a897e" points="965,260 951.3596076470479,268.36299566289057 951.3596076470479,251.63700433710946" /><circle cx="1020" cy="260" fill="#f2f7fc" r="44" stroke="#2865bd" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="1020" y="270">8</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="32" font-weight="400" text-anchor="middle" x="600" y="165">任意选一个 n，都能找到更大的 n+1</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="34" font-weight="600" text-anchor="middle" x="600" y="400">∀n∈N，∃m∈N，使 m&gt;n</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" x="52" y="465">不是“先找到一个万能最大的 n”，而是每个候选都能被反例推翻。</text></svg>