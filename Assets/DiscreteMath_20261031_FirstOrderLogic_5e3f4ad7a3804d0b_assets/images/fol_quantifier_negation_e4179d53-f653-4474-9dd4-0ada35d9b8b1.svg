<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="505px" version="1.1" viewBox="0 0 1200 505" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="505" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">否定全称量词：找到一位反例就够了</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" x="63" y="147">班级 5 名学生，P(x) 表示“成绩优秀”</text><circle cx="178" cy="266" fill="#eaf8f5" r="47" stroke="#0a897e" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="178" y="276">s1</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="178" y="343">优秀</text><circle cx="385" cy="266" fill="#eaf8f5" r="47" stroke="#0a897e" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="385" y="276">s2</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="385" y="343">优秀</text><circle cx="592" cy="266" fill="#eaf8f5" r="47" stroke="#0a897e" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="592" y="276">s3</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="592" y="343">优秀</text><circle cx="799" cy="266" fill="#fff0f1" r="47" stroke="#c34655" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="799" y="276">s4</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="799" y="343">不优秀</text><circle cx="1006" cy="266" fill="#eaf8f5" r="47" stroke="#0a897e" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="1006" y="276">s5</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="1006" y="343">优秀</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="36" font-weight="700" text-anchor="middle" x="600" y="425">¬∀xP(x)   ⇔   ∃x¬P(x)</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" x="52" y="480">“并非人人优秀”只需举出一位不优秀者，不等于“人人不优秀”。</text></svg>