<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="540px" version="1.1" viewBox="0 0 1200 540" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="540" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">全总论域中特性谓词的两种用法</text><rect fill="#eaf8f5" height="378" rx="15" ry="15" stroke="#0a897e" stroke-width="2" width="520" x="55" y="108" /><rect fill="#fff6e8" height="378" rx="15" ry="15" stroke="#c2761f" stroke-width="2" width="520" x="625" y="108" /><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="33" font-weight="600" text-anchor="start" x="80" y="165">∀x (M(x) → G(x))</text><text fill="#c2761f" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="33" font-weight="600" text-anchor="start" x="650" y="165">∃x (M(x) ∧ G(x))</text><circle cx="190" cy="250" fill="#ffffff" r="57" stroke="#0a897e" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="190" y="260">人 </text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="400" text-anchor="middle" x="190" y="336">人 / G真</text><circle cx="410" cy="250" fill="#ffffff" r="57" stroke="#4a6177" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="410" y="260">非人</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="400" text-anchor="middle" x="410" y="336">非人</text><circle cx="770" cy="250" fill="#ffffff" r="47" stroke="#0a897e" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="770" y="260">a</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="400" text-anchor="middle" x="770" y="336">人且 G真</text><circle cx="1010" cy="250" fill="#ffffff" r="47" stroke="#4a6177" stroke-width="3" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="1010" y="260">b</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="400" text-anchor="middle" x="1010" y="336">非人</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="400" text-anchor="middle" x="310" y="425">限制“谁必须满足 G”</text><text fill="#c2761f" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="400" text-anchor="middle" x="885" y="425">寻找“确实满足 G 的人”</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" x="52" y="515">全称以蕴含限制范围；存在以合取锁定见证对象。</text></svg>