<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="525px" version="1.1" viewBox="0 0 1200 525" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="525" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">嵌套量词的辖域是层层包围的</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="middle" x="600" y="163">∃x ( F(x) ∧ ∀y ( G(y) → H(x,y) ) )</text><rect fill="#f2f7fc" height="156" rx="15" ry="15" stroke="#2865bd" stroke-width="2" width="940" x="128" y="213" /><text fill="#2865bd" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="400" text-anchor="start" x="170" y="252">∃x 的辖域：包含整个括号</text><rect fill="#eaf8f5" height="57" rx="15" ry="15" stroke="#0a897e" stroke-width="2" width="510" x="480" y="285" /><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="400" text-anchor="start" x="495" y="326">∀y 的辖域：G(y) → H(x,y)</text><text fill="#2865bd" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="400" text-anchor="middle" x="600" y="432">x 在 F(x)、H(x,y) 中受外层 ∃x 约束</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="400" text-anchor="middle" x="600" y="473">y 在 G(y)、H(x,y) 中受内层 ∀y 约束</text></svg>