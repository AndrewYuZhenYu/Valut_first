<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 1200 500" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="500" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">命题重言式的代换实例仍然永真</text><rect fill="#f2f7fc" height="280" rx="15" ry="15" stroke="#2865bd" stroke-width="2" width="455" x="67" y="160" /><rect fill="#eaf8f5" height="280" rx="15" ry="15" stroke="#0a897e" stroke-width="2" width="460" x="680" y="160" /><text fill="#2865bd" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="600" text-anchor="middle" x="295" y="226">命题重言式</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="36" font-weight="700" text-anchor="middle" x="295" y="310">p → (q → p)</text><line stroke="#2865bd" stroke-width="3" x1="534" x2="663" y1="296" y2="296" /><polygon fill="#2865bd" points="663,296 649.3596076470479,304.36299566289057 649.3596076470479,287.63700433710943" /><text fill="#2865bd" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="595" y="257">代换</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="600" text-anchor="middle" x="910" y="226">一阶逻辑代换实例</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="600" text-anchor="middle" x="910" y="305">F(x) → (G(y) → F(x))</text><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="400" text-anchor="middle" x="910" y="372">对所有解释、赋值都真</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" x="52" y="475">这里只是替换命题变项，并未改变原命题形式的逻辑有效性。</text></svg>