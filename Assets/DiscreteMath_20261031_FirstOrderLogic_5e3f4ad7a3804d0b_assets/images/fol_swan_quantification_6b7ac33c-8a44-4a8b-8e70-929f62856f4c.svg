<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="570px" version="1.1" viewBox="0 0 1200 570" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="570" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">“有黑天鹅”并不等于“所有天鹅都黑”</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="600" text-anchor="middle" x="290" y="150">存在黑天鹅</text><circle cx="290" cy="315" fill="#f2f7fc" r="155" stroke="#2865bd" stroke-width="3" /><circle cx="220" cy="277" fill="#13263b" r="28" stroke="#13263b" stroke-width="2" /><circle cx="335" cy="260" fill="#ffffff" r="28" stroke="#13263b" stroke-width="2" /><circle cx="285" cy="370" fill="#ffffff" r="28" stroke="#13263b" stroke-width="2" /><text fill="#2865bd" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="400" text-anchor="middle" x="290" y="498">仅需至少一只</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="600" text-anchor="middle" x="880" y="150">所有天鹅黑色</text><circle cx="880" cy="315" fill="#f2f7fc" r="155" stroke="#2865bd" stroke-width="3" /><circle cx="810" cy="277" fill="#13263b" r="28" stroke="#13263b" stroke-width="2" /><circle cx="925" cy="260" fill="#13263b" r="28" stroke="#13263b" stroke-width="2" /><circle cx="875" cy="370" fill="#13263b" r="28" stroke="#13263b" stroke-width="2" /><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="400" text-anchor="middle" x="880" y="498">禁止出现白天鹅</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" x="52" y="545">每个大圆代表“天鹅”组成的集合；深色圆表示黑天鹅。</text></svg>