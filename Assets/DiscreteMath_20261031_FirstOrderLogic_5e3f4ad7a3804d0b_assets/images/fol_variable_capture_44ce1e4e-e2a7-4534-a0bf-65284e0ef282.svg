<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="515px" version="1.1" viewBox="0 0 1200 515" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="515" width="1200" x="0" y="0" /><line stroke="#d5e2ed" stroke-width="2" x1="45" x2="1155" y1="86" y2="86" /><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="700" text-anchor="start" x="50" y="57">换名与代入的不同：警惕变量捕获</text><rect fill="#eaf8f5" height="360" rx="15" ry="15" stroke="#0a897e" stroke-width="2" width="510" x="62" y="110" /><rect fill="#fff0f1" height="360" rx="15" ry="15" stroke="#c34655" stroke-width="2" width="510" x="625" y="110" /><text fill="#0a897e" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="700" text-anchor="start" x="90" y="167">安全换名</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="700" text-anchor="start" x="651" y="167">错误代入：变量捕获</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" x="88" y="247">∀x P(x) ⇔ ∀z P(z)</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="400" text-anchor="start" x="88" y="310">z 是新变量名，含义不变</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="400" text-anchor="start" x="650" y="247">∀y R(x,y)</text><text fill="#13263b" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="400" text-anchor="start" x="650" y="303">若直接把 x 换成 y：</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="700" text-anchor="start" x="650" y="359">∀y R(y,y)</text><text fill="#c34655" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="400" text-anchor="start" x="650" y="421">原先自由的 x 被 ∀y 捕获</text><text fill="#4a6177" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="400" text-anchor="start" x="52" y="490">变量代入时要检查“能否自由代入”，避免出现意外约束。</text></svg>