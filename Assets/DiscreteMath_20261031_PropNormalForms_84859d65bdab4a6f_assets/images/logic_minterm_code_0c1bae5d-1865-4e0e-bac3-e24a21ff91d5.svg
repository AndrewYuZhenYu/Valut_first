<svg baseProfile="full" height="590" version="1.1" viewBox="0 0 1120 590" width="1120" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#FBFCFE" height="590" width="1120" x="0" y="0" /><text fill="#183653" font-family="Noto Sans CJK SC" font-size="38" font-weight="700" x="46" y="61">极小项下标：把成真赋值读成二进制数</text><text fill="#53677D" font-family="Noto Sans CJK SC" font-size="22" font-weight="400" x="47" y="101">对应顺序固定为 (p,q,r)：1 写原变量，0 写否定变量</text><line stroke="#D4DFE7" stroke-width="2" x1="46" x2="1074" y1="121" y2="121" /><rect fill="#DFF0FA" height="93" rx="13" ry="13" stroke="#3779B7" stroke-width="2" width="161" x="132" y="182" /><text fill="#3779B7" font-family="Noto Sans CJK SC" font-size="47" font-weight="700" text-anchor="middle" x="212" y="239">1</text><text fill="#21364F" font-family="Noto Sans CJK SC" font-size="37" font-weight="700" text-anchor="middle" x="212" y="317">p</text><rect fill="#FCE8E9" height="93" rx="13" ry="13" stroke="#CE5268" stroke-width="2" width="161" x="392" y="182" /><text fill="#CE5268" font-family="Noto Sans CJK SC" font-size="47" font-weight="700" text-anchor="middle" x="472" y="239">0</text><text fill="#21364F" font-family="Noto Sans CJK SC" font-size="37" font-weight="700" text-anchor="middle" x="472" y="317">¬q</text><rect fill="#DFF0FA" height="93" rx="13" ry="13" stroke="#3779B7" stroke-width="2" width="161" x="652" y="182" /><text fill="#3779B7" font-family="Noto Sans CJK SC" font-size="47" font-weight="700" text-anchor="middle" x="732" y="239">1</text><text fill="#21364F" font-family="Noto Sans CJK SC" font-size="37" font-weight="700" text-anchor="middle" x="732" y="317">r</text><text fill="#0F9C9D" font-family="Noto Sans CJK SC" font-size="31" font-weight="700" text-anchor="middle" x="530" y="382">1 0 1 (二进制) = 5 (十进制)</text><line stroke="#D4DFE7" stroke-linecap="round" stroke-width="2" x1="135" x2="900" y1="405" y2="405" /><text fill="#3779B7" font-family="Noto Sans CJK SC" font-size="39" font-weight="700" text-anchor="middle" x="540" y="460">m₅ = p∧¬q∧r</text><text fill="#53677D" font-family="Noto Sans CJK SC" font-size="23" font-weight="400" x="50" y="550">m₅ 只在 (p,q,r)=(1,0,1) 时取 1。</text></svg>