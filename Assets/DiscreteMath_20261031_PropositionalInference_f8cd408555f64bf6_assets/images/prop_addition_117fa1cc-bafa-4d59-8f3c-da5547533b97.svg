<svg baseProfile="full" height="535px" version="1.1" viewBox="0 0 1200 535" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="535" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">附加规则：引入一个可选分支</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><circle cx="260" cy="315" fill="#E7F6F3" r="78" stroke="#098479" stroke-width="3" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="36" font-weight="bold" text-anchor="middle" x="260" y="326.88">A</text><circle cx="915" cy="315" fill="#F2F7FC" r="96" stroke="#2860AD" stroke-width="3" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="37" font-weight="bold" text-anchor="middle" x="915" y="327.21">A∨B</text><line stroke="#2860AD" stroke-width="5" x1="345" x2="810" y1="315" y2="315" /><polygon fill="#2860AD" points="810,315 797.2121321691075,322.8403084339599 797.2121321691075,307.1596915660401" /><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="normal" text-anchor="middle" x="260" y="445">已知</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="normal" text-anchor="middle" x="915" y="445">加入 B 作为可选</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="53" y="513">这是对公式变量 A、B、C 的任意合式公式代入都有效的推理形式。</text></svg>