<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 1200 480" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="480" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">肯定后件谬误：箭头并不能沿反方向任意走</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="600" y="146">证明中“从条件得到结论”不等于可以反过来推</text><rect fill="#E7F6F3" height="236" rx="13" ry="13" stroke="#098479" stroke-width="2" width="475" x="85" y="193" /><rect fill="#FFF0F0" height="236" rx="13" ry="13" stroke="#C24959" stroke-width="2" width="495" x="625" y="193" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="31" font-weight="bold" text-anchor="middle" x="322" y="242">可推出</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="bold" text-anchor="middle" x="322" y="316">A→B, A  ⟹  B</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="31" font-weight="bold" text-anchor="middle" x="875" y="242">禁止跳步</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="bold" text-anchor="middle" x="875" y="316">A→B, B  ⟹  A ？</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="875" y="385">例如 A=假、B=真</text><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="322" y="385">前提使后件必真</text></svg>