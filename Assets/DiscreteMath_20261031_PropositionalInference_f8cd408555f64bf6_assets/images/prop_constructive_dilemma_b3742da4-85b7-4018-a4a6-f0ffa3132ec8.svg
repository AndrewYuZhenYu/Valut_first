ont-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="middle" x="600" y="266">A∨C</text><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="middle" x="600" y="433">B∨D</text><line stroke="#098479" stroke-width="4" x1="320" x2="480" y1="435" y2="435" /><polygon fill="#098479" points="480,435 467.2121321691074,442.8403084339599 467.2121321691074,427.1596915660401" /><line stroke="#098479" stroke-width="4" x1="883" x2="722" y1="435" y2="435" /><polygon fill="#098479" points="722,435 734.7878678308925,427.1596915660401 734.7878678308925,442.8403084339599" /><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="normal" text-anchor="middle" x="600" y="495">不必知道究竟走哪条分支，至少一个结果成立</text></svg>