<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="465px" version="1.1" viewBox="0 0 1200 465" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="465" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">反例搜索的通用解题机制</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="145">错误推理先找一行反例，比硬算完整真值表更快</text><rect fill="#F2F7FC" height="170" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="330" x="80" y="220" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" x="245" y="272">结论为假</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" x="245" y="341">B = 0</text><line stroke="#098479" stroke-width="4" x1="417" x2="445" y1="302" y2="302" /><polygon fill="#098479" points="445,302 432.2121321691074,309.8403084339599 432.2121321691074,294.1596915660401" /><rect fill="#F2F7FC" height="170" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="330" x="452" y="220" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" x="617" y="272">前提都真</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" x="617" y="341">A₁=1,…,Aₙ=1</text><line stroke="#098479" stroke-width="4" x1="789" x2="817" y1="302" y2="302" /><polygon fill="#098479" points="817,302 804.2121321691075,309.8403084339599 804.2121321691075,294.1596915660401" /><rect fill="#FFF0F0" height="170" rx="13" ry="13" stroke="#C24959" stroke-width="2" width="330" x="824" y="220" /><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" x="989" y="272">如果能够同时实现</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="bold" text-anchor="middle" x="989" y="341">反例成立 → 推理无效</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="53" y="443">这套逆向筛选特别适合存在多个命题变项而结论较短的题。</text></svg>