<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="575px" version="1.1" viewBox="0 0 1200 575" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="575" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">四变量反例：从结论为假逆向限定取值</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><rect fill="#F2F7FC" height="146" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="495" x="70" y="128" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" x="90" y="164">结论为假</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="90" y="213">p₂∨p₄=0</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="normal" text-anchor="start" x="90" y="253">p₂=0, p₄=0</text><rect fill="#F2F7FC" height="146" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="495" x="628" y="128" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" x="648" y="164">检查前提 1</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="648" y="213">¬p₁∨p₂=1</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="normal" text-anchor="start" x="648" y="253">p₁=0</text><rect fill="#F2F7FC" height="146" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="495" x="70" y="310" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" x="90" y="346">检查前提 4</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="90" y="395">p₃→p₄=1</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="normal" text-anchor="start" x="90" y="435">p₃=0</text><rect fill="#E7F6F3" height="146" rx="13" ry="13" stroke="#098479" stroke-width="2" width="495" x="628" y="310" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="bold" text-anchor="start" x="648" y="346">其余前提</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="648" y="395">0→(0∧0), 0→0</text><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="normal" text-anchor="start" x="648" y="435">全部为真</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="bold" text-anchor="middle" x="600" y="530">得到反例 (p₁,p₂,p₃,p₄)=(0,0,0,0)</text></svg>