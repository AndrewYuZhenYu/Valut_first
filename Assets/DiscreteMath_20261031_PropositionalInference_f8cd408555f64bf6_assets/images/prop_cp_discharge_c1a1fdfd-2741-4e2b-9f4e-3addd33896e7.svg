<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="510px" version="1.1" viewBox="0 0 1200 510" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="510" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">附加前提必须解除：不能把临时假设带出作用范围</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><rect fill="#F2F7FC" height="360" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1030" x="85" y="130" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="bold" text-anchor="middle" x="600" y="174">临时假设不等于增加永久前提</text><rect fill="#E7F6F3" height="204" rx="13" ry="13" stroke="#098479" stroke-width="3" width="880" x="160" y="221" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="start" x="190" y="273">假设 B —— 仅在内部子证明有效</text><line stroke="#098479" stroke-width="4" x1="367" x2="367" y1="300" y2="355" /><polygon fill="#098479" points="367,355 359.1596915660401,342.2121321691074 374.8403084339599,342.2121321691074" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" x="405" y="364">推出 C</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="600" y="465">消去假设 B，外部可得 B→C，不可直接得到 B</text></svg>