<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="535px" version="1.1" viewBox="0 0 1200 535" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="535" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">附加前提 CP：证明蕴含式时开启并解除临时假设</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><rect fill="#F2F7FC" height="360" rx="13" ry="13" stroke="#2860AD" stroke-width="2" width="1020" x="90" y="128" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="600" y="161">欲证 Γ ⊢ B→C</text><rect fill="#E7F6F3" height="217" rx="13" ry="13" stroke="#098479" stroke-width="3" width="785" x="205" y="215" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="bold" text-anchor="start" x="240" y="261">临时假设 B</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="600" y="330">在 Γ 与 B 下推导出 C</text><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="240" y="397">退出临时假设范围，得到 B→C</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="53" y="513">CP 中的假设 B 不能在离开子证明后当成无条件前提使用。</text></svg>