<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 1200 520" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="520" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">具体命题可能因额外事实成立，但错误的推理形式仍无效</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="143">星期日 → 次日星期一 的具体世界知识 vs 抽象推理形式</text><rect fill="#E7F6F3" height="257" rx="13" ry="13" stroke="#098479" stroke-width="2" width="510" x="78" y="189" /><rect fill="#FFF0F0" height="257" rx="13" ry="13" stroke="#C24959" stroke-width="2" width="505" x="620" y="189" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="332" y="241">现实日历知识</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="normal" text-anchor="middle" x="332" y="305">日期规律可能</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="normal" text-anchor="middle" x="332" y="353">限制 p、q 的可出现组合</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="870" y="241">纯命题形式</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle" x="870" y="305">p→q, ¬p ⊬ ¬q</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="normal" text-anchor="middle" x="870" y="355">(p,q)=(0,1) 是反例</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="53" y="498">形式有效性按所有命题变项赋值判断，不额外塞入未列出的日历约束。</text></svg>