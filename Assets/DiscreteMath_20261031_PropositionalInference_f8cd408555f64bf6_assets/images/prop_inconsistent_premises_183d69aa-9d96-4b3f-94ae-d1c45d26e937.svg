<svg baseProfile="full" height="510px" version="1.1" viewBox="0 0 1200 510" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="510" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">矛盾前提：有效性定义中的“空真”现象</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="148">前提不可同时为真时：不存在“前提真、结论假”的反例</text><rect fill="#FFF0F0" height="165" rx="13" ry="13" stroke="#C24959" stroke-width="2" width="245" x="145" y="214" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle" x="267" y="263">p=0, q=0</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="267" y="325">p∧¬p = 0</text><rect fill="#FFF0F0" height="165" rx="13" ry="13" stroke="#C24959" stroke-width="2" width="245" x="420" y="214" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle" x="542" y="263">p=0, q=1</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="542" y="325">p∧¬p = 0</text><rect fill="#FFF0F0" height="165" rx="13" ry="13" stroke="#C24959" stroke-width="2" width="245" x="695" y="214" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle" x="817" y="263">p=1, q=0</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="817" y="325">p∧¬p = 0</text><rect fill="#FFF0F0" height="165" rx="13" ry="13" stroke="#C24959" stroke-width="2" width="245" x="970" y="214" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle" x="1092" y="263">p=1, q=1</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="1092" y="325">p∧¬p = 0</text><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="bold" text-anchor="middle" x="600" y="455">从矛盾前提在经典语义下可推出任意 B（形式有效）</text></svg>