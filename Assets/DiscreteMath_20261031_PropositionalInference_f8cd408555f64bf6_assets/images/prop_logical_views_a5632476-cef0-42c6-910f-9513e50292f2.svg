<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="570px" version="1.1" viewBox="0 0 1200 570" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="570" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">语义、公式与证明三重视角的互相对应</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="142">同一个推理可以用不同层次的工具检验</text><rect fill="#F2F7FC" height="91" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1048" x="78" y="178" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="112" y="232">语义视角</text><line stroke="#098479" stroke-width="4" x1="315" x2="383" y1="223" y2="223" /><polygon fill="#098479" points="383,223 370.2121321691074,230.84030843395988 370.2121321691074,215.15969156604012" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="411" y="232">寻找前提真结论假的赋值</text><line stroke="#098479" stroke-width="4" x1="844" x2="892" y1="223" y2="223" /><polygon fill="#098479" points="892,223 879.2121321691075,230.84030843395988 879.2121321691075,215.15969156604012" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" x="910" y="232">无反例则有效</text><rect fill="#F2F7FC" height="91" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1048" x="78" y="293" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="112" y="347">公式视角</text><line stroke="#098479" stroke-width="4" x1="315" x2="383" y1="338" y2="338" /><polygon fill="#098479" points="383,338 370.2121321691074,345.8403084339599 370.2121321691074,330.1596915660401" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="411" y="347">把 (∧前提)→结论化简</text><line stroke="#098479" stroke-width="4" x1="844" x2="892" y1="338" y2="338" /><polygon fill="#098479" points="892,338 879.2121321691075,345.8403084339599 879.2121321691075,330.1596915660401" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" x="910" y="347">重言式则有效</text><rect fill="#E7F6F3" height="91" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1048" x="78" y="408" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="112" y="462">证明视角</text><line stroke="#098479" stroke-width="4" x1="315" x2="383" y1="453" y2="453" /><polygon fill="#098479" points="383,453 370.2121321691074,460.8403084339599 370.2121321691074,445.1596915660401" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="411" y="462">列出有依据的公式序列</text><line stroke="#098479" stroke-width="4" x1="844" x2="892" y1="453" y2="453" /><polygon fill="#098479" points="892,453 879.2121321691075,460.8403084339599 879.2121321691075,445.1596915660401" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="21" font-weight="bold" text-anchor="start" x="910" y="462">末行得到结论</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="53" y="548">关键是清楚每种方法“凭什么成立”，而不是机械记下最后一步。</text></svg>