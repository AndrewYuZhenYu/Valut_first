<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="530px" version="1.1" viewBox="0 0 1200 530" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="530" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">假言推理通过前提筛选只留下 q 真</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><rect fill="#F2F7FC" height="155" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="225" x="70" y="210" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" x="180" y="253">p=0, q=0</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="180" y="314">排除</text><rect fill="#F2F7FC" height="155" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="225" x="363" y="210" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" x="473" y="253">p=0, q=1</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="473" y="314">排除</text><rect fill="#F2F7FC" height="155" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="225" x="656" y="210" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" x="766" y="253">p=1, q=0</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="766" y="314">排除</text><rect fill="#E7F6F3" height="155" rx="13" ry="13" stroke="#098479" stroke-width="2" width="225" x="949" y="210" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" x="1059" y="253">p=1, q=1</text><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="1059" y="314">可满足两前提</text><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="454">p→q 与 p 同时为真仅在 (1,1)：因此 q 必真。</text></svg>