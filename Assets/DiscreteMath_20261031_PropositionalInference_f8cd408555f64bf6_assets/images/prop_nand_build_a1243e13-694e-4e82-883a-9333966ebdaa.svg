<svg baseProfile="full" height="555px" version="1.1" viewBox="0 0 1200 555" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="555" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">用一个 NAND 运算逐层构造非、与、或</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><rect fill="#F2F7FC" height="95" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1050" x="65" y="136" /><rect fill="#E7F6F3" height="62" rx="13" ry="13" stroke="#098479" stroke-width="2" width="130" x="88" y="153" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="153" y="193">非</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="normal" text-anchor="start" x="276" y="193">p ↑ p</text><line stroke="#2860AD" stroke-width="4" x1="714" x2="798" y1="186" y2="186" /><polygon fill="#2860AD" points="798,186 785.2121321691075,193.84030843395988 785.2121321691075,178.15969156604012" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" x="825" y="193">¬p</text><rect fill="#F2F7FC" height="95" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1050" x="65" y="256" /><rect fill="#E7F6F3" height="62" rx="13" ry="13" stroke="#098479" stroke-width="2" width="130" x="88" y="273" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="153" y="313">与</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="normal" text-anchor="start" x="276" y="313">(p↑q) ↑ (p↑q)</text><line stroke="#2860AD" stroke-width="4" x1="714" x2="798" y1="306" y2="306" /><polygon fill="#2860AD" points="798,306 785.2121321691075,313.8403084339599 785.2121321691075,298.1596915660401" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" x="825" y="313">p∧q</text><rect fill="#F2F7FC" height="95" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1050" x="65" y="376" /><rect fill="#E7F6F3" height="62" rx="13" ry="13" stroke="#098479" stroke-width="2" width="130" x="88" y="393" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="153" y="433">或</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="normal" text-anchor="start" x="276" y="433">(p↑p) ↑ (q↑q)</text><line stroke="#2860AD" stroke-width="4" x1="714" x2="798" y1="426" y2="426" /><polygon fill="#2860AD" points="798,426 785.2121321691075,433.8403084339599 785.2121321691075,418.1596915660401" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" x="825" y="433">p∨q</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="53" y="533">利用 ↑ 的反复复合可以得到 ¬、∧、∨，再表示其余联结词。</text></svg>