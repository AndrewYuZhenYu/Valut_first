<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="565px" version="1.1" viewBox="0 0 1200 565" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="565" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">P 规则、T 规则和后续规则形成可追踪的证明序列</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="bold" text-anchor="middle" x="600" y="139">演绎序列中每行公式都要有来源</text><rect fill="#F2F7FC" height="68" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="980" x="110" y="170" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="153" y="215">1</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="33" font-weight="bold" text-anchor="start" x="350" y="214">A→B</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="720" y="214">P：前提引入</text><rect fill="#F2F7FC" height="68" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="980" x="110" y="255" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="153" y="300">2</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="33" font-weight="bold" text-anchor="start" x="350" y="299">A</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="720" y="299">P：前提引入</text><rect fill="#E7F6F3" height="68" rx="13" ry="13" stroke="#098479" stroke-width="2" width="980" x="110" y="340" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="153" y="385">3</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="33" font-weight="bold" text-anchor="start" x="350" y="384">B</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="720" y="384">1,2：假言推理</text><rect fill="#E7F6F3" height="68" rx="13" ry="13" stroke="#098479" stroke-width="2" width="980" x="110" y="425" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="start" x="153" y="470">4</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="33" font-weight="bold" text-anchor="start" x="350" y="469">B∨C</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="25" font-weight="normal" text-anchor="start" x="720" y="469">3：附加规则</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="53" y="543">T 规则可把已经获得的中间结果继续作为后续推导的依据。</text></svg>