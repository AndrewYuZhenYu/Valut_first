<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 1200 520" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="520" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">可证明关系与语义有效关系的联系和差别</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="31" font-weight="bold" text-anchor="middle" x="600" y="142">Γ ⊢ B：存在一份每一步有依据的形式证明</text><rect fill="#F2F7FC" height="266" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1045" x="75" y="185" /><circle cx="210" cy="300" fill="#FFFFFF" r="53" stroke="#098479" stroke-width="3" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="210" y="309.24">1</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="bold" text-anchor="middle" x="210" y="398">前提集合 Γ</text><line stroke="#2860AD" stroke-width="4" x1="278" x2="508" y1="300" y2="300" /><polygon fill="#2860AD" points="508,300 495.2121321691074,307.8403084339599 495.2121321691074,292.1596915660401" /><circle cx="590" cy="300" fill="#FFFFFF" r="53" stroke="#098479" stroke-width="3" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="590" y="309.24">2</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="bold" text-anchor="middle" x="590" y="398">按 P / T / 置换及推理规则演算</text><line stroke="#2860AD" stroke-width="4" x1="658" x2="888" y1="300" y2="300" /><polygon fill="#2860AD" points="888,300 875.2121321691075,307.8403084339599 875.2121321691075,292.1596915660401" /><circle cx="970" cy="300" fill="#E7F6F3" r="53" stroke="#098479" stroke-width="3" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="970" y="309.24">3</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="bold" text-anchor="middle" x="970" y="398">最后一行得到 B</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="53" y="498">“可以证明”是形式的概念；“对所有赋值有效”是语义的概念。</text></svg>