<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="550px" version="1.1" viewBox="0 0 1200 550" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="550" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">反证法把“可能的反例集合”压缩成空集</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><rect fill="#F2F7FC" height="315" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1005" x="80" y="125" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="bold" text-anchor="middle" x="600" y="165">反证：若前提真且结论假可能，则找到反例</text><circle cx="360" cy="297" fill="#FFF0F0" r="106" stroke="#C24959" stroke-width="4" /><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="360" y="288">Γ 真</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="bold" text-anchor="middle" x="360" y="325">¬B 真</text><line stroke="#C24959" stroke-width="7" x1="485" x2="600" y1="225" y2="373" /><line stroke="#C24959" stroke-width="7" x1="600" x2="485" y1="225" y2="373" /><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="40" font-weight="bold" text-anchor="middle" x="810" y="296">矛盾  ⊥</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="middle" x="810" y="342">反例无法存在</text><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="497">Γ∧¬B 是矛盾式    ⇔    Γ→B 是重言式</text></svg>