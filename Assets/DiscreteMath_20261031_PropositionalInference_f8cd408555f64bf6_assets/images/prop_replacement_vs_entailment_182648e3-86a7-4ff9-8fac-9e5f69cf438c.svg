<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 1200 520" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="520" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">等值规则可以双向替换，推理规则不可任意逆用</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="32" font-weight="bold" text-anchor="middle" x="600" y="140">等值置换 vs 单向推出</text><rect fill="#E7F6F3" height="285" rx="13" ry="13" stroke="#098479" stroke-width="2" width="516" x="62" y="180" /><rect fill="#FFF0F0" height="285" rx="13" ry="13" stroke="#C24959" stroke-width="2" width="515" x="625" y="180" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="321" y="242">A ↔ B（等值）</text><line stroke="#098479" stroke-width="4" x1="220" x2="420" y1="326" y2="326" /><polygon fill="#098479" points="420,326 407.2121321691074,333.8403084339599 407.2121321691074,318.1596915660401" /><line stroke="#098479" stroke-width="4" x1="420" x2="220" y1="358" y2="358" /><polygon fill="#098479" points="220,358 232.7878678308926,350.1596915660401 232.7878678308926,365.8403084339599" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="normal" text-anchor="middle" x="320" y="412">可以在子公式处双向置换</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="884" y="242">A ⇒ B（单向）</text><line stroke="#C24959" stroke-width="4" x1="775" x2="990" y1="342" y2="342" /><polygon fill="#C24959" points="990,342 977.2121321691075,349.8403084339599 977.2121321691075,334.1596915660401" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="normal" text-anchor="middle" x="884" y="412">不能随意把 B 换回 A</text></svg>