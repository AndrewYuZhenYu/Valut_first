<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="550px" version="1.1" viewBox="0 0 1200 550" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="550" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">语义有效性：前提模型集合被结论集合包含</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="142">同一个赋值空间内，前提共同成真区必须落在结论成真区</text><circle cx="600" cy="332" fill="#F2F7FC" r="174" stroke="#2860AD" stroke-width="4" /><circle cx="600" cy="332" fill="#E7F6F3" r="120" stroke="#098479" stroke-width="4" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="600" y="317">A₁∧…∧Aₙ</text><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="middle" x="600" y="365">成真区</text><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="normal" text-anchor="start" x="782" y="256">B 的成真区</text><line stroke="#2860AD" stroke-width="4" x1="791" x2="746" y1="263" y2="287" /><polygon fill="#2860AD" points="746,287 753.5938558818652,274.0642606378506 760.9729697020629,287.90009905072105" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" x="600" y="509">Γ ⊨ B    等价于    满足 Γ 的每个赋值也满足 B</text></svg>