<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="525px" version="1.1" viewBox="0 0 1200 525" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="525" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">直接证明、CP、反证与双向证明如何选用</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><rect fill="#F2F7FC" height="360" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1050" x="70" y="118" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="29" font-weight="bold" text-anchor="middle" x="600" y="164">先观察结论的外层结构，再选证明策略</text><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" x="115" y="233">原子 B</text><line stroke="#098479" stroke-width="3" x1="440" x2="518" y1="222" y2="222" /><polygon fill="#098479" points="518,222 505.2121321691074,229.84030843395988 505.2121321691074,214.15969156604012" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="550" y="233">从前提链式推导</text><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" x="115" y="301">B→C</text><line stroke="#098479" stroke-width="3" x1="440" x2="518" y1="290" y2="290" /><polygon fill="#098479" points="518,290 505.2121321691074,297.8403084339599 505.2121321691074,282.1596915660401" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="550" y="301">CP：暂假设 B，证明 C</text><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" x="115" y="369">¬B / 矛盾较容易</text><line stroke="#098479" stroke-width="3" x1="440" x2="518" y1="358" y2="358" /><polygon fill="#098479" points="518,358 505.2121321691074,365.8403084339599 505.2121321691074,350.1596915660401" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="550" y="369">反证：暂假设 B</text><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="bold" text-anchor="start" x="115" y="437">A↔B</text><line stroke="#098479" stroke-width="3" x1="440" x2="518" y1="426" y2="426" /><polygon fill="#098479" points="518,426 505.2121321691074,433.8403084339599 505.2121321691074,418.1596915660401" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="550" y="437">分证 A→B 与 B→A</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="53" y="503">这只是常用启发式；具体题目仍可以有多种正确证明路线。</text></svg>