<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="510px" version="1.1" viewBox="0 0 1200 510" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="510" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">三种方法回答相同问题，但产物不同</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><rect fill="#F2F7FC" height="274" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="325" x="70" y="170" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="232" y="224">真值表法</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="normal" text-anchor="middle" x="232" y="308">逐行枚举所有赋值</text><line stroke="#098479" stroke-width="4" x1="232" x2="232" y1="330" y2="373" /><polygon fill="#098479" points="232,373 224.15969156604012,360.2121321691074 239.84030843395988,360.2121321691074" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="232" y="408">没有反例</text><rect fill="#F2F7FC" height="274" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="325" x="445" y="170" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="607" y="224">等值演算法</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="normal" text-anchor="middle" x="607" y="308">推理蕴含式化简</text><line stroke="#098479" stroke-width="4" x1="607" x2="607" y1="330" y2="373" /><polygon fill="#098479" points="607,373 599.1596915660401,360.2121321691074 614.8403084339599,360.2121321691074" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="607" y="408">等值于 1</text><rect fill="#F2F7FC" height="274" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="325" x="820" y="170" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="982" y="224">演绎证明法</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="23" font-weight="normal" text-anchor="middle" x="982" y="308">前提 → 中间式 → 结论</text><line stroke="#098479" stroke-width="4" x1="982" x2="982" y1="330" y2="373" /><polygon fill="#098479" points="982,373 974.1596915660401,360.2121321691074 989.8403084339599,360.2121321691074" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="24" font-weight="bold" text-anchor="middle" x="982" y="408">最后一行得到 B</text><text fill="#53687A" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="22" font-weight="normal" text-anchor="start" x="53" y="488">前两种强调检验有效性；第三种强调给出逐步证明。</text></svg>