<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 1200 560" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="560" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">有效推理：尝试构造反例却发生冲突</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="30" font-weight="bold" text-anchor="middle" x="600" y="150">p₁→(p₂→p₃), p₂  ⊨  p₁→p₃</text><rect fill="#F2F7FC" height="82" rx="13" ry="13" stroke="#2860AD" stroke-width="2" width="1040" x="70" y="211" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="265">要让结论 p₁→p₃ 为假，必须 p₁=1 且 p₃=0</text><line stroke="#2860AD" stroke-width="4" x1="600" x2="600" y1="295" y2="348" /><polygon fill="#2860AD" points="600,348 592.1596915660401,335.2121321691074 607.8403084339599,335.2121321691074" /><rect fill="#E7F6F3" height="85" rx="13" ry="13" stroke="#098479" stroke-width="2" width="834" x="183" y="358" /><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="412">再由前提 p₂=1，得 (p₁,p₂,p₃)=(1,1,0)</text><text fill="#C24959" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" x="600" y="502">代回第一前提得到假 → 候选反例不成立 → 推理有效</text></svg>