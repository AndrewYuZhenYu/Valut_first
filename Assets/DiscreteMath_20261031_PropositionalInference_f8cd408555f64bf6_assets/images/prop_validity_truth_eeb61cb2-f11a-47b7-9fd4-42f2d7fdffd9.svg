<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="540px" version="1.1" viewBox="0 0 1200 540" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="540" width="1200" x="0" y="0" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="35" font-weight="bold" text-anchor="start" x="45" y="56">有效性保证“保真”，不保证前提已在现实中成立</text><line stroke="#C4D3E0" stroke-width="2" x1="45" x2="1155" y1="83" y2="83" /><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="28" font-weight="bold" text-anchor="middle" x="600" y="142">形式有效与现实前提是否为真是两个问题</text><rect fill="#F2F7FC" height="250" rx="13" ry="13" stroke="#C4D3E0" stroke-width="2" width="1035" x="82" y="182" /><text fill="#2860AD" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="31" font-weight="bold" text-anchor="start" x="145" y="248">推理形式：p→q，p ⊢ q</text><text fill="#162B40" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="26" font-weight="normal" text-anchor="start" x="145" y="327">形式有效不等于“已经确证 p 是真实事实”</text><text fill="#098479" font-family="Noto Sans CJK SC,DejaVu Sans" font-size="27" font-weight="bold" text-anchor="middle" x="600" y="498">只有形式有效 + 实际前提都真，才能保证实际结论真</text></svg>