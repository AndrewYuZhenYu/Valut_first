   <g id="text_2">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #c0463d" x="213.84" y="120.405784" transform="rotate(-0 213.84 120.405784)">错误：∀y R(x,y)</text>
