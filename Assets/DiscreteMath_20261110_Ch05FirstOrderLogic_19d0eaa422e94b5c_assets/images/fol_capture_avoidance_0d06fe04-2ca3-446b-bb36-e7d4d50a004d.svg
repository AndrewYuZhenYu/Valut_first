   <g id="text_7">
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #233247" x="396" y="260.81208" transform="rotate(-0 396 260.81208)">正确式保留 y 的自由出现，同时让 z 保持局部约束。</text>
