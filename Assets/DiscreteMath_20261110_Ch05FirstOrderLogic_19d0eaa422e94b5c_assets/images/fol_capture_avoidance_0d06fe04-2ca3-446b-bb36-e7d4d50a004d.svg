    <text style="font-weight: 700; font-size: 24px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #233247" x="53.5392" y="41.241705" transform="rotate(-0 53.5392 41.241705)">自由代入前，先防止变量捕获</text>
