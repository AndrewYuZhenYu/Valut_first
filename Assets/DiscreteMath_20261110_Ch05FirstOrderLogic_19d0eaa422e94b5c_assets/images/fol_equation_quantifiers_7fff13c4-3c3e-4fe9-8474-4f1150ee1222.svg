   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #233247" x="58.4064" y="41.01285" transform="rotate(-0 58.4064 41.01285)">在关系 x+y=0 中，量词顺序决定真值</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17847e" x="233.28" y="123.519516" transform="rotate(-0 233.28 123.519516)">∀x∃y (x+y=0)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 21px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #c0463d" x="630.72" y="123.519516" transform="rotate(-0 630.72 123.519516)">∃y∀x (x+y=0)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #233247" x="233.28" y="156.741075" transform="rotate(-0 233.28 156.741075)">x=-2    →    y=2</text>
   </g>
   <g id="text_5">
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #233247" x="233.28" y="188.460675" transform="rotate(-0 233.28 188.460675)">x=0    →    y=0</text>
   </g>
   <g id="text_6">
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #233247" x="233.28" y="220.180275" transform="rotate(-0 233.28 220.180275)">x=3    →    y=-3</text>
   </g>
   <g id="text_7">
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #233247" x="630.72" y="168.7536" transform="rotate(-0 630.72 168.7536)">一个固定的 y 不可能</text>
   </g>
   <g id="text_8">
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #233247" x="630.72" y="211.619475" transform="rotate(-0 630.72 211.619475)">同时抵消所有实数 x</text>
   </g>
   <g id="text_9">
    <text style="font-size: 18px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17847e" x="233.28" y="263.884275" transform="rotate(-0 233.28 263.884275)">真：y 可取 −x</text>
   </g>
   <g id="text_10">
