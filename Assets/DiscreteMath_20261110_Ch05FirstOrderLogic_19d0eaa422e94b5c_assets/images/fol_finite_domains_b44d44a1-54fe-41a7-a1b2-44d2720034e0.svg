   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #233247" x="58.4064" y="40.497225" transform="rotate(-0 58.4064 40.497225)">有限论域：全称是“全都满足”，存在是“至少一个满足”</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 19px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #1c689f" x="233.28" y="120.1799" transform="rotate(-0 233.28 120.1799)">∀x P(x)  ↔  全部为真</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 19px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17847e" x="630.72" y="120.151697" transform="rotate(-0 630.72 120.151697)">∃x P(x)  ↔  至少一个为真</text>
   </g>
   <g id="text_4">
    <text style="font-size: 17px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #233247" x="233.28" y="222.870437" transform="rotate(-0 233.28 222.870437)">真 ∧ 真 ∧ 假 ∧ 真 = 假</text>
   </g>
   <g id="text_5">
    <text style="font-size: 17px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #233247" x="630.72" y="222.870437" transform="rotate(-0 630.72 222.870437)">假 ∨ 假 ∨ 真 ∨ 假 = 真</text>
   </g>
  </g>
