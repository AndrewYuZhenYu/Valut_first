   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #233247" x="53.5392" y="39.752745" transform="rotate(-0 53.5392 39.752745)">全称条件与存在条件：为什么一个用“→”，一个用“∧”</text>
