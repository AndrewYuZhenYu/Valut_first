   <g id="text_2">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #1c689f" x="213.84" y="114.93416" transform="rotate(-0 213.84 114.93416)">∀x (M(x) → G(x))</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 20px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #17847e" x="578.16" y="114.93416" transform="rotate(-0 578.16 114.93416)">∃x (M(x) ∧ G(x))</text>
