<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="680" viewBox="0 0 1350 680"><rect x="0" y="0" width="1350" height="680" fill="#ffffff"/><text x="54.0" y="69.0" font-size="48" font-weight="700" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" fill="#21354b" text-anchor="start">集合恒等式不成立：一个元素就能构造反例</text><text x="55.0" y="116.0" font-size="29" font-weight="400" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" fill="#52687b" text-anchor="start">以 A=E、B=∅、C=E 为例，A∪B=A∪C 都是 E</text><path d="M54 134 H1296" stroke="#d9e6ef" stroke-width="2"/><rect x="110" y="188" width="310" height="310" rx="12" fill="#f3f8fb" stroke="#b2cbdc" stroke-width="2"/><rect x="131" y="209" width="268" height="268" rx="8" fill="#3186c6" opacity="0.88"/><text x="265.0" y="550.0" font-size="36" font-weight="700" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" fill="#21354b" text-anchor="middle">A=E</text><rect x="520" y="188" width="310" height="310" rx="12" fill="#f3f8fb" stroke="#b2cbdc" stroke-width="2"/><text x="675.0" y="550.0" font-size="36" font-weight="700" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" fill="#21354b" text-anchor="middle">B=∅</text><rect x="930" y="188" width="310" height="310" rx="12" fill="#f3f8fb" stroke="#b2cbdc" stroke-width="2"/><rect x="951" y="209" width="268" height="268" rx="8" fill="#3186c6" opacity="0.88"/><text x="1085.0" y="550.0" font-size="36" font-weight="700" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" fill="#21354b" text-anchor="middle">C=E</text><text x="675.0" y="622.0" font-size="30" font-weight="600" font-family="Noto Sans CJK SC,DejaVu Sans,sans-serif" fill="#52687b" text-anchor="middle">虽然两边并集相等，但 B ≠ C；须再有 A∩B = A∩C</text></svg>