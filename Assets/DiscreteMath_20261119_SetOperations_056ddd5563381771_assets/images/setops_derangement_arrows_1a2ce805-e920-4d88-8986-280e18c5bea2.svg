<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="650px" version="1.1" viewBox="0 0 1200 650" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="650" width="1200" x="0" y="0" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="39" font-weight="700" text-anchor="start" x="51" y="58">错排：每个人都不能领到自己的帽子</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="34" font-weight="600" text-anchor="middle" x="600" y="128">一个合法错排：1→2，2→3，3→1</text><circle cx="260" cy="220" fill="#e3f1fd" opacity="1" r="47" stroke="#176fc1" stroke-width="4" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" text-anchor="middle" x="260" y="229">人 1</text><circle cx="260" cy="345" fill="#e3f1fd" opacity="1" r="47" stroke="#176fc1" stroke-width="4" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" text-anchor="middle" x="260" y="354">人 2</text><circle cx="260" cy="470" fill="#e3f1fd" opacity="1" r="47" stroke="#176fc1" stroke-width="4" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" text-anchor="middle" x="260" y="479">人 3</text><circle cx="870" cy="220" fill="#fff0dc" opacity="1" r="47" stroke="#ec8a37" stroke-width="4" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" text-anchor="middle" x="870" y="229">帽 1</text><circle cx="870" cy="345" fill="#fff0dc" opacity="1" r="47" stroke="#ec8a37" stroke-width="4" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" text-anchor="middle" x="870" y="354">帽 2</text><circle cx="870" cy="470" fill="#fff0dc" opacity="1" r="47" stroke="#ec8a37" stroke-width="4" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="28" font-weight="400" text-anchor="middle" x="870" y="479">帽 3</text><line stroke="#176fc1" stroke-linecap="round" stroke-width="5" x1="325" x2="796" y1="220" y2="345" /><polygon fill="#176fc1" opacity="1" points="796,345 781.877423046526,331.94041270969075 777.2601899536292,349.3381470037262" stroke="none" stroke-width="2" /><line stroke="#8356ba" stroke-linecap="round" stroke-width="5" x1="325" x2="796" y1="345" y2="470" /><polygon fill="#8356ba" opacity="1" points="796,470 781.877423046526,456.94041270969075 777.2601899536292,474.3381470037262" stroke="none" stroke-width="2" /><line stroke="#3e987e" stroke-linecap="round" stroke-width="5" x1="325" x2="796" y1="470" y2="220" /><polygon fill="#3e987e" opacity="1" points="796,220 776.7646269998573,220.02062875138944 785.2036616591771,235.9197700495477" stroke="none" stroke-width="2" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="30" font-weight="400" text-anchor="middle" x="600" y="608">关键限制：每条对应箭头都不能水平指向同编号</text></svg>