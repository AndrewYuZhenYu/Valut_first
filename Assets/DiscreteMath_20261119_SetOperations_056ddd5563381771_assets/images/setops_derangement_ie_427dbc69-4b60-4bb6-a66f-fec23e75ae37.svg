<svg baseProfile="full" height="650px" version="1.1" viewBox="0 0 1200 650" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="650" width="1200" x="0" y="0" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="37" font-weight="700" text-anchor="start" x="40" y="56">错排数：剔除“至少一个位置恰好正确”的排列</text><rect fill="#f7f9fc" height="91" opacity="1" rx="10" ry="10" stroke="#d8e2ed" stroke-width="2" width="1045" x="79" y="98" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="30" font-weight="600" text-anchor="start" x="110" y="154">全部排列</text><text fill="#176fc1" font-family="DejaVu Sans" font-size="33" font-weight="400" text-anchor="middle" x="798" y="154">n!</text><rect fill="#f7f9fc" height="91" opacity="1" rx="10" ry="10" stroke="#d8e2ed" stroke-width="2" width="1045" x="79" y="204" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="30" font-weight="600" text-anchor="start" x="110" y="260">固定 1 位</text><text fill="#ec8a37" font-family="DejaVu Sans" font-size="33" font-weight="400" text-anchor="middle" x="798" y="260">− C(n,1)(n−1)!</text><rect fill="#f7f9fc" height="91" opacity="1" rx="10" ry="10" stroke="#d8e2ed" stroke-width="2" width="1045" x="79" y="310" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="30" font-weight="600" text-anchor="start" x="110" y="366">固定 2 位</text><text fill="#176fc1" font-family="DejaVu Sans" font-size="33" font-weight="400" text-anchor="middle" x="798" y="366">+ C(n,2)(n−2)!</text><rect fill="#f7f9fc" height="91" opacity="1" rx="10" ry="10" stroke="#d8e2ed" stroke-width="2" width="1045" x="79" y="416" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="30" font-weight="600" text-anchor="start" x="110" y="472">固定 3 位</text><text fill="#ec8a37" font-family="DejaVu Sans" font-size="33" font-weight="400" text-anchor="middle" x="798" y="472">− C(n,3)(n−3)!</text><text fill="#17253c" font-family="DejaVu Sans" font-size="32" font-weight="700" text-anchor="middle" x="600" y="604">Dₙ = n! [1 − 1/1! + 1/2! − ··· + (−1)ⁿ/n!]</text></svg>