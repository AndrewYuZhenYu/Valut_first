<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="650px" version="1.1" viewBox="0 0 1200 650" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="650" width="1200" x="0" y="0" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="40" font-weight="700" text-anchor="start" x="44" y="55">A − B = ∅ 当且仅当 A ⊆ B</text><rect fill="#fbfcfe" height="440" opacity="1" rx="10" ry="10" stroke="#b7c5d3" stroke-width="3" width="1028" x="86" y="117" /><circle cx="600" cy="331" fill="#ddeeff" opacity="1" r="205" stroke="#176fc1" stroke-width="4" /><circle cx="535" cy="348" fill="#ffdcb9" opacity="1" r="112" stroke="#ec8a37" stroke-width="4" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="40" font-weight="700" text-anchor="start" x="746" y="240">B</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="44" font-weight="700" text-anchor="middle" x="528" y="358">A</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="29" font-weight="400" text-anchor="middle" x="600" y="615">A 的每个点也都在 B 中，因此“只在 A 的点”不存在</text></svg>