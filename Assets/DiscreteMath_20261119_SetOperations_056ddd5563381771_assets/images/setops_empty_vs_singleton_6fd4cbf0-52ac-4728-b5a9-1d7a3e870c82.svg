<svg baseProfile="full" height="650px" version="1.1" viewBox="0 0 1200 650" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="650" width="1200" x="0" y="0" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="40" font-weight="700" text-anchor="start" x="50" y="58">空集 ∅ 与单元素集合 {∅} 不能混淆</text><rect fill="#f7faff" height="373" opacity="1" rx="15" ry="15" stroke="#96b1c8" stroke-width="3" width="438" x="105" y="127" /><rect fill="#f7faff" height="373" opacity="1" rx="15" ry="15" stroke="#96b1c8" stroke-width="3" width="438" x="658" y="127" /><text fill="#17253c" font-family="DejaVu Sans" font-size="66" font-weight="700" text-anchor="middle" x="325" y="239">∅</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="33" font-weight="400" text-anchor="middle" x="325" y="382">没有任何元素</text><text fill="#17253c" font-family="DejaVu Sans" font-size="64" font-weight="700" text-anchor="middle" x="870" y="229">{∅}</text><circle cx="869" cy="365" fill="#e4eeff" opacity="1" r="74" stroke="#176fc1" stroke-width="4" /><text fill="#17253c" font-family="DejaVu Sans" font-size="53" font-weight="400" text-anchor="middle" x="869" y="384">∅</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="27" font-weight="400" text-anchor="middle" x="869" y="459">元素是空集，基数为 1</text><text fill="#17253c" font-family="DejaVu Sans" font-size="32" font-weight="400" text-anchor="middle" x="600" y="604">∩ {∅, {∅}} = ∅   /   ∪ {∅, {∅}} = {∅}</text></svg>