<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="650px" version="1.1" viewBox="0 0 1200 650" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="650" width="1200" x="0" y="0" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="37" font-weight="700" text-anchor="start" x="43" y="57">欧拉乘积公式：用容斥剔除每个素因子的倍数</text><rect fill="#f5f9fc" height="168" opacity="1" rx="12" ry="12" stroke="#abc0d2" stroke-width="2" width="346" x="90" y="150" /><text fill="#17253c" font-family="DejaVu Sans" font-size="35" font-weight="700" text-anchor="middle" x="263" y="207">p = 2</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="29" font-weight="400" text-anchor="middle" x="263" y="278">30 中含此因子：15 个</text><rect fill="#f5f9fc" height="168" opacity="1" rx="12" ry="12" stroke="#abc0d2" stroke-width="2" width="346" x="462" y="150" /><text fill="#17253c" font-family="DejaVu Sans" font-size="35" font-weight="700" text-anchor="middle" x="635" y="207">p = 3</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="29" font-weight="400" text-anchor="middle" x="635" y="278">30 中含此因子：10 个</text><rect fill="#f5f9fc" height="168" opacity="1" rx="12" ry="12" stroke="#abc0d2" stroke-width="2" width="346" x="834" y="150" /><text fill="#17253c" font-family="DejaVu Sans" font-size="35" font-weight="700" text-anchor="middle" x="1007" y="207">p = 5</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="29" font-weight="400" text-anchor="middle" x="1007" y="278">30 中含此因子：6 个</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="34" font-weight="400" text-anchor="middle" x="600" y="413">加入两项交集、三项交集的容斥修正</text><text fill="#17253c" font-family="DejaVu Sans" font-size="36" font-weight="700" text-anchor="middle" x="600" y="510">30 − (15+10+6) + (5+3+2) − 1 = 8</text><text fill="#17253c" font-family="DejaVu Sans" font-size="32" font-weight="400" text-anchor="middle" x="600" y="586">= 30 × (1−1/2) × (1−1/3) × (1−1/5)</text></svg>