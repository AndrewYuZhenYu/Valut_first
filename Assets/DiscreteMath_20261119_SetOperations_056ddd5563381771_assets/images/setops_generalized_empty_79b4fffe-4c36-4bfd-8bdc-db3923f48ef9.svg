<svg baseProfile="full" height="650px" version="1.1" viewBox="0 0 1200 650" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="650" width="1200" x="0" y="0" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="37" font-weight="700" text-anchor="start" x="45" y="57">只要广义交的集合族包含 ∅，结果必为 ∅</text><rect fill="#f8fbfe" height="228" opacity="1" rx="16" ry="16" stroke="#aabed0" stroke-width="3" width="345" x="80" y="185" /><circle cx="178" cy="293" fill="#176fc1" opacity="1" r="39" stroke="none" stroke-width="1" /><text fill="white" font-family="DejaVu Sans" font-size="39" font-weight="400" text-anchor="middle" x="178" y="307">1</text><circle cx="318" cy="293" fill="#8356ba" opacity="1" r="39" stroke="none" stroke-width="1" /><text fill="white" font-family="DejaVu Sans" font-size="39" font-weight="400" text-anchor="middle" x="318" y="307">2</text><text fill="#17253c" font-family="DejaVu Sans" font-size="27" font-weight="400" text-anchor="middle" x="252" y="474">X₁ = {1,2}</text><rect fill="#f8fbfe" height="228" opacity="1" rx="16" ry="16" stroke="#aabed0" stroke-width="3" width="345" x="458" y="185" /><text fill="#ce545d" font-family="DejaVu Sans" font-size="90" font-weight="400" text-anchor="middle" x="630" y="322">∅</text><text fill="#17253c" font-family="DejaVu Sans" font-size="27" font-weight="400" text-anchor="middle" x="630" y="474">X₂ = ∅</text><rect fill="#f8fbfe" height="228" opacity="1" rx="16" ry="16" stroke="#aabed0" stroke-width="3" width="345" x="836" y="185" /><circle cx="934" cy="293" fill="#8356ba" opacity="1" r="39" stroke="none" stroke-width="1" /><text fill="white" font-family="DejaVu Sans" font-size="39" font-weight="400" text-anchor="middle" x="934" y="307">2</text><circle cx="1074" cy="293" fill="#8356ba" opacity="1" r="39" stroke="none" stroke-width="1" /><text fill="white" font-family="DejaVu Sans" font-size="39" font-weight="400" text-anchor="middle" x="1074" y="307">3</text><text fill="#17253c" font-family="DejaVu Sans" font-size="27" font-weight="400" text-anchor="middle" x="1008" y="474">X₃ = {2,3}</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="33" font-weight="600" text-anchor="middle" x="600" y="583">所有成员必须同时出现，但 ∅ 里没有任何成员</text></svg>