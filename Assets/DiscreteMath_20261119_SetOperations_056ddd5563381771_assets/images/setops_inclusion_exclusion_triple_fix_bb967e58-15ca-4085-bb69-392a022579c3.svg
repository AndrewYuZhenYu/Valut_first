<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="650px" version="1.1" viewBox="0 0 1200 650" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="650" width="1200" x="0" y="0" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="38" font-weight="700" text-anchor="start" x="41" y="55">三重交集为什么要“加回来”？逐轮核算其系数</text><rect fill="#f7faff" height="112" opacity="1" rx="12" ry="12" stroke="#becbd7" stroke-width="2" width="1025" x="83" y="102" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="32" font-weight="600" text-anchor="start" x="118" y="170">① 三个单集相加</text><text fill="#176fc1" font-family="DejaVu Sans" font-size="60" font-weight="700" text-anchor="middle" x="960" y="177">3</text><text fill="#52657c" font-family="DejaVu Sans" font-size="34" font-weight="400" text-anchor="middle" x="540" y="170">+1 +1 +1 = 3</text><rect fill="#f7faff" height="112" opacity="1" rx="12" ry="12" stroke="#becbd7" stroke-width="2" width="1025" x="83" y="238" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="32" font-weight="600" text-anchor="start" x="118" y="306">② 减去三组两两交集</text><text fill="#ec8a37" font-family="DejaVu Sans" font-size="60" font-weight="700" text-anchor="middle" x="960" y="313">0</text><text fill="#52657c" font-family="DejaVu Sans" font-size="34" font-weight="400" text-anchor="middle" x="540" y="306">3 −1 −1 −1 = 0</text><rect fill="#f7faff" height="112" opacity="1" rx="12" ry="12" stroke="#becbd7" stroke-width="2" width="1025" x="83" y="374" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="32" font-weight="600" text-anchor="start" x="118" y="442">③ 加回三重交集</text><text fill="#8356ba" font-family="DejaVu Sans" font-size="60" font-weight="700" text-anchor="middle" x="960" y="449">1</text><text fill="#52657c" font-family="DejaVu Sans" font-size="34" font-weight="400" text-anchor="middle" x="540" y="442">0 +1 = 1</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="32" font-weight="700" text-anchor="middle" x="600" y="609">三重公共元素最终计数 1 次</text></svg>