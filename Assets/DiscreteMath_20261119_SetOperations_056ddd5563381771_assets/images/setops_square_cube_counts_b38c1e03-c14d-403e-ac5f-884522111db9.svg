<svg baseProfile="full" height="650px" version="1.1" viewBox="0 0 1200 650" width="1200px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="650" width="1200" x="0" y="0" /><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="37" font-weight="700" text-anchor="start" x="45" y="57">1～10000：计数平方、立方，再减去重复的六次方</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="33" font-weight="600" text-anchor="start" x="84" y="198">平方数</text><rect fill="#edf2f8" height="60" opacity="1" rx="12" ry="12" stroke="none" stroke-width="1" width="610" x="390" y="165" /><rect fill="#176fc1" height="60" opacity="1" rx="12" ry="12" stroke="none" stroke-width="1" width="610.0" x="390" y="165" /><text fill="#17253c" font-family="DejaVu Sans" font-size="42" font-weight="700" text-anchor="start" x="1042" y="208">100</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="33" font-weight="600" text-anchor="start" x="84" y="323">立方数</text><rect fill="#edf2f8" height="60" opacity="1" rx="12" ry="12" stroke="none" stroke-width="1" width="610" x="390" y="290" /><rect fill="#ec8a37" height="60" opacity="1" rx="12" ry="12" stroke="none" stroke-width="1" width="128.1" x="390" y="290" /><text fill="#17253c" font-family="DejaVu Sans" font-size="42" font-weight="700" text-anchor="start" x="1042" y="333">21</text><text fill="#17253c" font-family="Noto Sans CJK SC" font-size="33" font-weight="600" text-anchor="start" x="84" y="448">重复的六次方</text><rect fill="#edf2f8" height="60" opacity="1" rx="12" ry="12" stroke="none" stroke-width="1" width="610" x="390" y="415" /><rect fill="#8356ba" height="60" opacity="1" rx="12" ry="12" stroke="none" stroke-width="1" width="24.4" x="390" y="415" /><text fill="#17253c" font-family="DejaVu Sans" font-size="42" font-weight="700" text-anchor="start" x="1042" y="458">4</text><text fill="#17253c" font-family="DejaVu Sans" font-size="39" font-weight="700" text-anchor="middle" x="600" y="612">10000 − 100 − 21 + 4 = 9883</text></svg>