<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投资学特别专栏 · 离线计算器</title><style>
:root{color-scheme:light dark;--blue:#2866a4;--red:#c74540;--green:#16816f}body{font-family:system-ui,"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;max-width:1050px;margin:auto;padding:24px;line-height:1.65}h1{font-size:26px}h2{font-size:19px}section{border:1px solid #a0aebc80;border-radius:12px;padding:18px;margin:18px 0}label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:9px 0}input[type=range]{flex:1;min-width:90px;accent-color:var(--blue)}input[type=number]{width:125px;padding:7px;border:1px solid #a0aebc;border-radius:5px}output{min-width:66px;text-align:right;font-variant-numeric:tabular-nums}p.results{font-weight:600;white-space:pre-line;background:#2866a410;padding:13px;border-radius:6px}small{opacity:.8}svg{max-width:100%;height:auto;display:block;margin:12px auto}button{padding:8px 14px;border-radius:6px;border:1px solid #a0aebc;background:transparent;color:inherit;cursor:pointer}nav a{margin-right:12px} .check{justify-content:flex-start;align-items:flex-start} .check input{margin-top:7px} .warning{color:#c37d28;font-size:14px}</style></head><body><h1>投资学特别专栏 · 离线计算器</h1><p>本页将原回答中的交互演示保留为不依赖网络的 HTML。全部为教学假设，不使用实时股票数据，不是交易指令或收益保证。静态图和公式仍保存在 Markdown 正文中。</p><nav id="nav"></nav><main id="main"></main><section id="check"><h2>股票投资决策自检（26.2）</h2><div id="checks"></div><p id="checkcount"></p><button id="resetChecks">重置清单</button><p><small>全部勾选仅代表完成相关自检，不代表投资一定能够盈利。</small></p></section><script>
const fmt=(v,n=2)=>Number.isFinite(v)?v.toLocaleString('zh-CN',{maximumFractionDigits:n,minimumFractionDigits:n}):'—';
const configs=[
{id:'kline',title:'5.7 K线结构计算与形态识别',fields:[['o','开盘价',10,8,12,.1],['c','收盘价',10.2,8,12,.1],['h','最高价',10.3,8,12,.1],['l','最低价',9.2,8,12,.1]], calc:v=>{let {o,c,h,l}=v;if(h<Math.max(o,c)||l>Math.min(o,c)||h<=l)return ['当前价格组合不符合K线条件。',''];let b=Math.abs(c-o),r=h-l,u=h-Math.max(o,c),d=Math.min(o,c)-l;let match=b>1e-8&&d>=2*b-1e-8&&b/r<=.350001&&u/r<=.150001;let y=p=>190-(p-8)*42,col=c>o?'#c74540':c<o?'#16816f':'#8294a5';let svg=`<svg viewBox="0 0 300 220" width="340" xmlns="http://www.w3.org/2000/svg">${[8,9,10,11,12].map(p=>`<line x1="45" x2="275" y1="${y(p)}" y2="${y(p)}" stroke="#8294a5" stroke-opacity=".25"/><text x="32" y="${y(p)+4}" fill="currentColor" font-size="12" text-anchor="end">${p}</text>`).join('')}<line x1="150" x2="150" y1="${y(h)}" y2="${y(l)}" stroke="${col}" stroke-width="3"/><rect x="132" y="${y(Math.max(c,o))}" width="36" height="${Math.max(2,b*42)}" fill="${col}"/></svg>`;return [`实体长度：${fmt(b)}\n上影线：${fmt(u)}\n下影线：${fmt(d)}\n实体占比：${fmt(b/r*100,1)}%\n${match?'符合示例长下影小实体结构':'不符合示例锤形结构条件'}`,svg]},note:'仅识别几何结构，还需结合此前趋势。阈值为教学研究参数。'},
{id:'davis',title:'13.6 盈利增长与估值变化',fields:[['eps','未来每股收益（元）',2.5,.5,4,.1],['pe','未来市盈率（倍）',25,5,40,1]],calc:v=>[`理论股价：${fmt(v.eps*v.pe)}元\n相对初始40元变化：${fmt((v.eps*v.pe/40-1)*100)}%`,''],note:'初始EPS 2元、PE 20倍；数学关系，不是股票预测。'},
{id:'score',title:'14.4 综合选股评分',fields:[['a','企业经营质量（25%）',7,0,10,1],['b','行业及增长前景（20%）',7,0,10,1],['c','估值合理性（20%）',6,0,10,1],['d','趋势与量价结构（20%）',8,0,10,1],['e','财务及流动性安全（15%）',7,0,10,1]],calc:v=>{let vals=Object.values(v),xy=(i,r)=>[150+105*r*Math.cos(-Math.PI/2+i*2*Math.PI/5),130+105*r*Math.sin(-Math.PI/2+i*2*Math.PI/5)].join(',');let svg=`<svg viewBox="0 0 300 260" width="300">${[.25,.5,.75,1].map(r=>`<polygon points="${vals.map((_,i)=>xy(i,r)).join(' ')}" fill="none" stroke="#8294a5" stroke-opacity=".5"/>`).join('')}<polygon points="${vals.map((a,i)=>xy(i,a/10)).join(' ')}" fill="#2866a4" fill-opacity=".2" stroke="#2866a4" stroke-width="2"/></svg>`;return [`综合得分：${fmt(vals.reduce((a,x,i)=>a+x*[25,20,20,20,15][i]/10,0),1)} / 100`,svg]},note:'评分和权重均为教学示例，不能换算为上涨概率。'},
{id:'position',title:'17.4 仓位与单次交易风险',fields:[['a','投资资金（元）',100000,null,null,1],['p','预计进入价格',20,null,null,.01],['s','失效参考价格',19,null,null,.01],['r','假设单次风险预算（%）',1,.25,3,.25]],calc:v=>{let {a,p,s,r}=v;if(!(a>0&&p>s&&s>=0))return ['请输入有效资金和价格；普通多头失效价格应低于进入价格。',''];let risk=a*r/100,theory=Math.floor(risk/(p-s)),q=Math.min(theory,Math.floor(a/p));return [`计划亏损预算：${fmt(risk)}元\n每股计划风险：${fmt(p-s)}元\n无杠杆计算股数：${fmt(q,0)}股\n对应仓位比例：${fmt(q*p/a*100)}%${q<theory?'\n已按照无杠杆资金上限限制股数。':''}`,'']},note:'未考虑交易单位、费用和跳空。预算不是实际亏损上限。'},
{id:'ev',title:'18.3 交易策略数学期望',fields:[['p','假设交易胜率（%）',45,10,90,1],['w','平均盈利金额（元）',200,20,500,10],['l','平均亏损金额（元）',100,20,500,10],['c','每次平均交易成本（元）',10,0,50,1]],calc:v=>{let e=v.p/100*v.w-(1-v.p/100)*v.l-v.c;return [`实际假设盈亏比：${fmt(v.w/v.l)} : 1\n单次理论净期望：${fmt(e)}元\n盈亏平衡胜率：${fmt((v.l+v.c)/(v.w+v.l)*100)}%\n100次交易期望合计：${fmt(e*100)}元`,'']},note:'假设每次交易金额与概率结构不变，不计复利；正期望不保证实际盈利。'},
{id:'bond',title:'20.2 债券价格与市场要求收益率',fields:[['r','市场要求收益率（%）',5,1,10,.5]],calc:v=>{let bp=r=>Array.from({length:5},(_,i)=>50/(1+r/100)**(i+1)).reduce((a,b)=>a+b,0)+1000/(1+r/100)**5,x=r=>40+(r-1)*30,y=b=>160-(b-750)*.30,svg=`<svg viewBox="0 0 340 200" width="430"><path d="M40 12 V160 H320" fill="none" stroke="#8294a5"/>${[800,900,1000,1100,1200].map(b=>`<line x1="40" x2="320" y1="${y(b)}" y2="${y(b)}" stroke="#8294a5" stroke-opacity=".18"/><text x="34" y="${y(b)+4}" text-anchor="end" fill="currentColor" font-size="10">${b}</text>`).join('')}<polyline points="${Array.from({length:91},(_,i)=>{let r=1+i/10;return x(r)+','+y(bp(r))}).join(' ')}" stroke="#2866a4" stroke-width="2.5" fill="none"/><circle cx="${x(v.r)}" cy="${y(bp(v.r))}" r="5" fill="#b38332"/>${[1,3,5,7,10].map(r=>`<text x="${x(r)}" y="178" text-anchor="middle" fill="currentColor" font-size="11">${r}%</text>`).join('')}</svg>`;return [`理论债券价格：${fmt(bp(v.r))}元`,svg]},note:'面值1000元、票息5%、每年付息、五年到期，现金流固定并正常履约。'},
{id:'cb',title:'20.4 可转债转股价值与溢价率',fields:[['s','正股价格（元）',12,3,25,.5],['b','转债价格（元）',130,70,250,1]],calc:v=>[`理论转股价值：${fmt(v.s*10)}元\n转股溢价率：${fmt((v.b/(v.s*10)-1)*100)}%`,''],note:'面值100元、转股价10元。忽略实际转股单位、费用、期限和其他条款。'},
{id:'futures',title:'21.3 期货保证金与杠杆',fields:[['m','保证金比例（%）',10,5,50,5],['p','合约价格变化（%）',-3,-15,15,1]],calc:v=>[`初始保证金：${fmt(400000*v.m/100,0)}元\n理论合约盈亏：${fmt(400000*v.p/100,0)}元\n名义杠杆：${fmt(100/v.m,1)}倍\n盈亏 / 初始保证金：${fmt(v.p/v.m*100,1)}%`,''],note:'虚构多头合约，名义价值40万元。实际交易可能追加保证金或强制平仓，损失可能超过初始保证金。'}];
const main=document.querySelector('#main'),nav=document.querySelector('#nav');
for(const config of configs){let a=document.createElement('a');a.href='#'+config.id;a.textContent=config.title.split(' ')[0];nav.append(a);let section=document.createElement('section');section.id=config.id;let h=document.createElement('h2');h.textContent=config.title;section.append(h);let values={},inputs=[];for(const [id,lab,def,min,max,step] of config.fields){values[id]=def;let label=document.createElement('label');let span=document.createElement('span');span.textContent=lab;let input=document.createElement('input');input.type=min===null?'number':'range';input.value=def;input.step=step;if(min!==null){input.min=min;input.max=max}let out=document.createElement('output');out.textContent=def;label.append(span,input,out);section.append(label);inputs.push([input,out,id,def]);input.addEventListener('input',()=>{values[id]=input.valueAsNumber;out.textContent=input.value;update()})}let result=document.createElement('p');result.className='results';let visual=document.createElement('div');let reset=document.createElement('button');reset.textContent='恢复初始参数';reset.onclick=()=>{for(let [i,o,k,d] of inputs){i.value=d;o.textContent=d;values[k]=d}update()};let note=document.createElement('p');note.className='warning';note.textContent=config.note;section.append(result,visual,reset,note);main.append(section);function update(){let [text,svg]=config.calc(values);result.textContent=text;visual.innerHTML=svg}update()}
const checks=['了解该股票代表的企业及相关股权','核查近期重大公告和财务信息','了解大盘、行业及个股趋势','明确当前价格处于什么结构位置','了解成交量、技术指标的实际含义','具有明确而可检验的投资逻辑','知道什么情况意味着原判断失效','分析了估值及悲观经营情景','考虑真实交易费用与成交限制','设定符合资金目标的风险预算','检查了组合集中度与流动性','不会因短期情绪随意修改交易计划'];let cbox=document.querySelector('#checks');for(let c of checks){let l=document.createElement('label');l.className='check';let input=document.createElement('input');input.type='checkbox';l.append(input,document.createTextNode(c));cbox.append(l);input.addEventListener('change',count)}function count(){document.querySelector('#checkcount').textContent=`已完成 ${cbox.querySelectorAll(':checked').length}/${checks.length}`}document.querySelector('#resetChecks').onclick=()=>{cbox.querySelectorAll('input').forEach(i=>i.checked=false);count()};count();</script></body></html>
