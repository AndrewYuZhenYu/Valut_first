<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>项目挣值管理计算器</title><style>body{font:18px system-ui,sans-serif;max-width:780px;margin:24px auto;padding:20px;color:#203047;background:#f5f8fc}h1{font-size:25px}label{display:flex;justify-content:space-between;margin:18px 0 3px}input{width:100%;accent-color:#2563a6}#result{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin:26px 0}article{background:white;border:1px solid #d4dee9;border-radius:9px;padding:14px}b{font-size:24px;color:#2563a6;display:block;margin-top:10px}svg{width:100%;background:white}small{color:#64748b}</style><h1>项目挣值管理计算器</h1><div id="controls"></div><div id="result"></div><svg id="chart" viewBox="0 0 700 300" style="display:none"></svg><p><small>虚构项目。SV不直接等于延误天数。</small></p><script>const key="evm",spec=[["计划价值 PV（万元）", 50, 5, 100, 5], ["挣值 EV（万元）", 40, 5, 100, 5], ["实际成本 AC（万元）", 45, 5, 100, 5]],v=spec.map(s=>s[1]);const calculate=v=>{let [p,e,a]=v;return [['成本偏差 CV',(e-a)+'万元'],['进度偏差 SV',(e-p)+'万元'],['成本绩效指数 CPI',(e/a).toFixed(2)],['进度绩效指数 SPI',(e/p).toFixed(2)]]};const ns='http://www.w3.org/2000/svg',result=document.getElementById('result'),chart=document.getElementById('chart'),controls=document.getElementById('controls');function draw(){result.replaceChildren();for(let [name,value] of calculate(v)){let a=document.createElement('article'),b=document.createElement('b');a.textContent=name;b.textContent=value;a.append(b);result.append(a)}if(key==='eoq'||key==='bep'){chart.style.display='block';chart.innerHTML='';function el(tag,p,txt){let e=document.createElementNS(ns,tag);for(let k in p)e.setAttribute(k,p[k]);if(txt)e.textContent=txt;chart.append(e)}let sets=[],xmax,ymax,mark,labels;if(key==='eoq'){let [d,s,h]=v,q=Math.sqrt(2*d*s/h);xmax=q*3;let x0=q/8;ymax=d*s/x0+h*x0/2;sets=[x=>d*s/x,x=>h*x/2,x=>d*s/x+h*x/2];mark=[q,d*s/q+h*q/2];labels=['订货成本','持有成本','合计成本']}else{let [p,c,f]=v,q=p>c?f/(p-c):0;xmax=q?2*q:Math.max(100,2*f/Math.max(p,1));ymax=Math.max(p*xmax,f+c*xmax);sets=[x=>p*x,x=>f+c*x];mark=q?[q,p*q]:null;labels=['销售收入','总成本']}let X=x=>55+x/xmax*610,Y=y=>240-y/ymax*200,colors=['#2563a6','#94702c','#7960a6'];el('path',{d:'M55 30 V240 H670',stroke:'#64748b',fill:'none'});for(let j=0;j<sets.length;j++){let a=[];for(let i=key==='eoq'?5:0;i<=120;i++){let x=i*xmax/120,y=sets[j](x);if(y<=ymax*1.05)a.push(X(x)+','+Y(y))}el('polyline',{points:a.join(' '),stroke:colors[j],fill:'none','stroke-width':3});el('text',{x:70+j*200,y:275,'font-size':14,fill:colors[j]},labels[j])}if(mark){el('circle',{cx:X(mark[0]),cy:Y(mark[1]),r:5,fill:'#7960a6'});el('text',{x:X(mark[0])+10,y:Y(mark[1])-10,'font-size':13},mark[0].toFixed(1)+'件')}}}spec.forEach((s,i)=>{let l=document.createElement('label'),o=document.createElement('span'),r=document.createElement('input');l.textContent=s[0];o.textContent=v[i];l.append(o);r.type='range';r.min=s[2];r.max=s[3];r.step=s[4];r.value=v[i];r.oninput=()=>{v[i]=+r.value;o.textContent=v[i];draw()};controls.append(l,r)});draw()</script></html>
