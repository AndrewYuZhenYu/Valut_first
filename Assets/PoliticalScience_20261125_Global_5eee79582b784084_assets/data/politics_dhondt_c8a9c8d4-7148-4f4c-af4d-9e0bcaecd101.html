<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>比例代表制议席分配演示</title><style>body{font-family:system-ui,sans-serif;max-width:740px;margin:40px auto;padding:0 20px;color:#23374b;line-height:1.7}label{display:block;font-weight:600;margin-top:18px}input{width:100%;accent-color:#3979b8}output{float:right}.track{height:25px;background:#edf3f8;overflow:hidden;border-radius:5px}.track i{display:block;height:25px;background:#3979b8}#out{padding:20px;margin-top:25px;background:#f2f6fa;border-radius:8px}small{display:block;margin-top:20px}</style></head><body><h1>比例代表制议席分配演示</h1><div id="controls"></div><div id="out"></div><small>虚构政党；不含门槛、选区及特殊分配规则；同商值依A、B、C顺序。</small><script>const config=[["A党票数", 40, 1, 100, 1], ["B党票数", 35, 1, 100, 1], ["C党票数", 25, 1, 100, 1], ["议席总量", 10, 3, 50, 1]];const colors=['#3979b8','#a68142','#7966a8'],controls=document.getElementById('controls'),out=document.getElementById('out');controls.innerHTML=config.map((x,i)=>`<label for="s${i}">${x[0]}<output id="v${i}">${x[1]}</output></label><input id="s${i}" type="range" value="${x[1]}" min="${x[2]}" max="${x[3]}" step="${x[4]}">`).join('');function update(){let a=config.map((x,i)=>{let v=+document.getElementById('s'+i).value;document.getElementById('v'+i).textContent=v;return v;});const v=a.slice(0,3),s=a[3],sum=v.reduce((x,y)=>x+y,0),b=[0,0,0];for(let j=0;j<s;j++){let best=0;for(let i=1;i<3;i++)if(v[i]*(b[best]+1)>v[best]*(b[i]+1))best=i;b[best]++;}out.innerHTML=b.map((n,i)=>`<p>${'ABC'[i]}党：${(100*v[i]/sum).toFixed(1)}%选票，<strong>${n} 席</strong></p><div class="track"><i style="width:${100*n/s}%;background:${colors[i]}"></i></div>`).join('');}controls.addEventListener('input',update);update();</script></body></html>
