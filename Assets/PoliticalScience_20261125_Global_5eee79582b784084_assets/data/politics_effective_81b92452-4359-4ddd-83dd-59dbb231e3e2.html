<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>有效政党数量演示</title><style>body{font-family:system-ui,sans-serif;max-width:740px;margin:40px auto;padding:0 20px;color:#23374b;line-height:1.7}label{display:block;font-weight:600;margin-top:18px}input{width:100%;accent-color:#3979b8}output{float:right}.track{height:25px;background:#edf3f8;overflow:hidden;border-radius:5px}.track i{display:block;height:25px;background:#3979b8}#out{padding:20px;margin-top:25px;background:#f2f6fa;border-radius:8px}small{display:block;margin-top:20px}</style></head><body><h1>有效政党数量演示</h1><div id="controls"></div><div id="out"></div><small>虚构份额；指标只测量规模分布，不测量民主程度或治理绩效。</small><script>const config=[["A党相对票数", 45, 1, 100, 1], ["B党相对票数", 35, 1, 100, 1], ["C党相对票数", 20, 1, 100, 1]];const colors=['#3979b8','#a68142','#7966a8'],controls=document.getElementById('controls'),out=document.getElementById('out');controls.innerHTML=config.map((x,i)=>`<label for="s${i}">${x[0]}<output id="v${i}">${x[1]}</output></label><input id="s${i}" type="range" value="${x[1]}" min="${x[2]}" max="${x[3]}" step="${x[4]}">`).join('');function update(){let a=config.map((x,i)=>{let v=+document.getElementById('s'+i).value;document.getElementById('v'+i).textContent=v;return v;});const sum=a.reduce((x,y)=>x+y,0),p=a.map(x=>x/sum),N=1/p.reduce((s,x)=>s+x*x,0);out.innerHTML=`<p>名义政党数量：3</p><p>有效政党数量：<strong>${N.toFixed(3)}</strong></p><div class="track" style="display:flex">${p.map((x,i)=>`<i style="width:${100*x}%;background:${colors[i]}"></i>`).join('')}</div><p>${p.map((x,i)=>'ABC'[i]+'党 '+(x*100).toFixed(1)+'%').join(' / ')}</p>`;}controls.addEventListener('input',update);update();</script></body></html>
