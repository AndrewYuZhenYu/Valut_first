<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>民意调查抽样误差演示</title><style>body{font-family:system-ui,sans-serif;max-width:740px;margin:40px auto;padding:0 20px;color:#23374b;line-height:1.7}label{display:block;font-weight:600;margin-top:18px}input{width:100%;accent-color:#3979b8}output{float:right}.track{height:25px;background:#edf3f8;overflow:hidden;border-radius:5px}.track i{display:block;height:25px;background:#3979b8}#out{padding:20px;margin-top:25px;background:#f2f6fa;border-radius:8px}small{display:block;margin-top:20px}</style></head><body><h1>民意调查抽样误差演示</h1><div id="controls"></div><div id="out"></div><small>仅演示理想随机抽样下的近似随机误差，不包含系统性误差，不代表真实民调。</small><script>const config=[["样本数量", 1000, 100, 10000, 100], ["样本比例（%）", 50, 10, 90, 1]];const colors=['#3979b8','#a68142','#7966a8'],controls=document.getElementById('controls'),out=document.getElementById('out');controls.innerHTML=config.map((x,i)=>`<label for="s${i}">${x[0]}<output id="v${i}">${x[1]}</output></label><input id="s${i}" type="range" value="${x[1]}" min="${x[2]}" max="${x[3]}" step="${x[4]}">`).join('');function update(){let a=config.map((x,i)=>{let v=+document.getElementById('s'+i).value;document.getElementById('v'+i).textContent=v;return v;});const n=a[0],p=a[1],m=196*Math.sqrt(p/100*(1-p/100)/n);out.innerHTML=`<p>近似抽样误差：<strong>±${m.toFixed(2)} 个百分点</strong></p><p>近似95%置信区间：<strong>${(p-m).toFixed(2)}% — ${(p+m).toFixed(2)}%</strong></p><div class="track" style="position:relative"><i style="position:absolute;left:${p-m}%;width:${2*m}%"></i></div><p>0% — 100% 比例轴</p>`;}controls.addEventListener('input',update);update();</script></body></html>
