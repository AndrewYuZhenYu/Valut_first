<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大五人格维度组合演示</title><style>body{font:18px system-ui,sans-serif;max-width:680px;margin:24px auto;padding:16px;color:#203047;background:#f5f8fc}label{display:flex;justify-content:space-between;margin:15px 0 2px}input{width:100%}svg{width:100%;max-height:460px;background:white;border-radius:12px}small{color:#64748b}</style><h1>大五人格维度组合演示</h1><p>自由调整五项虚构分数，观察人格特征如何组合。不是人格测验，不用于诊断。</p><div id="sliders"></div><svg id="radar" viewBox="0 0 500 430"></svg><script>const ns="http://www.w3.org/2000/svg",names=["开放性","尽责性","外向性","宜人性","神经质"],v=[80,70,45,65,35];const a=i=>-Math.PI/2+i*2*Math.PI/5;const xy=(i,r)=>[250+r*Math.cos(a(i)),215+r*Math.sin(a(i))];const svg=document.querySelector("#radar");function el(n,p){let e=document.createElementNS(ns,n);for(const k in p)e.setAttribute(k,p[k]);svg.append(e);return e}function draw(){svg.innerHTML="";for(let r of [38,76,114,152])el("polygon",{points:names.map((_,i)=>xy(i,r).join(",")).join(" "),fill:"none",stroke:"#b5c6d7"});names.forEach((n,i)=>{const [x,y]=xy(i,152);el("line",{x1:250,y1:215,x2:x,y2:y,stroke:"#b5c6d7"});const [tx,ty]=xy(i,185);el("text",{x:tx,y:ty+6,"text-anchor":"middle","font-size":15,fill:"#203047"}).textContent=n+" "+v[i]});el("polygon",{points:v.map((n,i)=>xy(i,n*1.52).join(",")).join(" "),fill:"#2563a6","fill-opacity":.25,stroke:"#2563a6","stroke-width":3})}names.forEach((n,i)=>{let l=document.createElement("label"),s=document.createElement("span"),inp=document.createElement("input");l.textContent=n;s.textContent=v[i];l.append(s);inp.type="range";inp.min=0;inp.max=100;inp.step=5;inp.value=v[i];inp.oninput=()=>{v[i]=+inp.value;s.textContent=v[i];draw()};sliders.append(l,inp)});draw()</script></html>
